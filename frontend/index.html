}

function V2RoutingBanner({routing}) {
  if (!routing) return null;
  return (
    <div className="v2-routing">
      <div className="v2-routing-hdr">
        <span className={`v2-routing-source ${routing.source}`}>{routing.source}</span>
        <span>routed as <b>{routing.mode}</b> → target <b>{routing.target}</b></span>
        {routing.target_score > 0 && (
          <span className="v2-routing-score">(target match {(routing.target_score * 100).toFixed(0)}%)</span>
        )}
        {routing.confidence > 0 && (
          <span className="v2-routing-score">· confidence {(routing.confidence * 100).toFixed(0)}%</span>
        )}
      </div>
      {routing.rationale && (
        <div className="v2-routing-rationale">{routing.rationale}</div>
      )}
      {routing.matched_variables && routing.matched_variables.length > 0 && (
        <div className="v2-routing-matches">
          {routing.matched_variables.map((m, i) => (
            <span key={i} className="v2-routing-match">
              <b>{dsym(m)}</b> · {m.name}
              {m.unit && <span style={{color:'var(--text3)'}}> · {m.unit}</span>}
              <span className="v2-routing-score">{(m.score * 100).toFixed(0)}%</span>
            </span>
          ))}
        </div>
      )}
    </div>
  );
}

function V2ShiftsBanner({shifts, covariates}) {
  if (!shifts || shifts.length === 0) return null;
  // Group consecutive shifts on the same parameter so the cascade
  // (e.g. Currey a: 7 → 3.85 → 2.12 → 2.01) reads as one trace.
  return (
    <div className="v2-shifts-banner">
      <div className="v2-shifts-hdr">
        Covariate-driven parameter shifts · {v2CovSummary(covariates)}
      </div>
      <div className="v2-shifts-list">
        {shifts.map((s, i) => (
          <div key={i} className="v2-shift-row">
            <span className="v2-shift-key">{s.relation}·{s.parameter}</span>
            <span className="v2-shift-desc">
              {s.description}
              {' '}<span className="v2-shift-cite">— {s.citation}</span>
            </span>
            <span className="v2-shift-vals">{v2Fmt(s.before_mean)} → {v2Fmt(s.after_mean)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// Map a value in [lo, hi] to a percentage along a bar.
function v2Pct(x, lo, hi) {
  if (hi <= lo) return 0;
  const p = ((x - lo) / (hi - lo)) * 100;
  return Math.max(0, Math.min(100, p));
}

function V2ChainRow({result}) {
  return (
    <div className="v2-chain-row">
      {result.chain_vars.map((v, i) => {
        const isGiven    = result.given_info && result.given_info[v.symbol];
        const isInterv   = result.intervention_info && result.intervention_info[v.symbol];
        const isTarget   = v.symbol === result.target;
        const isInferred = result.inferred && result.inferred.some(p => p.variable.symbol === v.symbol);
        const cls = 'v2-var-pill'
          + (isGiven    ? ' v2-given-pill'  : '')
          + (isTarget   ? ' v2-target-pill' : '')
          + (isInterv   ? ' v2-target-pill' : '')
          + (isInferred ? ' v2-target-pill' : '');
        return (
          <Fragment key={i}>
            <span className={cls}>
              {dsym(v)}
              <span className="v2-var-name">{v.name}{v.unit ? ` · ${v.unit}` : ''}</span>
            </span>
            {i < result.chain_vars.length - 1 && <ChainArrow/>}
          </Fragment>
        );
      })}
    </div>
  );
}

function V2ForwardCard({result, elapsed}) {
  return (
    <div className="v2-card">
      <div className="v2-card-hdr">
        <div className="v2-card-title">
          Forward inference: {result.target_info.name}
          {' '}<span style={{color:'var(--text3)',fontWeight:400}}>({dsym(result.target_info)})</span>
        </div>
        <div className="v2-meta">
          {result.steps.length} step{result.steps.length === 1 ? '' : 's'} · n = {result.result.n_samples.toLocaleString()} samples · {elapsed}s
        </div>
      </div>

      <V2RoutingBanner routing={result.routing}/>

      <V2ChainRow result={result}/>

      <V2ShiftsBanner shifts={result.applied_shifts} covariates={result.covariates}/>

      {result.steps.map((s, i) => (
        <div key={i} className="v2-step">
          <div className="v2-step-hdr">
            <div className="v2-step-name">{i + 1}. {s.relation_name}</div>
            <div className="v2-step-citation">{s.citation}</div>
          </div>
          {s.description && <div style={{fontSize:12,color:'var(--text3)'}}>{s.description}</div>}
          {s.latex && <div className="v2-step-eq"><TeX tex={s.latex}/></div>}
          <div className="v2-step-io">
            {Object.entries(s.inputs).map(([k, v]) => (
              <span key={k} style={{fontFamily:'var(--mono)',fontSize:12}}>{(result.display_map && result.display_map[k]) || k} = {v2Fmt(v)}</span>
            ))}
            <span className="v2-io-arrow">→</span>
            <span className="v2-step-out">{(result.display_map && result.display_map[s.output_var]) || s.output_var} ≈ {v2Fmt(s.output_mean)} {s.output_unit}</span>
            <span className="v2-step-band">[P5 {v2Fmt(s.output_p5)} · P95 {v2Fmt(s.output_p95)}]</span>
          </div>
        </div>
      ))}

      <div className="v2-final">
        <div className="v2-final-lbl">Predicted {result.target_info.name}</div>
        <div className="v2-final-val">{v2Fmt(result.result.mean)} {result.result.unit}</div>
        <div className="v2-final-band">
          90% band: [{v2Fmt(result.result.p5)}, {v2Fmt(result.result.p95)}] {result.result.unit}
          {' · '}spread {v2Fmt(result.result.relative_uncertainty * 100, 2)}% of mean
        </div>
      </div>
    </div>
  );
}

function V2AbductiveCard({result, elapsed}) {
  return (
    <div className="v2-card">
      <div className="v2-card-hdr">
        <div className="v2-card-title">
          Abductive inference: {result.target_info.name}
          {' '}<span style={{color:'var(--text3)',fontWeight:400}}>({dsym(result.target_info)})</span>
        </div>
        <div className="v2-meta">
          ESS = {Math.round(result.result.effective_sample_size).toLocaleString()} / {result.result.n_samples.toLocaleString()} · {elapsed}s
        </div>
      </div>

      <V2RoutingBanner routing={result.routing}/>

      <V2ChainRow result={result}/>

      <V2ShiftsBanner shifts={result.applied_shifts} covariates={result.covariates}/>

      <div className="v2-abd-hdr">
        <span>Observed <b>{dsym(result.target_info)}</b> = <b>{v2Fmt(result.observed)} {result.target_info.unit}</b> ± {v2Fmt(result.observed_std)}</span>
        {Object.entries(result.given || {}).length > 0 && (
          <span>Held fixed: {Object.entries(result.given).map(([k, v], i) =>
            <span key={k} style={{marginRight:8}}>{k} = <b>{v2Fmt(v)}</b></span>
          )}</span>
        )}
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:0}}>
        {result.inferred.map((p, i) => {
          const lo = Math.min(p.prior_p5, p.posterior_p5);
          const hi = Math.max(p.prior_p95, p.posterior_p95);
          const priorL = v2Pct(p.prior_p5, lo, hi);
          const priorW = v2Pct(p.prior_p95, lo, hi) - priorL;
          const postL  = v2Pct(p.posterior_p5, lo, hi);
          const postW  = v2Pct(p.posterior_p95, lo, hi) - postL;
          const meanX  = v2Pct(p.posterior_mean, lo, hi);
          const shiftPct = (p.shift_score * 100).toFixed(0);
          return (
            <div key={i} className="v2-posterior-row">
              <div className="v2-posterior-name">
                {dsym(p.variable)}
                <span className="v2-pn-sub">{p.variable.name}{p.variable.unit ? ` · ${p.variable.unit}` : ''}</span>
              </div>
              <div>
                <div className="v2-posterior-bar">
                  <div className="v2-posterior-prior" style={{left:`${priorL}%`,width:`${priorW}%`}}/>
                  <div className="v2-posterior-post"  style={{left:`${postL}%`,width:`${postW}%`}}/>
                  <div className="v2-posterior-mean"  style={{left:`${meanX}%`}}/>
                </div>
                <div className="v2-posterior-ticks">
                  <span>{v2Fmt(lo)}</span>
                  <span>{v2Fmt(hi)}</span>
                </div>
              </div>
              <div className="v2-posterior-stats">
                <span>{v2Fmt(p.posterior_mean)}</span>
                <span style={{color:'var(--text3)'}}>[{v2Fmt(p.posterior_p5)}, {v2Fmt(p.posterior_p95)}]</span>
                <span className="v2-shift">shift {shiftPct}%</span>
              </div>
            </div>
          );
        })}
      </div>

      <div style={{fontSize:11.5,color:'var(--text3)',paddingTop:8,borderTop:'1px solid var(--border)'}}>
        Bars: striped tan = prior 90 % range, solid amber = posterior 90 % band, dark tick = posterior mean.
        Shift score = how much the observation tightened the prior (100 % means the band collapsed to a point).
      </div>
    </div>
  );
}

function V2CounterfactualCard({result, elapsed}) {
  const r = result.result;
  const deltaDir = r.delta_mean >= 0 ? 'up' : 'down';
  const deltaSign = r.delta_mean >= 0 ? '+' : '';
  const relSign = r.relative_delta >= 0 ? '+' : '';
  // Suppress the percent when baseline is close to zero relative to Δ
  // (sign-flip cases like resorption → formation), or when the ratio
  // explodes — the absolute Δ is the meaningful quantity there.
  const relIsMeaningful =
    Number.isFinite(r.relative_delta) &&
    Math.abs(r.baseline_mean) > 0.2 * Math.abs(r.delta_mean) &&
    Math.abs(r.relative_delta) < 50;
  return (
    <div className="v2-card">
      <div className="v2-card-hdr">
        <div className="v2-card-title">
          Counterfactual inference: {result.target_info.name}
          {' '}<span style={{color:'var(--text3)',fontWeight:400}}>({dsym(result.target_info)})</span>
        </div>
        <div className="v2-meta">
          n = {r.n_samples.toLocaleString()} paired samples · {elapsed}s
        </div>
      </div>

      <V2RoutingBanner routing={result.routing}/>

      <V2ChainRow result={result}/>

      <V2ShiftsBanner shifts={result.applied_shifts} covariates={result.covariates}/>

      <div className="v2-cf-intervention">
        do(
        {Object.entries(result.intervention).map(([k, v], i) => (
          <span key={k}>{i > 0 && ', '}<b>{k}</b> = {v2Fmt(v)}{result.intervention_info[k]?.unit ? ` ${result.intervention_info[k].unit}` : ''}</span>
        ))}
        )
        {Object.keys(result.given).length > 0 && (
          <span style={{color:'var(--text3)'}}>
            holding {Object.entries(result.given).filter(([k]) => !(k in result.intervention)).map(([k, v], i, arr) => (
              <span key={k}>{i > 0 && ', '}<b>{k}</b> = {v2Fmt(v)}{result.given_info[k]?.unit ? ` ${result.given_info[k].unit}` : ''}</span>
            ))}
          </span>
        )}
      </div>

      <div className="v2-cf-grid">
        <div className="v2-cf-col">
          <div className="v2-cf-lbl">Baseline</div>
          <div className="v2-cf-val">{v2Fmt(r.baseline_mean)} {r.unit}</div>
          <div className="v2-cf-band">[{v2Fmt(r.baseline_p5)}, {v2Fmt(r.baseline_p95)}]</div>
        </div>
        <div className="v2-cf-col">
          <div className="v2-cf-lbl">Intervened</div>
          <div className="v2-cf-val">{v2Fmt(r.intervened_mean)} {r.unit}</div>
          <div className="v2-cf-band">[{v2Fmt(r.intervened_p5)}, {v2Fmt(r.intervened_p95)}]</div>
        </div>
        <div className="v2-cf-col delta">
          <div className="v2-cf-lbl">Δ target</div>
          <div className={`v2-cf-val ${deltaDir}`}>
            {deltaSign}{v2Fmt(r.delta_mean)} {r.unit}
          </div>
          <div className="v2-cf-band">
            [{v2Fmt(r.delta_p5)}, {v2Fmt(r.delta_p95)}]
          </div>
          {relIsMeaningful
            ? <div className="v2-cf-rel">{relSign}{v2Fmt(r.relative_delta * 100, 3)}% vs baseline</div>
            : <div className="v2-cf-rel" style={{color:'#7a5010',opacity:.85}}>baseline crosses zero · absolute Δ shown</div>}
        </div>
      </div>

      <div style={{fontSize:11.5,color:'var(--text3)',paddingTop:6,borderTop:'1px solid var(--border)'}}>
        Paired sampling: the same parameter draws are used for both baseline and intervened passes, so Δ
        reflects only the intervention — not parameter noise.
      </div>
    </div>
  );
}

const V2_ASK_EXAMPLES = [
  'bone stiffness under cyclic load',
  'how does porosity affect modulus in a 70-year-old female?',
  'why is this patient’s E only 12 GPa?',
  'what if porosity dropped to 5%?',
];

// ── v2 active exploration / Surprises panel (Phase 5) ──────────────────────
function V2Surprises({candidates, loading, error, onRefresh, fromAsk}) {
  return (
    <div className="v2-surprises">
      <div className="v2-surprises-hdr">
        <div>
          <div className="v2-surprises-title">
            {fromAsk ? 'Exploration matched your query' : 'Surprises — active exploration'}
            <span className="v2-experimental-tag">phase 5</span>
          </div>
          <div className="v2-surprises-blurb">
            Walks the equation graph without a query, runs forward inference at each sweep point,
            and ranks candidates by <em>magnitude × physics-confidence × corpus-attestation</em>.
            High-ranked items are where physics says something concrete and the literature
            is actively discussing the same topic.
          </div>
        </div>
        <div className="v2-surprises-actions">
          <button className="v2-surprises-btn" onClick={onRefresh} disabled={loading}>
            {loading ? <Spinner/> : (candidates ? 'Re-run' : 'Run')}
          </button>
        </div>
      </div>

      {loading && (
        <div className="loading-row" style={{marginTop:8}}>
          <Dots/><span>Sweeping the graph and asking the corpus…</span>
        </div>
      )}
      {error && <div className="v2-error">{error}</div>}

      {candidates && candidates.length > 0 && (
        <div className="v2-surprise-list">
          {candidates.map((c, i) => {
            const dirClass = c.direction === 'increases' ? 'dir-up'
                           : c.direction === 'decreases' ? 'dir-down'
                           : 'dir-mixed';
            const arrow = c.direction === 'increases' ? '↑'
                        : c.direction === 'decreases' ? '↓'
                        : '↺';
            const rel = c.relative_change === null || c.relative_change === undefined
                        ? '—'
                        : `${(c.relative_change * 100).toFixed(0)}%`;
            return (
              <div key={i} className="v2-surprise-card">
                <div className="v2-surprise-row1">
                  <span className="v2-surprise-rank">#{i + 1}</span>
                  <div className="v2-surprise-title">{c.title}</div>
                  <span className="v2-surprise-score">surprise {c.surprise_score.toFixed(3)}</span>
                </div>

                <div className="v2-surprise-summary">{c.summary}</div>

                <div className="v2-surprise-row2">
                  <span className={`v2-surprise-pill ${dirClass}`}>{arrow} {c.direction} ({rel})</span>
                  <span className="v2-surprise-pill">phys conf {c.physics_confidence.toFixed(2)}</span>
                  <span className="v2-surprise-pill">mag {c.magnitude.toFixed(2)}</span>
                  <Badge label={c.corpus.label} map={NOVELTY_STYLES} display={NOVELTY_DISPLAY[c.corpus.label]}/>
                </div>

                <div className="v2-surprise-sweep">
                  {dsym(c.sweep_var_info)}: {c.sweep_points.map(p => v2Fmt(p.value)).join(' → ')}
                  {'  ⇒  '}
                  {dsym(c.target_info)}: {c.sweep_points.map(p => v2Fmt(p.mean)).join(' → ')}
                  {c.target_info.unit ? ` ${c.target_info.unit}` : ''}
                </div>

                {c.error && <div className="v2-error">{c.error}</div>}

                <div className="v2-surprise-corpus-q">corpus query: {c.corpus.query}</div>

                <div className="v2-surprise-meta">
                  <span>chain: {c.chain_vars.map(v => dsym(v)).join(' → ')}</span>
                  {Object.keys(c.held).length > 0 && (
                    <span>held: {Object.entries(c.held).map(([k, v]) => `${k}=${v2Fmt(v)}`).join(', ')}</span>
                  )}
                  <span>cite: {c.citations.join(' · ')}</span>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function V2Section({presets, onRun, loading, result, error, elapsed,
                    covariates, onCovariatesChange,
                    query, onQueryChange, onAsk,
                    surprises, surprisesLoading, surprisesError, onSurprisesRefresh}) {
  const groups = [
    {mode: 'forward',        items: presets.filter(p => p.mode === 'forward')},
    {mode: 'abductive',      items: presets.filter(p => p.mode === 'abductive')},
    {mode: 'counterfactual', items: presets.filter(p => p.mode === 'counterfactual')},
  ];

  const loadingMsg = {
    forward:        'Solving equation graph and propagating uncertainty…',
    abductive:      'Sampling prior, propagating, and weighting by likelihood…',
    counterfactual: 'Running paired baseline / intervened passes…',
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:20,alignItems:'center',paddingTop:8,width:'100%'}}>
      <V2CovariatePanel covariates={covariates} onChange={onCovariatesChange}/>

      {!result && !loading && (
        <div className="ex-chips">
          <span className="chips-label">Try:</span>
          {V2_ASK_EXAMPLES.map((ex, i) => (
            <button key={i} className="chip"
              onClick={() => { onQueryChange(ex); onAsk(ex); }}>{ex}</button>
          ))}
        </div>
      )}

      {V2_PRESETS_ENABLED && (
      <div className="v2-preset-groups">
        {groups.map(g => {
          const meta = V2_MODE_META[g.mode];
          return (
            <div key={g.mode} className="v2-preset-group">
              <div className="v2-preset-group-hdr">{meta.hdr} — {meta.blurb}</div>
              <div className="v2-presets" style={{justifyContent:'flex-start'}}>
                {g.items.map(p => (
                  <button key={p.id} className="v2-preset" onClick={() => onRun(p)} disabled={loading}>
                    <span className="v2-preset-label">
                      <span className={`v2-mode-tag ${meta.cls}`}>{meta.tag}</span>
                      {p.label}
                      {p.syncCovariates && <span className="v2-mode-tag v2-mode-counterfactual" style={{marginLeft:8}}>covariates</span>}
                    </span>
                    <span className="v2-preset-desc">{p.desc}</span>
                  </button>
                ))}
              </div>
            </div>
          );
        })}
      </div>
      )}

      {loading && (
        <div className="loading-row" style={{marginTop:24}}>
          <Dots/><span>{loadingMsg[result?.mode] || loadingMsg.forward}</span>
        </div>
      )}
      {error && <div className="v2-error">{error}</div>}

      {result && !loading && (
        <Fragment>
          {result.mode === 'forward'        && <V2ForwardCard        result={result} elapsed={elapsed}/>}
          {result.mode === 'abductive'      && <V2AbductiveCard      result={result} elapsed={elapsed}/>}
          {result.mode === 'counterfactual' && <V2CounterfactualCard result={result} elapsed={elapsed}/>}
          {V2_SURPRISES_ENABLED && result.mode === 'explore' && (
            <V2Surprises
              candidates={result.candidates || []}
              loading={false}
              error=""
              onRefresh={onSurprisesRefresh}
              fromAsk={true}
            />
          )}

          {result.citations && result.citations.length > 0 && (
            <div className="v2-card" style={{paddingTop:14}}>
              <div className="v2-card-title" style={{fontSize:11,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--text3)'}}>Citations</div>
              <div className="v2-citations" style={{borderTop:'none',paddingTop:0}}>
                {result.citations.map((c, i) => (
                  <div key={i} className="v2-citation-row">{c}</div>
                ))}
              </div>
            </div>
          )}
        </Fragment>
      )}

      {/* Always-on Surprises panel — independent of any user query. */}
      {V2_SURPRISES_ENABLED && result?.mode !== 'explore' && (
        <V2Surprises
          candidates={surprises}
          loading={surprisesLoading}
          error={surprisesError}
          onRefresh={onSurprisesRefresh}
          fromAsk={false}
        />
      )}
    </div>
  );
}

function ReasonTab() {
  const [concept, setConcept]         = useState('');
  const [result, setResult]           = useState(null);
  const [loading, setLoading]         = useState(false);
  const [error, setError]             = useState('');
  const [clientElapsed, setClientElapsed] = useState(null);

  // v2 (equation-graph) state — lives alongside the v0 state so a user
  // can flip between them without losing context.
  const [v2Mode, setV2Mode]           = useState(false);
  const [v2Result, setV2Result]       = useState(null);
  const [v2Loading, setV2Loading]     = useState(false);
  const [v2Error, setV2Error]         = useState('');
  const [v2Elapsed, setV2Elapsed]     = useState(null);
  const [v2Covariates, setV2Covariates] = useState({...V2_DEFAULT_COVARIATES});
  const [v2Query, setV2Query]           = useState('');

  // Phase 5 — active exploration / Surprises panel state.
  const [v2Surprises,        setV2Surprises]        = useState(null);
  const [v2SurprisesLoading, setV2SurprisesLoading] = useState(false);
  const [v2SurprisesError,   setV2SurprisesError]   = useState('');

  const loadV2Surprises = async (refresh = false) => {
    if (v2SurprisesLoading) return;
    setV2SurprisesLoading(true); setV2SurprisesError('');
    try {
      const r = await fetch('/api/reason_v2/explore' + (refresh ? '?refresh=true' : ''));
      const data = await r.json();
      if (data.error) setV2SurprisesError(data.error);
      else setV2Surprises(data.candidates || []);
    } catch { setV2SurprisesError('Could not run active exploration. Please try again.'); }
    setV2SurprisesLoading(false);
  };

  // Lazy fetch the first time the user opens the v2 tab.  Gated by the
  // Surprises feature flag so we don't trigger the (cold) 25s SPECTER2
  // exploration run when the panel itself is hidden.
  useEffect(() => {
    if (V2_SURPRISES_ENABLED && v2Mode && v2Surprises === null && !v2SurprisesLoading) {
      loadV2Surprises(false);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [v2Mode]);

  const EXAMPLES = ['cortical porosity and elastic modulus','mechanical loading and bone remodeling','fatigue crack growth','cortical thickness and bending stiffness'];

  const reason = async (c) => {
    const term = (c || concept).trim();
    if (!term || loading) return;
    setConcept(term); setLoading(true); setResult(null); setError(''); setClientElapsed(null);
    const t0 = performance.now();
    try {
      const fd = new FormData();
      fd.append('query', term); fd.append('max_results','8'); fd.append('physics_filter','true');
      const r = await fetch('/api/reason', { method:'POST', body:fd });
      const data = await r.json();
      setClientElapsed(((performance.now() - t0) / 1000).toFixed(2));
      setResult(data);
    } catch { setError('Could not generate hypothesis chains. Please try again.'); }
    setLoading(false);
  };

  const reasonV2Ask = async (queryOverride) => {
    const q = (queryOverride ?? v2Query).trim();
    if (!q || v2Loading) return;
    setV2Query(q);
    setV2Loading(true); setV2Result(null); setV2Error(''); setV2Elapsed(null);
    const t0 = performance.now();
    try {
      const r = await fetch('/api/reason_v2/ask', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({query: q, covariates: v2Covariates}),
      });
      const data = await r.json();
      setV2Elapsed(((performance.now() - t0) / 1000).toFixed(2));
      if (data.error) setV2Error(data.error);
      else setV2Result(data);
    } catch { setV2Error('Could not run v2 inference. Please try again.'); }
    setV2Loading(false);
  };

  const reasonV2 = async (preset) => {
    if (v2Loading) return;
    // If the preset pins specific covariates (Phase 3 demos), sync the
    // panel to them so the user can see what the run is actually using.
    // The payload always reflects the (post-sync) panel state.
    let covariatesForRequest = v2Covariates;
    if (preset.syncCovariates) {
      covariatesForRequest = {...V2_DEFAULT_COVARIATES, ...preset.syncCovariates};
      setV2Covariates(covariatesForRequest);
    }
    setV2Loading(true); setV2Result(null); setV2Error(''); setV2Elapsed(null);
    const t0 = performance.now();
    try {
      const r = await fetch('/api/reason_v2', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({preset: preset.id, covariates: covariatesForRequest}),
      });
      const data = await r.json();
      setV2Elapsed(((performance.now() - t0) / 1000).toFixed(2));
      if (data.error) setV2Error(data.error);
      else setV2Result(data);
    } catch { setV2Error('Could not run v2 inference. Please try again.'); }
    setV2Loading(false);
  };

  return (
    <div className="reason-tab">
      <div className="reason-hdr">
        <div style={{fontFamily:'var(--sans)',fontSize:24,marginBottom:12,color:'var(--text)',textAlign:'center',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
          Hypothesis Generator
          {v2Mode && <span className="v2-experimental-tag">experimental</span>}
        </div>
        <div style={{display:'flex',justifyContent:'center'}}>
          <div className="v2-switch">
            <button className={!v2Mode ? 'active' : ''} onClick={() => setV2Mode(false)}>physics grid</button>
            <button className={v2Mode ? 'active' : ''} onClick={() => setV2Mode(true)}>equation graph</button>
          </div>
        </div>
        <div className="reason-desc">
          {v2Mode
            ? 'Forward, abductive and counterfactual inference over a typed equation graph. Patient covariates reshape each law’s priors before propagation.'
            : 'Enter a bone-physics concept. BoneMind runs each applicable physical law over a perturbation grid and emits quantitative hypotheses. Each candidate is then run through a three-round adversarial physics critic before being shown.'}
        </div>
        {!v2Mode && (
          <div className="reason-bar">
            <svg className="search-icon" width="17" height="17" viewBox="0 0 17 17" fill="none">
              <circle cx="7.5" cy="7.5" r="5" stroke="currentColor" strokeWidth="1.7"/>
              <path d="M11.5 11.5l3.5 3.5" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/>
            </svg>
            <input className="reason-input" placeholder="e.g. aging and fracture risk, RANKL osteoclast…"
              value={concept} onChange={e => setConcept(e.target.value)}
              onKeyDown={e => e.key==='Enter' && reason(concept)} disabled={loading}/>
            <button className="reason-btn" onClick={() => reason(concept)} disabled={loading || !concept.trim()}>
              {loading ? <Spinner/> : 'Reason'}
            </button>
          </div>
        )}
        {v2Mode && (
          <div className="reason-bar">
            <svg className="search-icon" width="17" height="17" viewBox="0 0 17 17" fill="none">
              <circle cx="7.5" cy="7.5" r="5" stroke="currentColor" strokeWidth="1.7"/>
              <path d="M11.5 11.5l3.5 3.5" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/>
            </svg>
            <input className="reason-input"
              placeholder="Ask in plain English — e.g. bone stiffness under cyclic load"
              value={v2Query} onChange={e => setV2Query(e.target.value)}
              onKeyDown={e => e.key==='Enter' && reasonV2Ask()} disabled={v2Loading}/>
            <button className="reason-btn" onClick={() => reasonV2Ask()}
                    disabled={v2Loading || !(v2Query || '').trim()}>
              {v2Loading ? <Spinner/> : 'Reason'}
            </button>
          </div>
        )}
      </div>

      <div className="reason-body">
        {v2Mode && (
          <V2Section
            presets={V2_PRESETS}
            onRun={reasonV2}
            loading={v2Loading}
            result={v2Result}
            error={v2Error}
            elapsed={v2Elapsed}
            covariates={v2Covariates}
            onCovariatesChange={setV2Covariates}
            query={v2Query}
            onQueryChange={setV2Query}
            onAsk={reasonV2Ask}
            surprises={v2Surprises}
            surprisesLoading={v2SurprisesLoading}
            surprisesError={v2SurprisesError}
            onSurprisesRefresh={() => loadV2Surprises(true)}
          />
        )}

        {!v2Mode && !result && !loading && (
          <div className="ex-chips">
            <span className="chips-label">Try:</span>
            {EXAMPLES.map((ex,i) => <button key={i} className="chip" onClick={() => reason(ex)}>{ex}</button>)}
          </div>
        )}

        {!v2Mode && loading && <div className="loading-row" style={{marginTop:48}}><Dots/><span>Running physics laws and adversarial critic…</span></div>}
        {!v2Mode && error && <div className="error-note">{error}</div>}

        {!v2Mode && result && !loading && (
        <div className="reason-results">
          <div className="results-title">Physics-derived hypotheses for <em>"{result.concept}"</em></div>
          {result.graph_stats && (
            <div className="graph-stats-line">
              {result.graph_stats.nodes?.toLocaleString()} nodes · {result.graph_stats.edges?.toLocaleString()} edges · {clientElapsed}s
            </div>
          )}
          {result.chains && result.chains.length > 0 ? result.chains.map((ch,i) => {
            const survived = ch.critic_rounds_passed === ch.critic_rounds_total && ch.critic_rounds_total > 0;
            return (
            <div key={i} className="chain-card">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}}>
                <div className="chain-lbl">Hypothesis {i+1} · score {ch.score}</div>
                {ch.scenario && <span className="chain-scenario">{ch.scenario}</span>}
              </div>

              {ch.law && (
                <div className="chain-law">
                  <span className="chain-law-name">{ch.law}</span>
                  {ch.law_form && <span className="chain-law-form">{ch.law_form}</span>}
                </div>
              )}

              <div className="chain-nodes">
                {ch.nodes.map((n,j) => (
                  <Fragment key={j}>
                    <div className="chain-node">{n}</div>
                    {j < ch.nodes.length-1 && <ChainArrow/>}
                  </Fragment>
                ))}
              </div>

              {(ch.perturbation || ch.prediction) && (
                <div className="pred-box">
                  <div className="pred-half">
                    <span className="pred-lbl">Perturbation</span>
                    <span className="pred-val">{ch.perturbation}</span>
                  </div>
                  <div className="pred-half">
                    <span className="pred-lbl">Predicted change</span>
                    <span className="pred-val amber">{ch.prediction}</span>
                  </div>
                </div>
              )}

              <div className="critic-row">
                <span className={`critic-pill ${survived?'ok':'fail'}`}>
                  {survived
                    ? `Survived ${ch.critic_rounds_passed}/${ch.critic_rounds_total} physics rounds`
                    : `Falsified at round ${ch.critic_rounds_passed + 1}/${ch.critic_rounds_total}`}
                </span>
                <Badge label={ch.novelty} map={NOVELTY_STYLES} display={NOVELTY_DISPLAY[ch.novelty]}/>
                {ch.relations?.length > 0 && (
                  <span className="chain-rels">{ch.relations.join(' · ')}</span>
                )}
              </div>

              {!survived && ch.critic_failure && (
                <div className="critic-fail-detail">{ch.critic_failure}</div>
              )}
              {ch.explanation && <div className="chain-expl">{ch.explanation}</div>}
              {ch.summary && <div className="chain-summary">{ch.summary}</div>}
              {ch.disclaimer && ch.corpus_disclaimer && (
                <div className="chain-disclaimer">
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style={{flexShrink:0,marginTop:1}}>
                    <circle cx="7" cy="7" r="6" stroke="currentColor" strokeWidth="1.3"/>
                    <line x1="7" y1="5.5" x2="7" y2="9" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/>
                    <circle cx="7" cy="4" r="0.7" fill="currentColor"/>
                  </svg>
                  {ch.corpus_disclaimer}
                </div>
              )}
            </div>
            );
          }) : <div style={{color:'var(--text3)',padding:'24px 0'}}>No physics-driven hypotheses match this query yet. Try one of these:
• Currey's law — "cortical porosity and elastic modulus"
• Frost mechanostat — "mechanical loading and bone remodeling"
• Paris law — "fatigue crack growth"
• Beam bending — "cortical thickness and bending stiffness"</div>}

          {result.chains?.length > 0 && (
            <div className="badge-legend">
              <div className="legend-grp">
                <span className="legend-lbl">Physics</span>
                <Badge label="PLAUSIBLE" map={VALIDITY_STYLES}/>
                <Badge label="IMPLAUSIBLE" map={VALIDITY_STYLES}/>
              </div>
              <div className="legend-grp">
                <span className="legend-lbl">Hypothesis</span>
                {['GROUNDED','SPECULATIVE','NOVEL'].map(k => <Badge key={k} label={k} map={NOVELTY_STYLES} display={NOVELTY_DISPLAY[k]}/>)}
              </div>
            </div>
          )}
        </div>
        )}
      </div>
    </div>
  );
}

// ── ANALYSE TAB ───────────────────────────────────────────────────────────────
function AnalyseTab() {
  const [imgURL, setImgURL]     = useState(null);
  const [report, setReport]     = useState(null);
  const [loading, setLoading]   = useState(false);
  const [drag, setDrag]         = useState(false);
  const fileRef = useRef(null);

  const processFile = async (file) => {
    if (!file || !file.type.startsWith('image/')) return;
    setImgURL(URL.createObjectURL(file));
    setReport(null); setLoading(true);
    try {
      const fd = new FormData(); fd.append('image', file);
      const r = await fetch('/api/analyse', { method:'POST', body:fd });
      setReport(await r.json());
    } catch { setReport({ error:true }); }
    setLoading(false);
  };

  const ConfBadge = ({ level }) => {
    const m = { HIGH:{bg:'#eaf5ee',color:'#1a7a4e',border:'#a8d8b8'}, MODERATE:{bg:'#fef5e4',color:'#a07010',border:'#f0d48a'}, LOW:{bg:'#fdeaea',color:'#b01c1c',border:'#f0a8a8'} };
    const s = m[level] || m.MODERATE;
    return <span className="badge" style={{background:s.bg,color:s.color,borderColor:s.border}}>Confidence: {level}</span>;
  };

  if (!imgURL) return (
    <div className="analyse-tab">
      <div className={`dropzone${drag?' drag':''}`}
        onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)}
        onDrop={e=>{e.preventDefault();setDrag(false);processFile(e.dataTransfer.files[0])}}
        onClick={()=>fileRef.current.click()}>
        <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={e=>processFile(e.target.files[0])}/>
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" className="dz-icon">
          <rect x="6" y="8" width="36" height="32" rx="4" stroke="currentColor" strokeWidth="1.8"/>
          <path d="M24 18v12M18 24l6-6 6 6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
        <div className="dz-title">Drop an X-ray or MRI here</div>
        <div className="dz-sub">or click to select · PNG, JPG</div>
      </div>
      <div className="analyse-note">BoneMind will generate a structured radiology report using LLaVA 13b. For research and educational use only.</div>
    </div>
  );

  return (
    <div className="analyse-tab">
      <div className="analysis-view">
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <img src={imgURL} alt="scan" className="scan-img"/>
          <button className="reupload" onClick={()=>{setImgURL(null);setReport(null);}}>Upload different image</button>
        </div>
        <div className="report-pane">
          {loading ? (
            <div className="report-loading"><Dots/><span>Generating radiology report…</span></div>
          ) : report && !report.error ? (
            <div>
              <div className="report-heading">
                <span>AI Radiology Report</span>
                {report.confidence && <ConfBadge level={report.confidence}/>}
              </div>
              <div className="report-disc">For research and educational use only. Not a clinical diagnosis.</div>
              {[['Modality',report.modality],['Image Quality',report.quality],['Bone Density',report.density],['Assessment',report.assessment],['Recommendation',report.recommendation]].map(([k,v]) => v && (
                <div key={k} className="report-row"><div className="report-key">{k}</div><div className="report-val">{v}</div></div>
              ))}
              {report.findings?.length > 0 && (
                <div className="report-row">
                  <div className="report-key">Findings</div>
                  <ul className="report-findings">{report.findings.map((f,i)=><li key={i}>{f}</li>)}</ul>
                </div>
              )}
            </div>
          ) : (
            <div className="report-loading">
              {report?.error ? 'Could not generate report. Ensure Ollama is running with llava:13b.' : 'Upload an image to start.'}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── APP SHELL ─────────────────────────────────────────────────────────────────
const TABS = [
  { id:'ask',     label:'BoneMind', icon:<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 2h11v8H8.5L5 13v-3H2V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/></svg> },
  { id:'search',  label:'BoneScholar', icon:<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="6.5" cy="6.5" r="4" stroke="currentColor" strokeWidth="1.5"/><path d="M10 10l3.5 3.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg> },
  { id:'reason',  label:'Reasoning',        icon:<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="2.5" cy="7.5" r="1.5" stroke="currentColor" strokeWidth="1.4"/><circle cx="7.5" cy="7.5" r="1.5" stroke="currentColor" strokeWidth="1.4"/><circle cx="12.5" cy="7.5" r="1.5" stroke="currentColor" strokeWidth="1.4"/><path d="M4 7.5h2M9 7.5h2" stroke="currentColor" strokeWidth="1.4"/></svg> },
  { id:'analyse', label:'Vision', icon:<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="1.5" y="2.5" width="12" height="10" rx="1.5" stroke="currentColor" strokeWidth="1.5"/><circle cx="5.5" cy="6.5" r="1.5" stroke="currentColor" strokeWidth="1.3"/><path d="M1.5 10.5l4-3.5 3 2.5 2-2 3 3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg> },
];

function App() {
  const [tab, setTab]     = useState(() => localStorage.getItem('bl-tab') || 'ask');
  const [stats, setStats] = useState(null);

  useEffect(() => {
    fetch('/api/stats').then(r => r.json()).then(setStats).catch(() => {});
  }, []);

  const switchTab = id => { setTab(id); localStorage.setItem('bl-tab', id); };

  return (
    <div style={{display:'flex',height:'100vh',width:'100%',overflow:'hidden'}}>
      <aside className="sidebar">
        <div className="sb-logo">
          <div className="sb-logo-icon"><BoneSVG size={34}/></div>
          <span className="sb-logo-text">BoneMind</span>
        </div>
        <nav className="sb-nav">
          {TABS.map(t => (
            <button key={t.id} className={`sb-item${tab===t.id?' active':''}`} onClick={() => switchTab(t.id)}>
              <span className="sb-item-icon">{t.icon}</span>{t.label}
            </button>
          ))}
        </nav>
        <div className="sb-foot">
          <div className="corpus-badge">
            <div className="corpus-dot"/>
            {stats ? `${stats.chunks.toLocaleString()} embeddings indexed` : 'Loading…'}
          </div>
          {stats && (
            <div style={{fontSize:11,color:'var(--text3)',marginTop:4}}>
              {stats.graph_nodes?.toLocaleString()} nodes · {stats.graph_edges?.toLocaleString()} edges
            </div>
          )}
        </div>
      </aside>

      <main className="main">
        <div className={`panel${tab==='ask'?' active':''}`}>
          <AskTab totalChunks={stats?.chunks}/>
        </div>
        <div className={`panel-scroll${tab==='search'?' active':''}`}>
          <div className="panel-inner"><SearchTab totalChunks={stats?.chunks}/></div>
        </div>
        <div className={`panel-scroll${tab==='reason'?' active':''}`}>
          <div className="panel-inner"><ReasonTab/></div>
        </div>
        <div className={`panel-scroll${tab==='analyse'?' active':''}`}>
          <div className="panel-inner"><AnalyseTab/></div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
