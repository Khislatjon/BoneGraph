<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoneGraph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<link rel="icon" href="/static/bonegraph-icon.svg" type="image/svg+xml">
<script src="/static/react.dev.js"></script>
<script src="/static/react-dom.dev.js"></script>
<script src="/static/babel.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
#root{display:flex;height:100vh;height:100dvh}
.app-shell{height:100vh}
:root{
  --bg:#f3f1ec;--surface:#fff;--surface2:#f8f7f3;
  --border:#e3dfd7;--border2:#ccc8be;
  --text:#1c1b18;--text2:#52514a;--text3:#928f82;
  --amber:#b07820;--amber-light:#fef5e4;--amber-border:#edd590;
  --navy:#1a2540;
  --sans:'DM Sans',system-ui,sans-serif;
  --serif:'DM Serif Display',Georgia,serif;
  --mono:'SF Mono','Fira Code',monospace;
  --radius:10px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 8px rgba(0,0,0,.04);
}

:root[data-theme="dark"]{
  --bg:#1a1916;--surface:#232220;--surface2:#2b2a27;
  --border:#36342f;--border2:#45423b;
  --text:#ece9e2;--text2:#b0ada3;--text3:#807d73;
  --amber:#d49a4a;--amber-light:#2e2515;--amber-border:#5a4620;
  --navy:#3a4d7a;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 1px 10px rgba(0,0,0,.3);
}
:root[data-theme="dark"] .send-btn:hover,
:root[data-theme="dark"] .search-btn:hover{background:#4a5f93}

/* Sidebar */
.sidebar{width:236px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow-y:auto}
.sb-logo{display:flex;align-items:center;gap:11px;padding:20px 16px 18px;border-bottom:1px solid var(--border)}
.sb-logo-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.sb-logo-text{font-family:var(--sans);font-size:19px;letter-spacing:-.01em}
.sb-logo-meta{display:flex;flex-direction:column;gap:3px}
.sb-logo-title{display:flex;align-items:flex-start;gap:5px}
.sb-beta{font-family:var(--sans);font-size:8px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#fff;background:#b07820;border-radius:3px;padding:1px 4px;line-height:1.4;position:relative;top:-3px}
.sb-version{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.02em}
.sb-nav{display:flex;flex-direction:column;padding:10px 8px;gap:2px;flex:1}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:none;background:none;cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--text2);text-align:left;width:100%;transition:background .12s,color .12s}
.sb-item:hover{background:var(--surface2);color:var(--text)}
.sb-item.active{background:var(--amber-light);color:var(--amber)}
.sb-item-icon{flex-shrink:0;opacity:.55;display:flex;align-items:center;justify-content:center}
.sb-item.active .sb-item-icon{opacity:1}
.sb-feedback-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:none;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--text2);transition:background .12s,color .12s,border-color .12s}
.sb-feedback-btn:hover{background:var(--amber-light);color:var(--amber);border-color:var(--amber)}
.sb-profile-row{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:none;font-family:var(--sans);font-size:13px;color:var(--text2);transition:background .12s,color .12s,border-color .12s}
.sb-profile-row:hover{background:var(--amber-light);color:var(--amber);border-color:var(--amber)}
.sb-profile-name{display:flex;align-items:center;gap:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.sb-logout-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--text2);cursor:pointer;font-family:var(--sans);flex-shrink:0;transition:background .12s,color .12s,border-color .12s}
.sb-logout-btn:hover{background:var(--amber-light);color:var(--amber);border-color:var(--amber)}
.sb-foot{padding:14px 16px;border-top:1px solid var(--border);min-height:73px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
.corpus-badge{font-size:11.5px;color:var(--text3);display:flex;align-items:center;gap:6px}
.corpus-dot{width:6px;height:6px;border-radius:50%;background:#1a7a4e;flex-shrink:0}

/* Main */
.main{flex:1;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;min-width:0}
.panel{display:none;flex:1;flex-direction:column;overflow:hidden}
.panel.active{display:flex}
.panel-scroll{display:none;overflow-y:auto;height:100%}
.panel-scroll.active{display:block}
.panel-inner{max-width:940px;margin:0 auto;padding:0 0 40px}

/* Ask tab */
.ask{display:flex;flex-direction:column;flex:1;overflow:hidden}
.chat-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center}
.chat-inner{width:100%;max-width:760px;padding:32px 24px 16px}
.empty-state{max-width:520px;margin:80px auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-avatar{width:100px;height:100px;border-radius:26px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.empty-title{font-family:var(--sans);font-size:24px}
.empty-sub{font-size:14px;color:var(--text3);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--text2);cursor:pointer;font-family:var(--sans);transition:all .15s}
.chip:hover{border-color:var(--amber-border);color:var(--amber);background:var(--amber-light)}
.ex-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:4px;max-width:800px;width:100%}
.chips-label{font-size:13px;color:var(--text3)}
.messages{width:100%;display:flex;flex-direction:column;gap:24px;padding-bottom:16px}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg-user{flex-direction:row-reverse}
.msg-avatar{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.msg-bubble{max-width:85%;display:flex;flex-direction:column}
.msg-user .msg-bubble{background:var(--amber-light);border:1px solid var(--amber-border);border-radius:14px 4px 14px 14px;padding:12px 16px}
.msg-asst .msg-bubble{background:var(--surface);border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:14px 18px;box-shadow:var(--shadow)}
.msg-text{font-size:14.5px;line-height:1.7;white-space:pre-wrap}
.resp-heading{font-weight:700;font-size:14.5px;margin:16px 0 4px;color:var(--text);font-family:var(--sans)}
.ref-link{color:var(--amber);text-decoration:none}
.ref-link:hover{text-decoration:underline}
.cite{color:var(--amber);font-size:.72em;font-weight:600;font-family:var(--mono)}
.blink{color:var(--amber);animation:blink 1s steps(1) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.dots{display:flex;gap:4px;align-items:center;padding:4px 0}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:bounce 1.1s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.18s}
.dots span:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
.chat-bar{display:flex;justify-content:center;padding:14px 24px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.chat-wrap{position:relative;width:100%;max-width:760px;display:flex;align-items:center}
.chat-input{flex:1;height:44px;border:1px solid var(--border);border-radius:10px;padding:0 52px 0 16px;font-family:var(--sans);font-size:14px;background:var(--surface2);color:var(--text);outline:none;transition:border-color .15s}
.chat-input:focus{border-color:var(--amber-border);box-shadow:0 0 0 3px rgba(176,120,32,.1)}
.send-btn{position:absolute;right:6px;width:34px;height:34px;border-radius:8px;background:var(--navy);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.send-btn:hover{background:#253660}
.send-btn:disabled{opacity:.4;cursor:default}
.sources-toggle{margin-top:8px;font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0;font-family:var(--sans);text-decoration:underline}
.sources-toggle:hover{color:var(--amber)}
.sources-list{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.src-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text2)}
.src-rank{font-family:var(--mono);font-size:11px;color:var(--amber);font-weight:600;margin-right:6px}
.src-title{font-weight:600;color:var(--text)}
.src-meta{color:var(--text3);margin-top:2px;font-size:11px}

/* Search tab */
.search-hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:24px 32px 16px;position:sticky;top:0;z-index:50;display:flex;flex-direction:column;align-items:center}
.search-bar{display:flex;align-items:center;max-width:760px;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:0 12px;gap:10px}
.search-bar:focus-within{border-color:var(--amber-border);box-shadow:0 0 0 3px rgba(176,120,32,.1)}
.search-icon{color:var(--text3);flex-shrink:0}
.search-input{flex:1;height:46px;background:none;border:none;outline:none;font-family:var(--sans);font-size:14.5px;color:var(--text)}
.search-input::placeholder{color:var(--text3)}
.search-btn{background:var(--navy);color:#fff;border:none;padding:7px 18px;border-radius:7px;font-family:var(--sans);font-size:13.5px;font-weight:500;cursor:pointer;transition:background .15s}
.search-btn:hover{background:#253660}
.search-btn:disabled{opacity:.4;cursor:default}
.filter-row{display:flex;gap:8px;margin-top:10px;max-width:760px;width:100%}
.filter-btn{font-family:var(--sans);font-size:12.5px;font-weight:500;padding:4px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .12s}
.filter-btn.active,.filter-btn:hover{background:var(--amber-light);border-color:var(--amber-border);color:var(--amber)}
.corpus-note{font-size:12px;color:var(--text3);margin-top:6px}
.range-slider{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--border2);outline:none;cursor:pointer;width:70px}
.range-slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--amber);cursor:pointer;margin-top:-3px;box-shadow:0 0 0 3px var(--amber-light),0 0 0 4px var(--amber-border)}
.range-slider::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--amber);border:none;cursor:pointer;box-shadow:0 0 0 3px var(--amber-light),0 0 0 4px var(--amber-border)}
.search-body{padding:28px 32px;flex:1;display:flex;flex-direction:column;align-items:center}
.loading-row{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--text3);font-size:14px;padding:24px 0;width:100%}
.results-meta{font-size:13px;color:var(--text3);margin-bottom:16px;text-align:center;max-width:800px;width:100%}
.results-list{max-width:800px;width:100%;display:flex;flex-direction:column;gap:14px}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;transition:border-color .15s,box-shadow .15s}
.result-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.result-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.result-title{font-size:15px;font-weight:600;line-height:1.4;flex:1}
.score-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.score-num{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--amber)}
.score-track{width:60px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.score-fill{height:100%;background:var(--amber);border-radius:2px}
.result-byline{font-size:12.5px;color:var(--text3);margin-top:4px}
.result-excerpt{font-size:13.5px;color:var(--text2);line-height:1.6;font-style:italic;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.src-badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-right:6px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.spinner.dark{border:2px solid rgba(0,0,0,.15);border-top-color:var(--text2)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Analyse tab */
.vision-tab{padding:32px;flex:1;display:flex;flex-direction:column;gap:24px;overflow-y:auto}
.dropzone{max-width:560px;border:2px dashed var(--border2);border-radius:14px;padding:60px 40px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s;text-align:center}
.dropzone:hover,.dropzone.drag{border-color:var(--amber);background:var(--amber-light)}
.dz-icon{color:var(--text3);transition:color .15s}
.dropzone:hover .dz-icon,.dropzone.drag .dz-icon{color:var(--amber)}
.dz-title{font-size:17px;font-weight:500}
.dz-sub{font-size:13px;color:var(--text3)}
.vision-note{font-size:12.5px;color:var(--text3);max-width:560px}
.vision-msg-img{max-width:240px;max-height:300px;width:auto;height:auto;object-fit:contain;align-self:flex-end;border-radius:10px;border:1px solid var(--border)}
.id-card{display:flex;flex-direction:column;gap:8px}
.id-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.id-name{font-size:15px;font-weight:600}
.id-rows{display:flex;flex-direction:column;gap:6px}
.id-row{display:grid;grid-template-columns:120px 1fr;gap:8px;font-size:13px;line-height:1.5}
.id-k{color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:500;padding-top:2px}
.id-feats{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.vision-strip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3)}
.vision-strip img{width:28px;height:28px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.analysis-view{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
.scan-img{width:100%;border-radius:10px;border:1px solid var(--border);display:block;object-fit:contain;max-height:380px;background:#111}
.reupload{background:none;border:1px solid var(--border);border-radius:7px;padding:7px 14px;font-size:13px;color:var(--text3);cursor:pointer;font-family:var(--sans);transition:all .15s}
.reupload:hover{border-color:var(--amber);color:var(--amber)}
.report-pane{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.report-loading{display:flex;align-items:center;gap:12px;padding:32px;font-size:14px;color:var(--text3)}
.report-heading{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600}
.report-disc{padding:8px 20px;background:var(--surface2);font-size:11.5px;color:var(--text3);border-bottom:1px solid var(--border)}
.report-row{display:grid;grid-template-columns:140px 1fr;gap:8px;padding:12px 20px;border-bottom:1px solid var(--border);align-items:start}
.report-row:last-child{border-bottom:none}
.report-key{font-size:11.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding-top:2px;font-weight:500}
.report-val{font-size:13.5px;line-height:1.55}
.report-findings{padding-left:16px;display:flex;flex-direction:column;gap:4px}
.report-findings li{font-size:13.5px;line-height:1.55}

/* Mobile top bar — hidden on desktop, shown below the breakpoint */
.mobile-bar{display:none}
.sb-backdrop{display:none}

@media (max-width:768px){
  .app-shell{flex-direction:column}

  /* Top bar with hamburger + wordmark */
  .mobile-bar{display:flex;align-items:center;gap:12px;height:52px;flex-shrink:0;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border);z-index:50}
  .mobile-bar .hamb{background:none;border:none;cursor:pointer;display:flex;padding:6px;margin:-6px;color:var(--text2)}
  .mobile-title{font-family:var(--sans);font-size:16px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:7px}

  /* Sidebar becomes a slide-in drawer */
  .sidebar{position:fixed;top:0;left:0;z-index:70;width:264px;max-width:84%;height:100vh;height:100dvh;transform:translateX(-100%);transition:transform .22s ease;box-shadow:2px 0 24px rgba(0,0,0,.14)}
  .sidebar.open{transform:translateX(0)}
  .sb-backdrop{display:block;position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.32)}

  /* Main fills the rest of the column */
  .main{height:auto;flex:1;min-height:0}

  /* Tighten desktop-width paddings for phone screens */
  .chat-inner{padding:20px 16px 16px}
  .panel-inner{padding:0 14px 32px}
  .dropzone{padding:40px 22px}
  .msg-bubble{max-width:92%}
  .empty-state{margin-top:48px}
}
</style>
</head>
<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#928f82">Loading BoneGraph…</div></div>

<script type="text/babel">
const { useState, useEffect, useRef, Fragment } = React;

// ── Auth ──────────────────────────────────────────────────────────────────────
// Wraps window.fetch so every request carries the bearer token. A 401 from any
// endpoint except /api/auth/* means the session expired — clear it and force
// back to the login screen. /api/auth/* is excluded so a wrong-password login
// attempt's 401 reaches the caller (AuthScreen) to display, instead of reloading
// the page before the error message can be shown.
const _rawFetch = window.fetch.bind(window);
// This shell is served from Cloudflare Pages but the API runs on the Jetson behind
// the tunnel, so on the public site API calls need an absolute origin. Everywhere
// else — local dev, hitting the box directly — one process serves both, so
// same-origin ('') is correct. Callers always pass a relative '/api/...' path.
const API_BASE =
  location.hostname === 'bonegraph.org' ||
  location.hostname === 'www.bonegraph.org' ||
  location.hostname.endsWith('.pages.dev')
    ? 'https://api.bonegraph.org'
    : '';
function authHeaders() {
  const token = localStorage.getItem('bg_token');
  return token ? { Authorization: 'Bearer ' + token } : {};
}
async function apiFetch(url, opts = {}) {
  const headers = { ...(opts.headers || {}), ...authHeaders() };
  const resp = await _rawFetch(API_BASE + url, { ...opts, headers });
  if (resp.status === 401 && !url.startsWith('/api/auth/')) {
    localStorage.removeItem('bg_token');
    localStorage.removeItem('bg_fullname');
    localStorage.removeItem('bg_email');
    window.location.reload();
  }
  return resp;
}

// ── Bone SVG ──────────────────────────────────────────────────────────────────
function BoneSVG({ size = 28 }) {
  return (
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width={size} height={size}>
      <rect width="100" height="100" rx="22" fill="#0f1724"/>
      <g stroke="#f3e8c8" strokeWidth="2.5" opacity="0.75">
        <line x1="50" y1="50" x2="50" y2="19.76"/>
        <line x1="50" y1="50" x2="75.92" y2="34.88"/>
        <line x1="50" y1="50" x2="75.92" y2="65.12"/>
        <line x1="50" y1="50" x2="50" y2="80.24"/>
        <line x1="50" y1="50" x2="24.08" y2="65.12"/>
        <line x1="50" y1="50" x2="24.08" y2="34.88"/>
      </g>
      <g fill="#f3e8c8">
        <circle cx="50" cy="19.76" r="8.5"/>
        <circle cx="75.92" cy="34.88" r="4.5"/>
        <circle cx="75.92" cy="65.12" r="8.5"/>
        <circle cx="50" cy="80.24" r="4.5"/>
        <circle cx="24.08" cy="65.12" r="8.5"/>
        <circle cx="24.08" cy="34.88" r="4.5"/>

// ── Dots / Spinner ────────────────────────────────────────────────────────────
const Dots = () => <div className="dots"><span/><span/><span/></div>;
const Spinner = ({ dark }) => <span className={`spinner${dark?' dark':''}`}/>;

// Strip the model's "Thinking" preamble — show only from "Final Response" onward.
function stripThinking(text) {
  const marker = /final response\s*/i;
  const idx = text.search(marker);
  if (idx === -1) return text;
  return text.slice(idx).replace(marker, '').trimStart();
}

// The reasoning agent's format is "**Point N.** … *Basis.* …", with Basis on
// its own line. The model sometimes runs Basis inline; force it onto a new line
// so each point reads Point-then-Basis. Targets the asterisked label only, so it
// never touches the word "basis" in ordinary prose.
function fixBasis(text) {
  if (!text) return text;
  return text.replace(/([^\n])[ \t]*(\*+\s*Basis)/g, '$1\n$2');
}

// ── Inline citations renderer ─────────────────────────────────────────────────
// Renders **bold**, *italic*, citation markers [N] and markdown links inline.
function renderInline(text, keyPrefix) {
  const inlineRe = /(\*\*([^*\n]+)\*\*|\*([^*\n]+)\*)/g;
  const out = [];
  let last = 0;
  let m;
  let i = 0;
  while ((m = inlineRe.exec(text)) !== null) {
    if (m.index > last) out.push(text.slice(last, m.index));
    if (m[2] !== undefined) out.push(<strong key={`${keyPrefix}-b${i}`}>{m[2]}</strong>);
    else if (m[3] !== undefined) out.push(<em key={`${keyPrefix}-i${i}`}>{m[3]}</em>);
    last = m.index + m[0].length;
    i++;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}

function parseCit(text) {
  const lines = text.split('\n');
  const result = [];
  lines.forEach((line, li) => {
    const headingMatch = line.match(/^##\s+(.+)$/);
    if (headingMatch) {
      result.push(<div key={`h${li}`} className="resp-heading">{renderInline(headingMatch[1], `h${li}`)}</div>);
      return;
    }
    const parts = line.split(/(\[\d+\]|\[[^\]]+\]\(https?:\/\/[^)]+\))/g);
    parts.forEach((p, i) => {
      const citM = p.match(/^\[(\d+)\]$/);
      const linkM = p.match(/^\[([^\]]+)\]\((https?:\/\/[^)]+)\)$/);
      if (citM) result.push(<sup key={`${li}-${i}`} className="cite">[{citM[1]}]</sup>);
      else if (linkM) result.push(<a key={`${li}-${i}`} href={linkM[2]} target="_blank" rel="noopener noreferrer" className="ref-link">{linkM[1]}</a>);
      else result.push(<React.Fragment key={`${li}-${i}`}>{renderInline(p, `${li}-${i}`)}</React.Fragment>);
    });
    if (li < lines.length - 1) result.push('\n');
  });
  return result;
}

// ── Context ring ──────────────────────────────────────────────────────────────
function CtxRing({ usage }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const pct = Math.min(100, Math.round((usage.prompt / usage.ctx) * 100));
  const color = pct >= 90 ? '#c0392b' : pct >= 75 ? '#8a5010' : 'var(--amber)';
  const r = 9, circ = 2 * Math.PI * r, dash = circ * (pct / 100);

  useEffect(() => {
    if (!open) return;
    const close = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [open]);

  return (
    <div ref={ref} style={{position:'relative',display:'inline-flex'}}>
      <button onClick={() => setOpen(o => !o)}
        title={`Context: ~${usage.prompt.toLocaleString()} / ${usage.ctx.toLocaleString()} tokens (${pct}%)`}
        style={{background:'none',border:'none',cursor:'pointer',padding:4,display:'flex',alignItems:'center',justifyContent:'center',borderRadius:6}}>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r={r} stroke="var(--border2)" strokeWidth="2.5"/>
          <circle cx="12" cy="12" r={r} stroke={color} strokeWidth="2.5"
            strokeDasharray={`${dash} ${circ - dash}`} strokeLinecap="round"
            transform="rotate(-90 12 12)"/>
        </svg>
      </button>
      {open && (
        <div style={{position:'absolute',bottom:'calc(100% + 8px)',left:0,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:'12px 14px',minWidth:215,boxShadow:'0 4px 20px rgba(0,0,0,.1)',zIndex:200}}>
          <div style={{fontFamily:'var(--sans)',fontWeight:600,fontSize:13,color:'var(--text)',marginBottom:10}}>Context window</div>
          <div style={{display:'flex',flexDirection:'column',gap:5,fontFamily:'var(--mono)',fontSize:12,color:'var(--text2)'}}>
            <div style={{display:'flex',justifyContent:'space-between',gap:16}}>
              <span>Used</span><span style={{color,fontWeight:500}}>~{usage.prompt.toLocaleString()} tokens</span>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',gap:16}}>
              <span>Limit</span><span style={{color:'var(--text)'}}>{usage.ctx.toLocaleString()} tokens</span>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',gap:16}}>
              <span>Remaining</span><span style={{color:'var(--text)'}}>{Math.max(0, usage.ctx - usage.prompt).toLocaleString()} tokens</span>
            </div>
          </div>
          <div style={{marginTop:10,height:3,background:'var(--border)',borderRadius:2,overflow:'hidden'}}>
            <div style={{height:'100%',width:`${pct}%`,background:color,borderRadius:2}}/>
          </div>
          <div style={{marginTop:5,textAlign:'right',fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)'}}>
            {pct}% used{usage.estimated ? ' · estimated' : ''}
          </div>
        </div>
      )}
    </div>
  );
}

// ── ASK TAB ───────────────────────────────────────────────────────────────────
function AskTab({ totalChunks }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput]       = useState('');
  const [loading, setLoading]   = useState(false);
  const [streaming, setStreaming] = useState('');
  const [liveSource, setLiveSource] = useState(null);
  const [usage, setUsage]       = useState(null); // {prompt, completion, ctx}
  const endRef      = useRef(null);
  const inputRef    = useRef(null);
  const chatAreaRef = useRef(null);
  const autoScroll  = useRef(true);

  // onWheel fires before the browser processes the scroll — preemptively disable
  const handleWheel = () => { autoScroll.current = false; };
  const handleTouchStart = () => { autoScroll.current = false; };

  // Re-enable only when the user scrolls back to the very bottom
  const handleChatScroll = () => {
    const el = chatAreaRef.current;
    if (!el) return;
    if (el.scrollHeight - el.scrollTop - el.clientHeight < 60) {
      autoScroll.current = true;
    }
  };

  // Scroll on new completed messages (user just sent something)
  useEffect(() => {
    if (autoScroll.current && endRef.current) {
      endRef.current.scrollIntoView({ behavior: 'smooth' });
    }
  }, [messages]);

  // During streaming, scroll instantly only if auto-scroll is still enabled
  useEffect(() => {
    if (streaming && autoScroll.current && endRef.current) {
      endRef.current.scrollIntoView({ behavior: 'instant' });
    }
  }, [streaming]);

  const CHIPS = [
    'What drives cortical porosity in aging bone?',
    'How does trabecular architecture affect fracture toughness?',
    'Explain the role of osteocytes in mechanosensing',
  ];

  const send = async (text) => {
    const t = text.trim();
    if (!t || loading) return;
    autoScroll.current = true;
    // Capture history before adding the new user turn.
    // For assistant turns: strip the thinking block and ## References section —
    // the LLM only needs the answer body to resolve pronouns across turns.
    // Sliding window: last 6 messages (3 pairs) keeps history bounded.
    const history = messages.slice(-6).map(m => {
      if (m.role !== 'assistant') return { role: m.role, content: m.content };
      let content = m.content;
      const thinkIdx = content.search(/final response\s*/i);
      if (thinkIdx !== -1) content = content.slice(thinkIdx).replace(/final response\s*/i, '').trimStart();
      const refIdx = content.search(/\n\n## References/i);
      if (refIdx !== -1) content = content.slice(0, refIdx).trim();
      return { role: m.role, content };
    });
    // All prior user questions (no window cap) — used only by the topic guard
    // so it can resolve pronouns even when early turns fall outside the LLM window.
    const allQuestions = messages
      .filter(m => m.role === 'user')
      .map(m => m.content);
    setMessages(prev => [...prev, { role:'user', content:t }]);
    setInput('');
    setLoading(true);
    setStreaming('');
    setLiveSource(null);
    let finalAnswer = '';
    let sources = null;
    try {
      const fd = new FormData();
      fd.append('question', t);
      fd.append('top_k', '8');
      fd.append('history', JSON.stringify(history));
      fd.append('all_questions', JSON.stringify(allQuestions));
      const resp = await apiFetch('/api/ask', { method:'POST', body:fd });
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream:true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const ev = JSON.parse(line.slice(6));
          if (ev.type === 'sources') { sources = ev.results; setLiveSource(ev.results); }
          else if (ev.type === 'token') { finalAnswer += ev.content; setStreaming(finalAnswer); }
          else if (ev.type === 'done')  {
            finalAnswer = ev.answer;
            if (typeof ev.prompt_tokens === 'number') {
              setUsage({ prompt: ev.prompt_tokens, completion: ev.completion_tokens, ctx: ev.context_window || 8192, estimated: true });
            }
          }
          else if (ev.type === 'error') { finalAnswer = '⚠️ ' + ev.message; }
        }
      }
    } catch(e) { finalAnswer = '⚠️ Error: ' + e.message; }
    setStreaming('');
    setLiveSource(null);
    setMessages(prev => [...prev, { role:'assistant', content:finalAnswer, sources }]);
    setLoading(false);
    inputRef.current?.focus();
  };

  const empty = messages.length === 0 && !loading;
  return (
    <div className="ask">
      <div className="chat-area" ref={chatAreaRef} onScroll={handleChatScroll} onWheel={handleWheel} onTouchStart={handleTouchStart}>
        <div className="chat-inner">
          {empty ? (
            <div className="empty-state">
              <div className="empty-avatar"><BoneSVG size={100}/></div>
              <div className="empty-title">Ask BoneGraph</div>
              <div className="empty-sub">Grounded in {totalChunks ? totalChunks.toLocaleString() : '248,629'} indexed papers and textbooks</div>
              <div className="chips">
                {CHIPS.map((s,i) => <button key={i} className="chip" onClick={() => send(s)}>{s}</button>)}
              </div>
            </div>
          ) : (
            <div className="messages">
              {messages.map((m,i) => (
                <div key={i} className={`msg ${m.role === 'user' ? 'msg-user' : 'msg-asst'}`}>
                  {m.role === 'assistant' && <div className="msg-avatar"><BoneSVG size={34}/></div>}
                  <div className="msg-bubble">
                    <div className="msg-text">{m.role === 'assistant' ? parseCit(stripThinking(m.content)) : m.content}</div>
                    {m.role === 'assistant' && <Sources results={m.sources}/>}
                  </div>
                </div>
              ))}
              {(streaming || (loading && !streaming)) && (
                <div className="msg msg-asst">
                  <div className="msg-avatar"><BoneSVG size={34}/></div>
                  <div className="msg-bubble">
                    <div className="msg-text">
                      {streaming
                        ? /final response/i.test(streaming)
                          ? <>{parseCit(fixBasis(stripThinking(streaming)))}<span className="blink">▍</span></>
                          : <Dots/>
                        : <Dots/>}
                    </div>
                    {liveSource && <Sources results={liveSource}/>}
                  </div>
                </div>
              )}
              <div ref={endRef}/>
            </div>
          )}
        </div>
      </div>
      <div className="chat-bar">
        <div style={{width:'100%',maxWidth:760,display:'flex',alignItems:'center',gap:6}}>
          {usage && <CtxRing usage={usage}/>}
          <div className="chat-wrap" style={{maxWidth:'none',flex:1}}>
            <input ref={inputRef} className="chat-input" placeholder="Ask a question about bone science…"
            value={input} onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(input); } }}
            disabled={loading}/>
          <button className="send-btn" onClick={() => send(input)} disabled={loading || !input.trim()}>
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M3 9h12M10 4l5 5-5 5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── SEARCH TAB ────────────────────────────────────────────────────────────────
function SearchTab({ totalChunks }) {
  const [query, setQuery]     = useState('');
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [searched, setSearched] = useState(false);
  const [current, setCurrent] = useState('');
  const [elapsed, setElapsed] = useState(0);
  const [filter, setFilter]   = useState('All');
  const [topK, setTopK]       = useState(10);
  const [yearMin, setYearMin] = useState(1970);
  const [yearMax, setYearMax] = useState(2026);

  const EXAMPLES = ['trabecular microstructure','bone mineral density osteoporosis','collagen crosslink mechanics','stress fracture fatigue crack','osteosarcoma bone metastasis','bone scaffold tissue engineering'];
  const FILTERS  = ['All','Papers only','Textbooks only'];

  const highlightTerms = (text, q) => {
    if (!q) return text;
    const words = q.trim().split(/\s+/).filter(w => w.length > 2);
    if (!words.length) return text;
    const safe = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const pattern = new RegExp(`(${words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')})`, 'gi');
    return safe.replace(pattern, '<mark style="background:#fef3c7;border-radius:2px;padding:0 1px;color:inherit">$1</mark>');
  };

  const doSearch = async (q, f, k, yMin, yMax) => {
    const term = (q || query).trim();
    const sf   = f || filter;
    const tk   = k ?? topK;
    const ym   = yMin ?? yearMin;
    const yx   = yMax ?? yearMax;
    if (!term || loading) return;
    setQuery(term); setLoading(true); setSearched(true); setCurrent(term); setResults([]);
    try {
      const fd = new FormData();
      fd.append('query', term); fd.append('top_k', String(tk)); fd.append('source_filter', sf);
      fd.append('year_min', String(ym)); fd.append('year_max', String(yx));
      const r = await apiFetch('/api/search', { method:'POST', body:fd });
      const d = await r.json();
      setResults(d.results || []); setElapsed(d.elapsed_ms || 0);
    } catch { setResults([]); }
    setLoading(false);
  };

  return (
    <div style={{display:'flex',flexDirection:'column',flex:1}}>
      <div className="search-hdr">
        <div style={{fontFamily:'var(--sans)',fontSize:24,marginBottom:16,color:'var(--text)',textAlign:'center'}}>Search</div>
        <div className="search-bar">
          <svg className="search-icon" width="17" height="17" viewBox="0 0 17 17" fill="none">
            <circle cx="7.5" cy="7.5" r="5" stroke="currentColor" strokeWidth="1.7"/>
            <path d="M11.5 11.5l3.5 3.5" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/>
          </svg>
          <input className="search-input"
            placeholder={`Search ${totalChunks ? totalChunks.toLocaleString() : '248,629'} paper and textbook embeddings…`}
            value={query} onChange={e => setQuery(e.target.value)}
            onKeyDown={e => e.key==='Enter' && doSearch(query)}/>
          <button className="search-btn" onClick={() => doSearch(query)} disabled={loading || !query.trim()}>
            {loading ? <Spinner/> : 'Search'}
          </button>
        </div>
        <div className="filter-row" style={{flexWrap:'wrap',gap:8}}>
          {FILTERS.map(f => (
            <button key={f} className={`filter-btn ${filter===f?'active':''}`}
              onClick={() => { setFilter(f); if (searched) doSearch(query, f); }}>{f}</button>
          ))}
          <div style={{display:'flex',alignItems:'center',gap:16,marginLeft:8,flexWrap:'wrap'}}>
            <label style={{fontSize:12,color:'var(--text3)',display:'flex',alignItems:'center',gap:6,whiteSpace:'nowrap'}}>
              Results
              <input type="range" min="5" max="40" step="5" value={topK}
                className="range-slider"
                onChange={e => { const v=Number(e.target.value); setTopK(v); if(searched) doSearch(query, filter, v); }}
                style={{background:`linear-gradient(to right,#b07820 0%,#b07820 ${(topK-5)/35*100}%,#e5e7eb ${(topK-5)/35*100}%,#e5e7eb 100%)`}}/>
              <span style={{fontWeight:600,color:'var(--text)',minWidth:20}}>{topK}</span>
            </label>
            <label style={{fontSize:12,color:'var(--text3)',display:'flex',alignItems:'center',gap:6,whiteSpace:'nowrap'}}>
              From
              <input type="range" min="1970" max="2026" step="1" value={yearMin}
                className="range-slider"
                onChange={e => { const v=Math.min(Number(e.target.value),yearMax); setYearMin(v); if(searched) doSearch(query,filter,topK,v,yearMax); }}
                style={{background:`linear-gradient(to right,#b07820 0%,#b07820 ${(yearMin-1970)/56*100}%,#e5e7eb ${(yearMin-1970)/56*100}%,#e5e7eb 100%)`}}/>
              <span style={{fontWeight:600,color:'var(--text)',minWidth:32}}>{yearMin}</span>
            </label>
            <label style={{fontSize:12,color:'var(--text3)',display:'flex',alignItems:'center',gap:6,whiteSpace:'nowrap'}}>
              To
              <input type="range" min="1970" max="2026" step="1" value={yearMax}
                className="range-slider"
                onChange={e => { const v=Math.max(Number(e.target.value),yearMin); setYearMax(v); if(searched) doSearch(query,filter,topK,yearMin,v); }}
                style={{background:`linear-gradient(to right,#b07820 0%,#b07820 ${(yearMax-1970)/56*100}%,#e5e7eb ${(yearMax-1970)/56*100}%,#e5e7eb 100%)`}}/>
              <span style={{fontWeight:600,color:'var(--text)',minWidth:32}}>{yearMax}</span>
            </label>
          </div>
        </div>
      </div>
      <div className="search-body">
        {!searched && (
          <div>
            <p style={{fontSize:14,color:'var(--text2)',marginBottom:16,lineHeight:1.65,textAlign:'center',maxWidth:800,width:'100%'}}>BoneScholar - a bone science dataset of 54,634 papers and 16 textbooks. Results are ranked by semantic relevance.</p>
            <div className="ex-chips">
              <span className="chips-label">Try:</span>
              {EXAMPLES.map((ex,i) => <button key={i} className="chip" onClick={() => doSearch(ex)}>{ex}</button>)}
            </div>
          </div>
        )}
        {loading && <div className="loading-row"><Dots/><span>Searching BoneScholar…</span></div>}
        {!loading && searched && results.length > 0 && (() => {
          return (
            <>
              <div className="results-meta"><strong>{results.length} results</strong> for "{current}" · {elapsed}ms</div>
              <div className="results-list">
                {results.map((r,i) => {
                  const tb = r.source_type === 'textbook';
                  const chunkPos = r.total_chunks ? `embedding ${r.chunk_index + 1} of ${r.total_chunks}` : null;
                  return (
                    <div key={i} className="result-card">
                      <div className="result-top">
                        <div className="result-title">
                          [{r.rank}] {r.title}
                          {r.doi && (
                            <a href={`https://doi.org/${r.doi}`} target="_blank" rel="noopener"
                              style={{marginLeft:'8px',fontSize:'11px',fontWeight:500,color:'#b07820',
                                textDecoration:'none',borderBottom:'1px solid #b07820',whiteSpace:'nowrap'}}>
                              Open ↗
                            </a>
                          )}
                        </div>
                        <div className="score-wrap">
                          <span className="score-num">{r.score.toFixed(3)}</span>
                          <div className="score-track"><div className="score-fill" style={{width:`${r.score*100}%`}}/></div>
                        </div>
                      </div>
                      <div className="result-byline">
                        <span className="src-badge" style={{background:tb?'#eaf5ee':'#e8ecf4',color:tb?'#1a7a4e':'#1a2540'}}>
                          {tb ? '📚 Textbook' : '📄 Paper'}
                        </span>
                        {[r.authors, r.year, r.venue].filter(Boolean).join(' · ')}
                        {r.page_number ? ` · p.${r.page_number}` : ''}
                        {chunkPos && <span style={{marginLeft:6,color:'var(--text3)'}}>· {chunkPos}</span>}
                      </div>
                      {r.excerpt && (
                        <div className="result-excerpt"
                          dangerouslySetInnerHTML={{__html: '"' + highlightTerms(r.excerpt, current) + '"'}}/>
                      )}
                    </div>
                  );
                })}
              </div>
            </>
          );
        })()}
        {!loading && searched && results.length === 0 && <div className="loading-row">No results. Try a different query.</div>}
      </div>
    </div>
  );
}

// Quick (agent + grounding only) vs Deep (full agent + critic + evidence loop).
function ModeToggle({ mode, setMode, disabled }) {
  const opt = (val, label, title) => (
    <button title={title} disabled={disabled} onClick={() => setMode(val)}
      style={{
        background: mode === val ? 'var(--navy)' : 'transparent',
        color: mode === val ? '#fff' : 'var(--text2)',
        border: 'none', borderRadius: 6, padding: '5px 10px', fontSize: 12.5,
        cursor: disabled ? 'default' : 'pointer', fontFamily: 'var(--sans)',
      }}>{label}</button>
  );
  return (
    <div style={{display:'inline-flex',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:2,gap:2,flexShrink:0}}>
      {opt('quick', 'Quick', 'Agent + physical grounding only — fast (~5–10s)')}
      {opt('deep', 'Deep', 'Full pipeline: agent + critic + literature/graph evidence (~10–40s)')}
    </div>
  );
}

// ── REASON TAB ────────────────────────────────────────────────────────────────
// Phase 2 — pure-LLM reasoning agent (no RAG). Turn shape:
//   { id, query, answer, physical_check, critic_notes, user_feedback, timestamp }
// physical_check / critic_notes / user_feedback are reserved for later phases.
function ReasonTab() {
  const [turns, setTurns]   = useState([]);
  const [pendingQuery, setPendingQuery] = useState('');
  const [input, setInput]   = useState('');
  const [loading, setLoading] = useState(false);
  const [streaming, setStreaming] = useState('');
  const [usage, setUsage]   = useState(null); // {prompt, completion, ctx}
  const [proposedFor, setProposedFor] = useState({}); // turn_id -> {proposal, correction_id}
  const [fbNonce, setFbNonce] = useState({}); // turn_id -> remount counter; bumped on Discard so the 👎 bar re-enables for a retry
  const [status, setStatus] = useState('');             // pipeline status pill while loading
  const [mode, setMode]     = useState('deep');         // 'deep' (agent+critic) | 'quick' (agent only)
  const endRef     = useRef(null);
  const inputRef   = useRef(null);
  const chatAreaRef = useRef(null);
  const autoScroll = useRef(true);

  const handleWheel = () => { autoScroll.current = false; };
  const handleTouchStart = () => { autoScroll.current = false; };
  const handleChatScroll = () => {
    const el = chatAreaRef.current;
    if (!el) return;
    if (el.scrollHeight - el.scrollTop - el.clientHeight < 60) {
      autoScroll.current = true;
    }
  };

  useEffect(() => {
    if (autoScroll.current && endRef.current) {
      endRef.current.scrollIntoView({ behavior: 'smooth' });
    }
  }, [turns, loading, streaming, pendingQuery]);

  const send = async (text) => {
    const t = text.trim();
    if (!t || loading) return;
    autoScroll.current = true;
    setInput('');
    setPendingQuery(t);   // show user bubble immediately
    setLoading(true);
    setStreaming('');

    // Sliding window of the last 10 messages (5 pairs). Strip thinking from
    // assistant turns so we resend only the visible reasoning.
    const recent = turns.slice(-5);
    const history = [];
    recent.forEach(turn => {
      history.push({ role: 'user', content: turn.query });
      history.push({ role: 'assistant', content: stripThinking(turn.answer) });
    });
    const allQuestions = turns.map(turn => turn.query);

    let answer = '';
    let physicalCheck = null;
    let outOfScope = false;
    let rounds = [];
    let literature = [];
    let kg = null;
    let phase = 'agent';           // 'agent' | 'critic' | 'agent_revise'
    let critic_resolved = true;
    setStatus('Reasoning…');
    try {
      const fd = new FormData();
      fd.append('question', t);
      fd.append('history', JSON.stringify(history));
      fd.append('all_questions', JSON.stringify(allQuestions));
      fd.append('mode', mode);
      const resp = await apiFetch('/api/reason/chat', { method:'POST', body:fd });
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream:true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const ev = JSON.parse(line.slice(6));
          if (ev.type === 'round_start') {
            phase = ev.phase;
            if (ev.phase === 'agent') setStatus('Reasoning…');
            else if (ev.phase === 'critic') setStatus(ev.round === 2 ? 'Critic reviewing…' : 'Critic re-checking…');
            else if (ev.phase === 'agent_revise') { answer = ''; setStreaming(''); setStatus('Revising…'); }
          }
          else if (ev.type === 'token') {
            if (ev.phase === 'agent_revise') {
              // Replace the displayed streaming text with the revision-in-progress.
              answer += ev.content; setStreaming(answer);
            } else {
              answer += ev.content; setStreaming(answer);
            }
          }
          else if (ev.type === 'literature') { literature = ev.passages || []; }
          else if (ev.type === 'kg_context') { kg = {facts: ev.facts || [], anchors: ev.anchors || []}; }
          else if (ev.type === 'physical_check') { physicalCheck = ev; rounds.push({role:'physical_check', round: ev.round, ...ev}); }
          else if (ev.type === 'critic_review') { rounds.push({role:'critic', round: ev.round, verdict: ev.verdict, notes: ev.notes, suggested_revision: ev.suggested_revision, majority: ev.majority, minority: ev.minority, score: ev.score, user_override: ev.user_override}); }
          else if (ev.type === 'done')  {
            answer = ev.answer;
            outOfScope = !!ev.out_of_scope;
            critic_resolved = !!ev.critic_resolved;
            if (ev.final_physical_check) physicalCheck = ev.final_physical_check;
            if (Array.isArray(ev.rounds) && ev.rounds.length) rounds = ev.rounds;
            if (Array.isArray(ev.literature)) literature = ev.literature;
            if (ev.kg) kg = ev.kg;
            if (typeof ev.prompt_tokens === 'number') {
              setUsage({ prompt: ev.prompt_tokens, completion: ev.completion_tokens, ctx: ev.context_window || 8192, estimated: true });
            }
          }
          else if (ev.type === 'error') { answer = '⚠️ ' + ev.message; }
        }
      }
    } catch(e) { answer = '⚠️ Error: ' + e.message; }
    const turn = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      query: t,
      answer,
      out_of_scope: outOfScope,
      physical_check: physicalCheck,
      rounds,
      literature,
      kg,
      critic_resolved,
      critic_notes: null,
      user_feedback: null,
      timestamp: new Date().toISOString(),
    };
    setTurns(prev => [...prev, turn]);
    setStreaming('');
    setStatus('');
    setPendingQuery('');
    setLoading(false);
    inputRef.current?.focus();
  };

  const CHIPS = [
    'What raises fracture risk in postmenopausal cortical bone?',
    'How does a lytic lesion change vertebral failure load?',
    'Why does trabecular bone fail before cortical in osteoporosis?',
  ];

  const [rulesOpen, setRulesOpen] = useState(false);

  const empty = turns.length === 0 && !loading;
  return (
    <div className="ask" style={{position:'relative'}}>
      <div style={{position:'absolute',top:12,right:16,zIndex:40,display:'flex',flexDirection:'column',alignItems:'flex-end',gap:8}}>
        <button onClick={() => setRulesOpen(true)} title="Manage the rules you've taught BoneGraph"
          style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:'6px 12px',fontSize:13,color:'var(--text2)',cursor:'pointer',fontFamily:'var(--sans)',display:'flex',alignItems:'center',gap:6}}>
          <span style={{fontSize:18}}>⚙</span> Your rules
        </button>
        <ModeToggle mode={mode} setMode={setMode} disabled={loading}/>
      </div>
      {rulesOpen && <RulesPanel onClose={() => setRulesOpen(false)}/>}
      <div className="chat-area" ref={chatAreaRef} onScroll={handleChatScroll} onWheel={handleWheel} onTouchStart={handleTouchStart}>
        <div className="chat-inner">
          {empty ? (
            <div className="empty-state">
              <div className="empty-avatar"><BoneSVG size={100}/></div>
              <div className="empty-title">Reasoning</div>
              <div className="empty-sub">Grounded in bone mechanics, physical rules, and your feedback</div>
              <div className="chips">
                {CHIPS.map((s,i) => <button key={i} className="chip" onClick={() => send(s)}>{s}</button>)}
              </div>
            </div>
          ) : (
            <div className="messages">
              {turns.map(turn => (
                <ReasonTurn key={turn.id} turn={turn}
                  proposed={proposedFor[turn.id]}
                  fbNonce={fbNonce[turn.id] || 0}
                  onFeedback={ev => {
                    if (ev.polarity === -1 && ev.proposed_rule) {
                      setProposedFor(prev => ({...prev, [turn.id]: {proposal: ev.proposed_rule, correction_id: ev.correction_id}}));
                    }
                  }}
                  onProposalDone={() => {
                    setProposedFor(prev => { const cp = {...prev}; delete cp[turn.id]; return cp; });
                  }}
                  onDiscard={() => {
                    setProposedFor(prev => { const cp = {...prev}; delete cp[turn.id]; return cp; });
                    setFbNonce(prev => ({...prev, [turn.id]: (prev[turn.id] || 0) + 1}));
                  }}
                />
              ))}
              {pendingQuery && (
                <div className="msg msg-user">
                  <div className="msg-bubble"><div className="msg-text">{pendingQuery}</div></div>
                </div>
              )}
              {(loading || streaming) && (
                <div className="msg msg-asst">
                  <div className="msg-avatar"><BoneSVG size={34}/></div>
                  <div className="msg-bubble">
                    {status && (
                      <div style={{fontSize:11,color:'var(--text3)',marginBottom:6,letterSpacing:.3,textTransform:'uppercase'}}>
                        {status}
                      </div>
                    )}
                    <div className="msg-text">
                      {streaming
                        ? /final response/i.test(streaming)
                          ? <>{parseCit(fixBasis(stripThinking(streaming)))}<span className="blink">▍</span></>
                          : <Dots/>
                        : <Dots/>}
                    </div>
                  </div>
                </div>
              )}
              <div ref={endRef}/>
            </div>
          )}
        </div>
      </div>
      <div className="chat-bar">
        <div style={{width:'100%',maxWidth:760,display:'flex',alignItems:'center',gap:6}}>
          {usage && <CtxRing usage={usage}/>}
          <div className="chat-wrap" style={{maxWidth:'none',flex:1}}>
            <input ref={inputRef} className="chat-input"
              placeholder="Ask a reasoning question about bone fracture, fragility, remodelling…"
              value={input} onChange={e => setInput(e.target.value)}
              onKeyDown={e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(input); } }}
              disabled={loading}/>
            <button className="send-btn" onClick={() => send(input)} disabled={loading || !input.trim()}>
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M3 9h12M10 4l5 5-5 5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ruleSummary(r) {
  const p = r.params || {};
  if (r.kind === 'range') {
    const ctx = (p.context_terms || []).join(', ');
    return `${p.lo}–${p.hi} ${p.unit || ''}${ctx ? ` · context: ${ctx}` : ''}`;
  }
  if (r.kind === 'forbid_pattern') {
    const ctx = (p.context_terms || []).join(', ');
    const forb = (p.forbidden_terms || []).join(', ');
    return `avoid “${forb}”${ctx ? ` near ${ctx}` : ''}`;
  }
  if (r.kind === 'comparative') {
    const a = (p.first_terms || []).join('/');
    const b = (p.second_terms || []).join('/');
    const ax = (p.comparator_terms || []).join(', ');
    return `${a} before/exceeds ${b}${ax ? ` · axis: ${ax}` : ''}`;
  }
  return JSON.stringify(p);
}

function RulesPanel({ onClose }) {

  const [importMsg, setImportMsg] = useState(null);
  const [importing, setImporting] = useState(false);
  const fileRef = useRef(null);

  const load = async () => {
    try {
      const r = await apiFetch('/api/reason/rules');
      const d = await r.json();
      setRules(d.rules || []);
    } catch (e) { setError(e.message); }
  };
  useEffect(() => { load(); }, []);

  const onImportFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    setImporting(true); setImportMsg(null); setError('');
    try {
      const fd = new FormData(); fd.append('file', f);
      const r = await apiFetch('/api/reason/rules/import', { method:'POST', body: fd });
      const d = await r.json();
      if (d.error) { setError(d.error); }
      else { setImportMsg(d); await load(); }
    } catch (err) { setError(err.message); }
    finally { setImporting(false); if (fileRef.current) fileRef.current.value = ''; }
  };

  const setEnabled = async (rule, enabled) => {
    setBusy(b => ({...b, [rule.id]: true}));
    try {
      const fd = new FormData(); fd.append('enabled', enabled ? 'true' : 'false');
      await apiFetch(`/api/reason/rules/${rule.id}/enabled`, { method:'POST', body: fd });
      setRules(rs => rs.map(x => x.id === rule.id ? {...x, enabled} : x));
    } catch (e) { setError(e.message); }
    finally { setBusy(b => ({...b, [rule.id]: false})); }
  };

  const del = async (rule) => {
    setBusy(b => ({...b, [rule.id]: true}));
    try {
      await apiFetch(`/api/reason/rules/${rule.id}`, { method:'DELETE' });
      setRules(rs => rs.filter(x => x.id !== rule.id));
    } catch (e) { setError(e.message); }
    finally { setBusy(b => ({...b, [rule.id]: false})); }

        </div>
        <div style={{padding:'10px 20px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <input ref={fileRef} type="file" accept=".csv,.xlsx" onChange={onImportFile} style={{display:'none'}}/>
          <button disabled={importing} onClick={() => fileRef.current && fileRef.current.click()}
            style={{background:'var(--navy)',color:'#fff',border:'none',borderRadius:6,padding:'6px 12px',fontSize:13,cursor:'pointer'}}>
            {importing ? 'Importing…' : '⬆ Import CSV / Excel'}
          </button>
          <a href="/api/reason/rules/template" download
            style={{fontSize:12,color:'var(--text2)',textDecoration:'underline'}}>download template</a>
        </div>
        {importMsg && (
          <div style={{padding:'8px 20px',fontSize:12,background:'rgba(46,125,50,.06)',borderBottom:'1px solid var(--border)'}}>
            <div style={{color:'#2e7d32',fontWeight:600}}>Imported {importMsg.imported} rule{importMsg.imported===1?'':'s'}.</div>

                  <div style={{fontSize:13.5,fontWeight:600,color:'var(--text)'}}>{r.name}</div>
                  <div style={{fontSize:12,color:'var(--text2)',marginTop:3}}>{ruleSummary(r)}</div>
                  <div style={{fontSize:10,color:'var(--text3)',marginTop:4,textTransform:'uppercase',letterSpacing:.3,display:'flex',gap:6,alignItems:'center'}}>
                    <span>{r.kind === 'range' ? 'numeric range' : 'forbidden pattern'}</span>

                  </div>

              </div>
              <div style={{display:'flex',gap:8,marginTop:8}}>
                <button disabled={busy[r.id]} onClick={() => setEnabled(r, !r.enabled)}

                  style={{background:'transparent',color:'#b02020',border:'1px solid var(--border)',borderRadius:6,padding:'4px 10px',fontSize:12,cursor:'pointer'}}>
                  Delete
                </button>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ReviewDialogue({ turn }) {
  const [open, setOpen] = useState(false);
  const rounds = (turn.rounds || []).filter(r => r.role === 'critic' || r.role === 'agent');
  const criticRounds = rounds.filter(r => r.role === 'critic');
  const literature = turn.literature || [];
  const kgFacts = (turn.kg && turn.kg.facts) || [];
  if (!criticRounds.length) return null;
  const finalVerdict = criticRounds[criticRounds.length - 1].verdict;
  const color = finalVerdict === 'accept' ? '#2e7d32'
              : finalVerdict === 'conflicting_evidence' ? '#8a5010'
              : '#b02020';
  const label = finalVerdict === 'accept'
    ? (criticRounds.length === 1 ? 'Critic: accepted on first review' : 'Critic: accepted after revision')
    : finalVerdict === 'conflicting_evidence'
    ? 'Critic: literature conflicts — both positions shown'
    : 'Critic: unresolved after revision';
  return (
    <div style={{marginTop:10,fontSize:12}}>
      <button onClick={() => setOpen(o => !o)}
        style={{background:'transparent',border:'1px solid var(--border)',borderRadius:6,padding:'4px 10px',fontSize:12,cursor:'pointer',color:'var(--text2)',display:'flex',alignItems:'center',gap:6}}>
        <span style={{color}}>●</span>
        <span>{label}</span>
        <span style={{color:'var(--text3)'}}>· {open ? 'hide' : 'show'} dialogue</span>
      </button>
      {open && (
        <div style={{marginTop:8,border:'1px solid var(--border)',borderRadius:6,padding:10,background:'var(--surface2)',display:'flex',flexDirection:'column',gap:10}}>
          {criticRounds.map((r, i) => (
            <div key={i}>
              <div style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:.3,marginBottom:4}}>
                Round {r.round} · Critic ({r.verdict === 'conflicting_evidence' ? 'conflicting evidence' : r.verdict})
                {r.user_override && <span style={{marginLeft:6,fontSize:10,padding:'1px 5px',borderRadius:3,background:'rgba(176,120,32,.15)',color:'#8a5010'}}>forced by your rule</span>}
              </div>
              {(r.notes || []).length > 0 && (
                <ul style={{margin:'2px 0 4px 18px',padding:0,color:'var(--text2)',lineHeight:1.5}}>
                  {r.notes.map((n,j) => <li key={j}>{n}</li>)}
                </ul>
              )}
              {r.majority && (
                <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>
                  <strong style={{color:'#2e7d32'}}>Majority:</strong> {r.majority}
                </div>
              )}
              {r.minority && (
                <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>
                  <strong style={{color:'#8a5010'}}>Minority:</strong> {r.minority}
                </div>
              )}
              {r.score && <ConfidenceBars score={r.score}/>}
              {r.suggested_revision && (
                <div style={{fontSize:12,color:'var(--text3)',fontStyle:'italic',marginTop:2}}>
                  Suggestion: {r.suggested_revision}
                </div>
              )}
            </div>
          ))}
          {literature.length > 0 && (
            <div style={{borderTop:'1px solid var(--border)',paddingTop:8}}>
              <div style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:.3,marginBottom:4}}>
                Evidence the critic reviewed
              </div>
              <ul style={{margin:'2px 0 0 18px',padding:0,color:'var(--text2)',lineHeight:1.5}}>
                {literature.map((p,j) => (
                  <li key={j}>
                    <strong>[L{p.rank}]</strong> {p.title}{p.year ? ` (${p.year})` : ''}
                    {typeof p.score === 'number' && <span style={{color:'var(--text3)'}}> · {p.score.toFixed(3)}</span>}
                  </li>
                ))}
              </ul>
            </div>
          )}
          {kgFacts.length > 0 && (
            <div style={{borderTop:'1px solid var(--border)',paddingTop:8}}>
              <div style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:.3,marginBottom:4}}>
                Knowledge-graph facts the critic saw
              </div>
              <ul style={{margin:'2px 0 0 18px',padding:0,color:'var(--text2)',lineHeight:1.5}}>
                {kgFacts.map((f,j) => (
                  <li key={j}>{f.subject} <span style={{color:'var(--amber)'}}>[{f.relation}]</span> {f.object}</li>
                ))}
              </ul>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function FeedbackBar({ turn, onFeedback }) {
  const [polarity, setPolarity] = useState(turn._feedback_polarity || null);
  const [showInput, setShowInput] = useState(false);
  const [text, setText] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState('');

  const sendUp = async () => {
    if (polarity) return;
    setPolarity(1);
    try {
      await apiFetch('/api/reason/feedback', {
        method:'POST',
        body: (() => { const fd = new FormData(); fd.append('turn_id', turn.id); fd.append('polarity','1'); return fd; })(),
      });
      onFeedback && onFeedback({turn_id: turn.id, polarity: 1});
    } catch(e) { setError(e.message); setPolarity(null); }
  };

  const startDown = () => {
    if (polarity) return;
    setShowInput(true);
  };

  const submitDown = async () => {
    setSubmitting(true); setError('');
    try {
      const fd = new FormData();
      fd.append('turn_id', turn.id);
      fd.append('polarity', '-1');
      fd.append('question', turn.query);
      fd.append('answer', stripThinking(turn.answer || ''));
      fd.append('feedback_text', text);
      const resp = await apiFetch('/api/reason/feedback', { method:'POST', body: fd });
      const data = await resp.json();
      setPolarity(-1);
      setShowInput(false);
      onFeedback && onFeedback({turn_id: turn.id, polarity: -1, proposed_rule: data.proposed_rule, correction_id: data.correction_id});
    } catch(e) {
      setError(e.message);
    } finally {
      setSubmitting(false);
    }
  };

  const cancelDown = () => { setShowInput(false); setText(''); };

  const btn = (selected, color) => ({
    background: selected ? color : 'transparent',
    color: selected ? '#fff' : 'var(--text2)',
    border: '1px solid var(--border)',
    borderRadius: 6,
    padding: '3px 9px',
    fontSize: 13,
    cursor: polarity ? 'default' : 'pointer',
    opacity: polarity && !selected ? 0.4 : 1,
  });

  return (
    <div style={{marginTop:10}}>
      <div style={{display:'flex',gap:6,alignItems:'center'}}>
        <button style={btn(polarity===1, '#2e7d32')} onClick={sendUp} disabled={!!polarity}>👍</button>
        <button style={btn(polarity===-1, '#b02020')} onClick={startDown} disabled={!!polarity}>👎</button>
        {polarity === -1 && !showInput && <span style={{fontSize:12,color:'var(--text3)'}}>feedback saved</span>}
        {polarity === 1 && <span style={{fontSize:12,color:'var(--text3)'}}>thanks</span>}
        {error && <span style={{fontSize:12,color:'#b02020'}}>{error}</span>}
      </div>
      {showInput && (
        <div style={{marginTop:8,display:'flex',flexDirection:'column',gap:6}}>
          <textarea
            value={text}
            onChange={e => setText(e.target.value)}
            placeholder="What was wrong? Be specific — e.g. 'cortical modulus is 10–25 GPa, not 80'."
            style={{minHeight:60,padding:8,border:'1px solid var(--border)',borderRadius:6,fontFamily:'var(--sans)',fontSize:13,resize:'vertical',background:'var(--surface2)',color:'var(--text)'}}/>
          <div style={{display:'flex',gap:6}}>
            <button onClick={submitDown} disabled={submitting}
              style={{background:'var(--navy)',color:'#fff',border:'none',padding:'6px 14px',borderRadius:6,fontSize:13,cursor:'pointer'}}>
              {submitting ? 'Submitting…' : 'Submit feedback'}
            </button>
            <button onClick={cancelDown} disabled={submitting}
              style={{background:'transparent',color:'var(--text2)',border:'1px solid var(--border)',padding:'6px 14px',borderRadius:6,fontSize:13,cursor:'pointer'}}>
              Cancel
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function ProposedRuleCard({ proposal, onConfirm, onDismiss, correctionId }) {
  const [editable, setEditable] = useState(() => JSON.parse(JSON.stringify(proposal)));
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState('');

  if (!proposal) return null;
  if (proposal.kind === 'none') {
    return (
      <div style={{marginTop:10,padding:'8px 10px',border:'1px dashed var(--border)',borderRadius:6,fontSize:12,color:'var(--text3)'}}>
        Saved your correction. Couldn't extract a structured rule — {proposal.reason || 'too open-ended'}.
        <div style={{marginTop:4}}>
          <button onClick={onDismiss} style={{background:'transparent',color:'var(--text2)',border:'none',padding:0,fontSize:12,cursor:'pointer',textDecoration:'underline'}}>dismiss</button>
        </div>
      </div>
    );
  }

  const kind = editable.kind;
  const p = editable.params || {};

  const setParam = (k, v) => setEditable({...editable, params:{...p, [k]: v}});
  const setList  = (k, v) => setParam(k, v.split(',').map(s => s.trim()).filter(Boolean));

  const confirm = async () => {
    setSubmitting(true); setError('');
    try {
      const fd = new FormData();
      fd.append('name', editable.name || 'User rule');
      fd.append('kind', kind);
      fd.append('params', JSON.stringify(editable.params));
      if (correctionId) fd.append('source_correction_id', String(correctionId));
      const resp = await apiFetch('/api/reason/rules/confirm', { method:'POST', body: fd });
      const data = await resp.json();
      if (!data.ok) throw new Error(data.error || 'Failed to save');
      onConfirm && onConfirm(data.rule);
    } catch(e) {
      setError(e.message);
    } finally {
      setSubmitting(false);
    }
  };

  return (
    <div style={{marginTop:10,border:'1px solid var(--amber-border)',borderRadius:8,padding:10,background:'rgba(176,120,32,.05)'}}>
      <div style={{fontSize:12,fontWeight:500,color:'var(--text)',marginBottom:6}}>
        Proposed rule from your feedback
        <span style={{marginLeft:6,fontWeight:400,color:'var(--text3)'}}>· {kind === 'range' ? 'numeric range' : kind === 'comparative' ? 'comparative / ordinal' : 'forbidden pattern'}</span>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:4,fontSize:12}}>
        <RuleField label="Name" value={editable.name} onChange={v => setEditable({...editable, name:v})}/>
        {kind === 'range' && <>
          <RuleField label="Unit" value={p.unit} onChange={v => setParam('unit', v)}/>
          <div style={{display:'flex',gap:6}}>
            <RuleField label="Min" value={p.lo} onChange={v => setParam('lo', parseFloat(v) || 0)}/>
            <RuleField label="Max" value={p.hi} onChange={v => setParam('hi', parseFloat(v) || 0)}/>
          </div>
          <RuleField label="Context terms" value={(p.context_terms||[]).join(', ')} onChange={v => setList('context_terms', v)}/>
          <RuleField label="Value terms"   value={(p.value_terms||[]).join(', ')}   onChange={v => setList('value_terms', v)}/>
        </>}
        {kind === 'forbid_pattern' && <>
          <RuleField label="Context terms"   value={(p.context_terms||[]).join(', ')}   onChange={v => setList('context_terms', v)}/>
          <RuleField label="Forbidden terms" value={(p.forbidden_terms||[]).join(', ')} onChange={v => setList('forbidden_terms', v)}/>
          <RuleField label="Exception terms" value={(p.exception_terms||[]).join(', ')} onChange={v => setList('exception_terms', v)}/>
          <RuleField label="Explanation" value={p.explanation} onChange={v => setParam('explanation', v)}/>
        </>}
        {kind === 'comparative' && <>
          <RuleField label="First terms"      value={(p.first_terms||[]).join(', ')}      onChange={v => setList('first_terms', v)}/>
          <RuleField label="Second terms"     value={(p.second_terms||[]).join(', ')}     onChange={v => setList('second_terms', v)}/>
          <RuleField label="Comparator terms" value={(p.comparator_terms||[]).join(', ')} onChange={v => setList('comparator_terms', v)}/>
          <RuleField label="Explanation" value={p.explanation} onChange={v => setParam('explanation', v)}/>
        </>}
      </div>
      <div style={{display:'flex',gap:6,marginTop:8}}>
        <button onClick={confirm} disabled={submitting}
          style={{background:'var(--navy)',color:'#fff',border:'none',padding:'6px 14px',borderRadius:6,fontSize:13,cursor:'pointer'}}>
          {submitting ? 'Saving…' : 'Confirm rule'}
        </button>
        <button onClick={onDismiss} disabled={submitting}
          style={{background:'transparent',color:'var(--text2)',border:'1px solid var(--border)',padding:'6px 14px',borderRadius:6,fontSize:13,cursor:'pointer'}}>
          Discard
        </button>
        {error && <span style={{fontSize:12,color:'#b02020',alignSelf:'center'}}>{error}</span>}
      </div>
    </div>
  );
}

function RuleField({ label, value, onChange }) {
  return (
    <label style={{display:'flex',gap:6,alignItems:'center',fontSize:12}}>
      <span style={{minWidth:110,color:'var(--text3)'}}>{label}</span>
      <input value={value ?? ''} onChange={e => onChange(e.target.value)}
        style={{flex:1,padding:'3px 6px',border:'1px solid var(--border)',borderRadius:4,fontFamily:'var(--sans)',fontSize:12,background:'var(--surface)',color:'var(--text)'}}/>
    </label>
  );
}

function ConfidenceBars({ score }) {
  const maj = score.majority_pct ?? 0;
  const min = score.minority_pct ?? 0;
  const n = score.n_supporting ?? 0;
  const total = score.n_passages ?? n;
  const Bar = ({ label, pct, color, tags }) => (
    <div style={{marginTop:4}}>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text3)',marginBottom:2}}>
        <span>{label}{(tags && tags.length > 0) && <span style={{marginLeft:6,color}}>· {tags.join(', ')}</span>}</span>
        <span style={{fontWeight:600,color}}>{pct}%</span>
      </div>
      <div style={{height:8,borderRadius:4,background:'var(--border)',overflow:'hidden'}}>
        <div style={{width:`${pct}%`,height:'100%',background:color,transition:'width .4s'}}/>
      </div>
    </div>
  );
  return (
    <div style={{marginTop:8,padding:'8px 10px',border:'1px solid var(--border)',borderRadius:6,background:'var(--surface)'}}>
      <div style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:.3}}>
        Confidence from retrieved literature
      </div>
      <Bar label="Majority" pct={maj} color="#2e7d32" tags={score.majority_support}/>
      <Bar label="Minority" pct={min} color="#8a5010" tags={score.minority_support}/>
      <div style={{fontSize:11,color:'var(--text3)',marginTop:6,fontStyle:'italic'}}>
        Based on {n} of {total} retrieved passage{total===1?'':'s'} that took a position. A split, not a verdict — the literature genuinely disagrees.
      </div>
    </div>
  );
}

function PhysicalCheckBadge({ check }) {
  const passed = check.passed;
  const n = check.rule_count || 0;
  const userN = check.user_rule_count || 0;
  const vCount = (check.violations || []).length;
  const headerBg = passed ? 'rgba(46,125,50,.08)' : 'rgba(176,32,32,.08)';
  const headerColor = passed ? '#2e7d32' : '#b02020';
  return (
    <div style={{marginTop:12,border:'1px solid var(--border)',borderRadius:8,overflow:'hidden',fontSize:12}}>
      <div style={{padding:'6px 10px',background:headerBg,color:headerColor,fontWeight:500,display:'flex',justifyContent:'space-between'}}>
        <span>{passed ? '✓ Passed physical grounding' : `✗ ${vCount} violation${vCount===1?'':'s'} of physical grounding`}</span>
        <span style={{color:'var(--text3)',fontWeight:400}}>{n} rules checked{userN ? ` (${userN} your rule${userN===1?'':'s'})` : ''}</span>
      </div>
      {!passed && (
        <ul style={{margin:0,padding:'8px 10px 8px 26px',color:'var(--text2)',lineHeight:1.5}}>
          {check.violations.map((v,i) => (
            <li key={i}>
              <strong>{v.name}</strong>
              {v.source === 'user' && <span style={{marginLeft:4,fontSize:10,padding:'1px 5px',borderRadius:3,background:'rgba(176,120,32,.15)',color:'#8a5010'}}>your rule</span>}
              : {v.detail}
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

function ReasonTurn({ turn, proposed, fbNonce, onFeedback, onProposalDone, onDiscard }) {
  return (
    <>
      <div className="msg msg-user">
        <div className="msg-bubble"><div className="msg-text">{turn.query}</div></div>
      </div>
      <div className="msg msg-asst">
        <div className="msg-avatar"><BoneSVG size={34}/></div>
        <div className="msg-bubble">
          <div className="msg-text">{parseCit(fixBasis(stripThinking(turn.answer)))}</div>
          {!turn.out_of_scope && turn.physical_check && <PhysicalCheckBadge check={turn.physical_check}/>}
          {!turn.out_of_scope && <ReviewDialogue turn={turn}/>}
          {!turn.out_of_scope && <FeedbackBar key={`fb-${turn.id}-${fbNonce}`} turn={turn} onFeedback={onFeedback}/>}
          {!turn.out_of_scope && proposed && (

              proposal={proposed.proposal}
              correctionId={proposed.correction_id}
              onConfirm={onProposalDone}
              onDismiss={onDiscard}
            />
          )}
        </div>
      </div>
    </>
  );
}

// Shown when correction memory recalled a prior 👎 for a similar image.
function RecalledNote({ hits }) {

      <div style={{fontWeight:500,marginBottom:hits.some(h=>h.feedback_text)?4:0}}>Recalled a past correction for a similar image</div>
      {hits.map((h,i)=> h.feedback_text && (
        <div key={i} style={{opacity:0.95}}>“{h.feedback_text}” <span style={{opacity:0.6}}>({Math.round((h.score||0)*100)}% match)</span></div>
      ))}
