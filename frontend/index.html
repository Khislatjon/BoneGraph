<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BoneMind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<link rel="icon" href="/static/bonemind-icon.svg" type="image/svg+xml">
<script src="/static/react.dev.js"></script>
<script src="/static/react-dom.dev.js"></script>
<script src="/static/babel.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f3f1ec;color:#1c1b18;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
#root{display:flex;height:100vh}
:root{
  --bg:#f3f1ec;--surface:#fff;--surface2:#f8f7f3;
  --border:#e3dfd7;--border2:#ccc8be;
  --text:#1c1b18;--text2:#52514a;--text3:#928f82;
  --amber:#b07820;--amber-light:#fef5e4;--amber-border:#edd590;
  --navy:#1a2540;
  --sans:'DM Sans',system-ui,sans-serif;
  --serif:'DM Serif Display',Georgia,serif;
  --mono:'SF Mono','Fira Code',monospace;
  --radius:10px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 8px rgba(0,0,0,.04);
}

/* Sidebar */
.sidebar{width:236px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.sb-logo{display:flex;align-items:center;gap:11px;padding:20px 16px 18px;border-bottom:1px solid var(--border)}
.sb-logo-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.sb-logo-text{font-family:var(--sans);font-size:19px;letter-spacing:-.01em}
.sb-nav{display:flex;flex-direction:column;padding:10px 8px;gap:2px;flex:1}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;border:none;background:none;cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--text2);text-align:left;width:100%;transition:background .12s,color .12s}
.sb-item:hover{background:var(--surface2);color:var(--text)}
.sb-item.active{background:var(--amber-light);color:var(--amber)}
.sb-item-icon{flex-shrink:0;opacity:.55}
.sb-item.active .sb-item-icon{opacity:1}
.sb-foot{padding:14px 16px;border-top:1px solid var(--border)}
.corpus-badge{font-size:11.5px;color:var(--text3);display:flex;align-items:center;gap:6px}
.corpus-dot{width:6px;height:6px;border-radius:50%;background:#1a7a4e;flex-shrink:0}

/* Main */
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0}
.panel{display:none;flex:1;flex-direction:column;overflow:hidden}
.panel.active{display:flex}
.panel-scroll{display:none;overflow-y:auto;height:100%}
.panel-scroll.active{display:block}
.panel-inner{max-width:940px;margin:0 auto;padding:0 0 40px}

/* Ask tab */
.ask{display:flex;flex-direction:column;flex:1;overflow:hidden}
.chat-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center}
.chat-inner{width:100%;max-width:760px;padding:32px 24px 16px}
.empty-state{max-width:520px;margin:80px auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-avatar{width:100px;height:100px;border-radius:26px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.empty-title{font-family:var(--sans);font-size:24px}
.empty-sub{font-size:14px;color:var(--text3);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--text2);cursor:pointer;font-family:var(--sans);transition:all .15s}
.chip:hover{border-color:var(--amber-border);color:var(--amber);background:var(--amber-light)}
.ex-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:4px;max-width:800px;width:100%}
.chips-label{font-size:13px;color:var(--text3)}
.messages{width:100%;display:flex;flex-direction:column;gap:24px;padding-bottom:16px}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg-user{flex-direction:row-reverse}
.msg-avatar{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.msg-bubble{max-width:85%;display:flex;flex-direction:column}
.msg-user .msg-bubble{background:var(--amber-light);border:1px solid var(--amber-border);border-radius:14px 4px 14px 14px;padding:12px 16px}
.msg-asst .msg-bubble{background:var(--surface);border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:14px 18px;box-shadow:var(--shadow)}
.msg-text{font-size:14.5px;line-height:1.7;white-space:pre-wrap}
.resp-heading{font-weight:700;font-size:14.5px;margin:16px 0 4px;color:var(--text);font-family:var(--sans)}
.ref-link{color:var(--amber);text-decoration:none}
.ref-link:hover{text-decoration:underline}
.cite{color:var(--amber);font-size:.72em;font-weight:600;font-family:var(--mono)}
.blink{color:var(--amber);animation:blink 1s steps(1) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.dots{display:flex;gap:4px;align-items:center;padding:4px 0}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:bounce 1.1s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.18s}
.dots span:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
.chat-bar{display:flex;justify-content:center;padding:14px 24px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.chat-wrap{position:relative;width:100%;max-width:760px;display:flex;align-items:center}
.chat-input{flex:1;height:44px;border:1px solid var(--border);border-radius:10px;padding:0 52px 0 16px;font-family:var(--sans);font-size:14px;background:var(--surface2);color:var(--text);outline:none;transition:border-color .15s}
.chat-input:focus{border-color:var(--amber-border);box-shadow:0 0 0 3px rgba(176,120,32,.1)}
.send-btn{position:absolute;right:6px;width:34px;height:34px;border-radius:8px;background:var(--navy);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.send-btn:hover{background:#253660}
.send-btn:disabled{opacity:.4;cursor:default}
.sources-toggle{margin-top:8px;font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0;font-family:var(--sans);text-decoration:underline}
.sources-toggle:hover{color:var(--amber)}
.sources-list{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.src-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text2)}
.src-rank{font-family:var(--mono);font-size:11px;color:var(--amber);font-weight:600;margin-right:6px}
.src-title{font-weight:600;color:var(--text)}
.src-meta{color:var(--text3);margin-top:2px;font-size:11px}

/* Search tab */
.search-hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:24px 32px 16px;position:sticky;top:0;z-index:50;display:flex;flex-direction:column;align-items:center}
.search-bar{display:flex;align-items:center;max-width:760px;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:0 12px;gap:10px}
.search-bar:focus-within{border-color:var(--amber-border);box-shadow:0 0 0 3px rgba(176,120,32,.1)}
.search-icon{color:var(--text3);flex-shrink:0}
.search-input{flex:1;height:46px;background:none;border:none;outline:none;font-family:var(--sans);font-size:14.5px;color:var(--text)}
.search-input::placeholder{color:var(--text3)}
.search-btn{background:var(--navy);color:#fff;border:none;padding:7px 18px;border-radius:7px;font-family:var(--sans);font-size:13.5px;font-weight:500;cursor:pointer;transition:background .15s}
.search-btn:hover{background:#253660}
.search-btn:disabled{opacity:.4;cursor:default}
.filter-row{display:flex;gap:8px;margin-top:10px;max-width:760px;width:100%}
.filter-btn{font-family:var(--sans);font-size:12.5px;font-weight:500;padding:4px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .12s}
.filter-btn.active,.filter-btn:hover{background:var(--amber-light);border-color:var(--amber-border);color:var(--amber)}
.corpus-note{font-size:12px;color:var(--text3);margin-top:6px}
.range-slider{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--border2);outline:none;cursor:pointer;width:70px}
.range-slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--amber);cursor:pointer;margin-top:-3px;box-shadow:0 0 0 3px var(--amber-light),0 0 0 4px var(--amber-border)}
.range-slider::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--amber);border:none;cursor:pointer;box-shadow:0 0 0 3px var(--amber-light),0 0 0 4px var(--amber-border)}
.search-body{padding:28px 32px;flex:1;display:flex;flex-direction:column;align-items:center}
.loading-row{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--text3);font-size:14px;padding:24px 0;width:100%}
.results-meta{font-size:13px;color:var(--text3);margin-bottom:16px;text-align:center;max-width:800px;width:100%}
.results-list{max-width:800px;width:100%;display:flex;flex-direction:column;gap:14px}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;transition:border-color .15s,box-shadow .15s}
.result-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.result-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.result-title{font-size:15px;font-weight:600;line-height:1.4;flex:1}
.score-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.score-num{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--amber)}
.score-track{width:60px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.score-fill{height:100%;background:var(--amber);border-radius:2px}
.result-byline{font-size:12.5px;color:var(--text3);margin-top:4px}
.result-excerpt{font-size:13.5px;color:var(--text2);line-height:1.6;font-style:italic;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.src-badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-right:6px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.spinner.dark{border:2px solid rgba(0,0,0,.15);border-top-color:var(--text2)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Reason tab */
.reason-tab{display:flex;flex-direction:column;flex:1}
.reason-hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:24px 32px 20px;position:sticky;top:0;z-index:50;display:flex;flex-direction:column;align-items:center}
.reason-desc{font-size:14px;color:var(--text2);line-height:1.65;max-width:760px;width:100%;margin-bottom:14px;text-align:center}
.reason-bar{display:flex;align-items:center;max-width:760px;width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:0 12px;gap:10px}
.reason-bar:focus-within{border-color:var(--amber-border);box-shadow:0 0 0 3px rgba(176,120,32,.1)}
.reason-input{flex:1;height:46px;background:none;border:none;outline:none;font-family:var(--sans);font-size:14.5px;color:var(--text)}
.reason-input::placeholder{color:var(--text3)}
.reason-btn{background:var(--navy);color:#fff;border:none;padding:7px 18px;border-radius:7px;font-family:var(--sans);font-size:13.5px;font-weight:500;cursor:pointer;transition:background .15s;white-space:nowrap}
.reason-btn:hover{background:#253660}
.reason-btn:disabled{opacity:.4;cursor:default}
.reason-body{padding:28px 32px;flex:1;overflow-y:auto}
.reason-results{max-width:900px;display:flex;flex-direction:column;gap:20px}
.results-title{font-size:13px;color:var(--text3)}
.results-title em{color:var(--text2);font-style:normal}
.graph-stats-line{font-size:12px;color:var(--text3);margin-top:4px}
.chain-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.chain-lbl{font-size:11px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.chain-nodes{display:flex;align-items:center;flex-wrap:wrap;gap:0;row-gap:10px}
.chain-node{background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:500;text-align:center;line-height:1.3;max-width:180px}
.chain-arrow{color:var(--amber);flex-shrink:0;display:flex;align-items:center;padding:0 4px}
.chain-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chain-rels{font-size:12px;color:var(--text3)}
.chain-expl{font-size:12px;color:var(--text3)}
.chain-summary{font-size:13px;color:var(--text2);line-height:1.55;border-top:1px solid var(--border);padding-top:12px}
.chain-disclaimer{display:flex;gap:8px;background:#fef5e4;border:1px solid var(--amber-border);border-radius:8px;padding:10px 14px;font-size:12.5px;color:#7a5010;line-height:1.55}
/* physics-driven hypothesis card additions */
.chain-law{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--text3)}
.chain-law-name{font-weight:600;color:var(--text2)}
.chain-law-form{font-family:var(--mono);font-size:12px;color:var(--text2)}
.chain-scenario{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.pred-box{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface2)}
.pred-half{flex:1;min-width:200px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.pred-half + .pred-half{border-left:1px solid var(--border)}
.pred-lbl{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.pred-val{font-family:var(--mono);font-size:13.5px;color:var(--text)}
.pred-val.amber{color:var(--amber);font-weight:600}
.critic-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.critic-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:600;font-size:11.5px;letter-spacing:.04em}
.critic-pill.ok{background:#e8f4ec;color:#1a6b3b;border:1px solid #b7dcc1}
.critic-pill.fail{background:#fdecec;color:#9a1f1f;border:1px solid #f1baba}
.critic-fail-detail{font-size:12px;color:#9a1f1f;line-height:1.5}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:5px;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;border:1px solid transparent;white-space:nowrap}
.badge-legend{display:flex;gap:32px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--border)}
.legend-grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.legend-lbl{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.error-note{font-size:13.5px;color:#b01c1c;padding:12px 0}

/* v2 (equation-graph reasoner) */
.v2-switch{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);margin-bottom:14px}
.v2-switch button{background:transparent;border:none;padding:6px 14px;font-size:12px;color:var(--text3);cursor:pointer;font-family:var(--sans);letter-spacing:.02em;font-weight:500}
.v2-switch button.active{background:var(--text);color:#fff}
.v2-presets{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.v2-preset{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:13px;color:var(--text2);cursor:pointer;text-align:left;font-family:var(--sans);max-width:340px;line-height:1.4}
.v2-preset:hover{border-color:var(--amber);color:var(--text)}
.v2-preset:disabled{opacity:.5;cursor:not-allowed}
.v2-preset-label{font-weight:600;color:var(--text);display:block;margin-bottom:3px}
.v2-preset-desc{font-size:12px;color:var(--text3)}
.v2-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;display:flex;flex-direction:column;gap:16px;max-width:920px}
.v2-card-hdr{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.v2-card-title{font-size:14px;color:var(--text2);font-weight:600}
.v2-meta{font-size:12px;color:var(--text3);font-family:var(--mono)}
.v2-chain-row{display:flex;align-items:center;flex-wrap:wrap;gap:0;row-gap:10px;padding:4px 0}
.v2-var-pill{background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--text)}
.v2-var-pill .v2-var-name{font-weight:400;color:var(--text3);font-size:11.5px;margin-left:4px}
.v2-given-pill{background:#eaf5ec;border-color:#bcdcc4}
.v2-target-pill{background:#fef5e4;border-color:var(--amber-border)}
.v2-step{border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.v2-step-hdr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.v2-step-name{font-weight:600;font-size:13px;color:var(--text)}
.v2-step-citation{font-size:11.5px;color:var(--text3);font-style:italic}
.v2-step-eq{font-size:14px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 14px;overflow-x:auto;line-height:1.4}
.v2-step-eq .katex{font-size:1.05em}
.v2-tex{display:inline-block}
.v2-step-io{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text2);flex-wrap:wrap}
.v2-step-io .v2-io-arrow{color:var(--amber)}
.v2-step-out{font-family:var(--mono);font-size:13px;color:var(--text);font-weight:600}
.v2-step-band{font-family:var(--mono);font-size:11.5px;color:var(--text3);margin-left:6px}
.v2-final{margin-top:6px;padding:16px 18px;background:#fef5e4;border:1px solid var(--amber-border);border-radius:10px;display:flex;flex-direction:column;gap:6px}
.v2-final-lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#7a5010}
.v2-final-val{font-family:var(--mono);font-size:22px;font-weight:600;color:#5a3a06}
.v2-final-band{font-family:var(--mono);font-size:12.5px;color:#7a5010}
.v2-citations{display:flex;flex-direction:column;gap:4px;padding-top:6px;border-top:1px solid var(--border);font-size:12px;color:var(--text3)}
.v2-citation-row{display:flex;gap:8px}
.v2-citation-row::before{content:"›";color:var(--amber);font-weight:600}
.v2-error{color:#b01c1c;font-size:13px;padding:12px 14px;background:#fdecec;border:1px solid #f1baba;border-radius:8px}
.v2-experimental-tag{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);background:#fef5e4;border:1px solid var(--amber-border);border-radius:4px;padding:1px 7px;margin-left:8px}

/* v2 active exploration (Surprises panel — Phase 5) */
.v2-surprises{display:flex;flex-direction:column;gap:14px;max-width:920px;width:100%;margin-top:8px}
.v2-surprises-hdr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--border)}
.v2-surprises-title{font-size:14px;font-weight:600;color:var(--text)}
.v2-surprises-blurb{font-size:12px;color:var(--text3);max-width:620px;line-height:1.5}
.v2-surprises-actions{display:flex;align-items:center;gap:8px}

<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#928f82">Loading BoneMind…</div></div>

<script type="text/babel">
const { useState, useEffect, useRef, Fragment } = React;

// ── Bone SVG ──────────────────────────────────────────────────────────────────
function BoneSVG({ size = 28 }) {
  return (
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width={size} height={size}>
      <rect width="100" height="100" rx="18" fill="#0f1724"/>
      <rect x="28" y="16" width="14" height="68" fill="#f3e8c8"/>
      <circle cx="28" cy="16" r="8" fill="#f3e8c8"/>
      <circle cx="42" cy="16" r="8" fill="#f3e8c8"/>
      <circle cx="28" cy="84" r="8" fill="#f3e8c8"/>
      <circle cx="42" cy="84" r="8" fill="#f3e8c8"/>
      <path d="M42 24 Q77 24 77 41 Q77 50 44 50" fill="none" stroke="#f3e8c8" strokeWidth="7" strokeLinecap="round"/>
      <path d="M42 50 Q77 50 77 67 Q77 76 44 76" fill="none" stroke="#f3e8c8" strokeWidth="7" strokeLinecap="round"/>
    </svg>
  );
}

// ── Badge ─────────────────────────────────────────────────────────────────────
const VALIDITY_STYLES = {
  PLAUSIBLE:   { bg:'#eaf5ee', color:'#1a7a4e', border:'#a8d8b8' },
  IMPLAUSIBLE: { bg:'#fdeaea', color:'#b01c1c', border:'#f0a8a8' },
};
const NOVELTY_STYLES = {
  GROUNDED:    { bg:'#f0f2f5', color:'#4a5a6a', border:'#c8d0da' },
  SPECULATIVE: { bg:'#fef0e0', color:'#c05a10', border:'#f0c898' },
  NOVEL:       { bg:'#f3edfb', color:'#6b3fb0', border:'#c8a8e8' },
  UNCERTAIN:   { bg:'#fef5e4', color:'#a07010', border:'#f0d48a' },
};
const NOVELTY_DISPLAY = {
  GROUNDED:'Grounded', SPECULATIVE:'Speculative',
  NOVEL:'Novel', UNCERTAIN:'Uncertain',
};
function Badge({ label, map, display }) {
  const s = map[label] || { bg:'#f8f7f3', color:'#52514a', border:'#ccc8be' };
  return <span className="badge" style={{background:s.bg,color:s.color,borderColor:s.border}}>{display||label}</span>;
}

// ── Dots / Spinner ────────────────────────────────────────────────────────────
const Dots = () => <div className="dots"><span/><span/><span/></div>;
const Spinner = ({ dark }) => <span className={`spinner${dark?' dark':''}`}/>;

// ── Arrow SVG ─────────────────────────────────────────────────────────────────
const ChainArrow = () => (
  <div className="chain-arrow">
    <svg width="32" height="16" viewBox="0 0 32 16" fill="none">
      <line x1="0" y1="8" x2="26" y2="8" stroke="currentColor" strokeWidth="1.8"/>
      <path d="M24 4l6 4-6 4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  </div>
);

// Strip the model's "Thinking" preamble — show only from "Final Response" onward.
function stripThinking(text) {
  const marker = /final response\s*/i;
  const idx = text.search(marker);
  if (idx === -1) return text;
  return text.slice(idx).replace(marker, '').trimStart();
}

// ── Inline citations renderer ─────────────────────────────────────────────────
function parseCit(text) {
  const lines = text.split('\n');
  const result = [];
  lines.forEach((line, li) => {
    const headingMatch = line.match(/^##\s+(.+)$/);
    if (headingMatch) {
      result.push(<div key={`h${li}`} className="resp-heading">{headingMatch[1]}</div>);
      return;
    }
    const parts = line.split(/(\[\d+\]|\[[^\]]+\]\(https?:\/\/[^)]+\))/g);
    parts.forEach((p, i) => {
      const citM = p.match(/^\[(\d+)\]$/);
      const linkM = p.match(/^\[([^\]]+)\]\((https?:\/\/[^)]+)\)$/);
      if (citM) result.push(<sup key={`${li}-${i}`} className="cite">[{citM[1]}]</sup>);
      else if (linkM) result.push(<a key={`${li}-${i}`} href={linkM[2]} target="_blank" rel="noopener noreferrer" className="ref-link">{linkM[1]}</a>);
      else result.push(p);
    });
    if (li < lines.length - 1) result.push('\n');
  });
  return result;
}

// ── Sources panel (Ask tab) ───────────────────────────────────────────────────
function Sources({ results }) {
  const [open, setOpen] = useState(false);
  if (!results || !results.length) return null;
  return (
    <div>
      <button className="sources-toggle" onClick={() => setOpen(o => !o)}>
        {open ? 'Hide' : 'Show'} {results.length} source{results.length !== 1 ? 's' : ''}
      </button>
      {open && (
        <div className="sources-list">
          {results.map((r, i) => (
            <div key={i} className="src-item">
              <span className="src-rank">[{r.rank}] {r.score?.toFixed(3)}</span>
              <span className="src-title">{r.title}</span>
              {(r.authors || r.year) && (
                <div className="src-meta">{[r.authors, r.year, r.venue].filter(Boolean).join(' · ')}</div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Context ring ──────────────────────────────────────────────────────────────
function CtxRing({ usage }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  const pct = Math.min(100, Math.round((usage.prompt / usage.ctx) * 100));
  const color = pct >= 90 ? '#c0392b' : pct >= 75 ? '#8a5010' : 'var(--amber)';
  const r = 9, circ = 2 * Math.PI * r, dash = circ * (pct / 100);

  useEffect(() => {
    if (!open) return;
    const close = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [open]);

  return (
    <div ref={ref} style={{position:'relative',display:'inline-flex'}}>
      <button onClick={() => setOpen(o => !o)}
        title={`Context: ~${usage.prompt.toLocaleString()} / ${usage.ctx.toLocaleString()} tokens (${pct}%)`}
        style={{background:'none',border:'none',cursor:'pointer',padding:4,display:'flex',alignItems:'center',justifyContent:'center',borderRadius:6}}>
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r={r} stroke="var(--border2)" strokeWidth="2.5"/>
          <circle cx="12" cy="12" r={r} stroke={color} strokeWidth="2.5"
            strokeDasharray={`${dash} ${circ - dash}`} strokeLinecap="round"
            transform="rotate(-90 12 12)"/>
        </svg>
      </button>
      {open && (
        <div style={{position:'absolute',bottom:'calc(100% + 8px)',left:0,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:'12px 14px',minWidth:215,boxShadow:'0 4px 20px rgba(0,0,0,.1)',zIndex:200}}>
          <div style={{fontFamily:'var(--sans)',fontWeight:600,fontSize:13,color:'var(--text)',marginBottom:10}}>Context window</div>
          <div style={{display:'flex',flexDirection:'column',gap:5,fontFamily:'var(--mono)',fontSize:12,color:'var(--text2)'}}>
            <div style={{display:'flex',justifyContent:'space-between',gap:16}}>
              <span>Used</span><span style={{color,fontWeight:500}}>~{usage.prompt.toLocaleString()} tokens</span>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',gap:16}}>
              <span>Limit</span><span style={{color:'var(--text)'}}>{usage.ctx.toLocaleString()} tokens</span>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',gap:16}}>
              <span>Remaining</span><span style={{color:'var(--text)'}}>{Math.max(0, usage.ctx - usage.prompt).toLocaleString()} tokens</span>
            </div>
          </div>
          <div style={{marginTop:10,height:3,background:'var(--border)',borderRadius:2,overflow:'hidden'}}>
            <div style={{height:'100%',width:`${pct}%`,background:color,borderRadius:2}}/>
          </div>
          <div style={{marginTop:5,textAlign:'right',fontFamily:'var(--mono)',fontSize:11,color:'var(--text3)'}}>
            {pct}% used{usage.estimated ? ' · estimated' : ''}
          </div>
        </div>
      )}
    </div>
  );
}

// ── ASK TAB ───────────────────────────────────────────────────────────────────
function AskTab({ totalChunks }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput]       = useState('');
  const [loading, setLoading]   = useState(false);
  const [streaming, setStreaming] = useState('');
  const [liveSource, setLiveSource] = useState(null);
  const [usage, setUsage]       = useState(null); // {prompt, completion, ctx}
  const endRef      = useRef(null);
  const inputRef    = useRef(null);
  const chatAreaRef = useRef(null);
  const autoScroll  = useRef(true);

  // onWheel fires before the browser processes the scroll — preemptively disable
  const handleWheel = () => { autoScroll.current = false; };
  const handleTouchStart = () => { autoScroll.current = false; };

  // Re-enable only when the user scrolls back to the very bottom
  const handleChatScroll = () => {
    const el = chatAreaRef.current;
    if (!el) return;
    if (el.scrollHeight - el.scrollTop - el.clientHeight < 60) {
      autoScroll.current = true;
    }
  };

  // Scroll on new completed messages (user just sent something)
  useEffect(() => {
    if (autoScroll.current && endRef.current) {
      endRef.current.scrollIntoView({ behavior: 'smooth' });
    }
  }, [messages]);

  // During streaming, scroll instantly only if auto-scroll is still enabled
  useEffect(() => {
    if (streaming && autoScroll.current && endRef.current) {
      endRef.current.scrollIntoView({ behavior: 'instant' });
    }
  }, [streaming]);

  const CHIPS = [
    'What drives cortical porosity in aging bone?',
    'How does trabecular architecture affect fracture toughness?',
    'Explain the role of osteocytes in mechanosensing',
  ];

  const send = async (text) => {
    const t = text.trim();
    if (!t || loading) return;
    autoScroll.current = true;
    // Capture history before adding the new user turn.
    // For assistant turns: strip the thinking block and ## References section —
    // the LLM only needs the answer body to resolve pronouns across turns.
    // Sliding window: last 6 messages (3 pairs) keeps history bounded.
    const history = messages.slice(-6).map(m => {
      if (m.role !== 'assistant') return { role: m.role, content: m.content };
      let content = m.content;
      const thinkIdx = content.search(/final response\s*/i);
      if (thinkIdx !== -1) content = content.slice(thinkIdx).replace(/final response\s*/i, '').trimStart();
      const refIdx = content.search(/\n\n## References/i);
      if (refIdx !== -1) content = content.slice(0, refIdx).trim();
      return { role: m.role, content };
    });
    // All prior user questions (no window cap) — used only by the topic guard
    // so it can resolve pronouns even when early turns fall outside the LLM window.
    const allQuestions = messages
      .filter(m => m.role === 'user')
      .map(m => m.content);
    setMessages(prev => [...prev, { role:'user', content:t }]);
    setInput('');
    setLoading(true);
    setStreaming('');
    setLiveSource(null);
    let finalAnswer = '';
    let sources = null;
    try {
      const fd = new FormData();
      fd.append('question', t);
      fd.append('top_k', '8');
      fd.append('history', JSON.stringify(history));
      fd.append('all_questions', JSON.stringify(allQuestions));
      const resp = await fetch('/api/ask', { method:'POST', body:fd });
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream:true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const ev = JSON.parse(line.slice(6));
          if (ev.type === 'sources') { sources = ev.results; setLiveSource(ev.results); }
          else if (ev.type === 'token') { finalAnswer += ev.content; setStreaming(finalAnswer); }
          else if (ev.type === 'done')  {
            finalAnswer = ev.answer;
            if (typeof ev.prompt_tokens === 'number') {
              setUsage({ prompt: ev.prompt_tokens, completion: ev.completion_tokens, ctx: ev.context_window || 8192, estimated: true });
            }
          }
          else if (ev.type === 'error') { finalAnswer = '⚠️ ' + ev.message; }
        }
      }
    } catch(e) { finalAnswer = '⚠️ Error: ' + e.message; }
    setStreaming('');
    setLiveSource(null);
    setMessages(prev => [...prev, { role:'assistant', content:finalAnswer, sources }]);
    setLoading(false);
    inputRef.current?.focus();
  };

  const empty = messages.length === 0 && !loading;
  return (
    <div className="ask">
      <div className="chat-area" ref={chatAreaRef} onScroll={handleChatScroll} onWheel={handleWheel} onTouchStart={handleTouchStart}>
        <div className="chat-inner">
          {empty ? (
            <div className="empty-state">
              <div className="empty-avatar"><BoneSVG size={100}/></div>
              <div className="empty-title">Ask BoneMind</div>
              <div className="empty-sub">Grounded in {totalChunks ? totalChunks.toLocaleString() : '248,629'} indexed papers and textbooks</div>
              <div className="chips">
                {CHIPS.map((s,i) => <button key={i} className="chip" onClick={() => send(s)}>{s}</button>)}
              </div>
            </div>
          ) : (
            <div className="messages">
              {messages.map((m,i) => (
                <div key={i} className={`msg ${m.role === 'user' ? 'msg-user' : 'msg-asst'}`}>
                  {m.role === 'assistant' && <div className="msg-avatar"><BoneSVG size={34}/></div>}
                  <div className="msg-bubble">
                    <div className="msg-text">{m.role === 'assistant' ? parseCit(stripThinking(m.content)) : m.content}</div>
                    {m.role === 'assistant' && <Sources results={m.sources}/>}
                  </div>
                </div>
              ))}
              {(streaming || (loading && !streaming)) && (
                <div className="msg msg-asst">
                  <div className="msg-avatar"><BoneSVG size={34}/></div>
                  <div className="msg-bubble">
                    <div className="msg-text">
                      {streaming
                        ? /final response/i.test(streaming)
                          ? <>{parseCit(stripThinking(streaming))}<span className="blink">▍</span></>
                          : <Dots/>
                        : <Dots/>}
                    </div>
                    {liveSource && <Sources results={liveSource}/>}
                  </div>
                </div>
              )}
              <div ref={endRef}/>
            </div>
          )}
        </div>
      </div>
      <div className="chat-bar">
        <div style={{width:'100%',maxWidth:760,display:'flex',alignItems:'center',gap:6}}>
          {usage && <CtxRing usage={usage}/>}
          <div className="chat-wrap" style={{maxWidth:'none',flex:1}}>
            <input ref={inputRef} className="chat-input" placeholder="Ask a question about bone science…"
            value={input} onChange={e => setInput(e.target.value)}
            onKeyDown={e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(input); } }}
            disabled={loading}/>
          <button className="send-btn" onClick={() => send(input)} disabled={loading || !input.trim()}>
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M3 9h12M10 4l5 5-5 5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── SEARCH TAB ────────────────────────────────────────────────────────────────
function SearchTab({ totalChunks }) {
  const [query, setQuery]     = useState('');
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [searched, setSearched] = useState(false);
  const [current, setCurrent] = useState('');
  const [elapsed, setElapsed] = useState(0);
  const [filter, setFilter]   = useState('All');
  const [topK, setTopK]       = useState(10);
  const [yearMin, setYearMin] = useState(1970);
  const [yearMax, setYearMax] = useState(2026);

  const EXAMPLES = ['trabecular microstructure','bone mineral density osteoporosis','collagen crosslink mechanics','stress fracture fatigue crack','osteosarcoma bone metastasis','bone scaffold tissue engineering'];
  const FILTERS  = ['All','Papers only','Textbooks only'];

  const highlightTerms = (text, q) => {
    if (!q) return text;
    const words = q.trim().split(/\s+/).filter(w => w.length > 2);
    if (!words.length) return text;
    const safe = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const pattern = new RegExp(`(${words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')})`, 'gi');
    return safe.replace(pattern, '<mark style="background:#fef3c7;border-radius:2px;padding:0 1px;color:inherit">$1</mark>');
  };

  const doSearch = async (q, f, k, yMin, yMax) => {
    const term = (q || query).trim();
    const sf   = f || filter;
    const tk   = k ?? topK;
    const ym   = yMin ?? yearMin;
    const yx   = yMax ?? yearMax;
    if (!term || loading) return;
    setQuery(term); setLoading(true); setSearched(true); setCurrent(term); setResults([]);
    try {
      const fd = new FormData();
      fd.append('query', term); fd.append('top_k', String(tk)); fd.append('source_filter', sf);
      fd.append('year_min', String(ym)); fd.append('year_max', String(yx));
      const r = await fetch('/api/search', { method:'POST', body:fd });
      const d = await r.json();
      setResults(d.results || []); setElapsed(d.elapsed_ms || 0);
    } catch { setResults([]); }
    setLoading(false);
  };

  return (
    <div style={{display:'flex',flexDirection:'column',flex:1}}>
      <div className="search-hdr">
        <div style={{fontFamily:'var(--sans)',fontSize:24,marginBottom:16,color:'var(--text)',textAlign:'center'}}>Search BoneScholar</div>
        <div className="search-bar">
          <svg className="search-icon" width="17" height="17" viewBox="0 0 17 17" fill="none">
            <circle cx="7.5" cy="7.5" r="5" stroke="currentColor" strokeWidth="1.7"/>
            <path d="M11.5 11.5l3.5 3.5" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/>
          </svg>
          <input className="search-input"
            placeholder={`Search ${totalChunks ? totalChunks.toLocaleString() : '248,629'} paper and textbook embeddings…`}
            value={query} onChange={e => setQuery(e.target.value)}
            onKeyDown={e => e.key==='Enter' && doSearch(query)}/>
          <button className="search-btn" onClick={() => doSearch(query)} disabled={loading || !query.trim()}>
            {loading ? <Spinner/> : 'Search'}
          </button>
        </div>
        <div className="filter-row" style={{flexWrap:'wrap',gap:8}}>
          {FILTERS.map(f => (
            <button key={f} className={`filter-btn ${filter===f?'active':''}`}
              onClick={() => { setFilter(f); if (searched) doSearch(query, f); }}>{f}</button>
          ))}
          <div style={{display:'flex',alignItems:'center',gap:16,marginLeft:8,flexWrap:'wrap'}}>
            <label style={{fontSize:12,color:'var(--text3)',display:'flex',alignItems:'center',gap:6,whiteSpace:'nowrap'}}>
              Results
              <input type="range" min="5" max="40" step="5" value={topK}
                className="range-slider"
                onChange={e => { const v=Number(e.target.value); setTopK(v); if(searched) doSearch(query, filter, v); }}
                style={{background:`linear-gradient(to right,#b07820 0%,#b07820 ${(topK-5)/35*100}%,#e5e7eb ${(topK-5)/35*100}%,#e5e7eb 100%)`}}/>
              <span style={{fontWeight:600,color:'var(--text)',minWidth:20}}>{topK}</span>
            </label>
            <label style={{fontSize:12,color:'var(--text3)',display:'flex',alignItems:'center',gap:6,whiteSpace:'nowrap'}}>
              From
              <input type="range" min="1970" max="2026" step="1" value={yearMin}
                className="range-slider"
                onChange={e => { const v=Math.min(Number(e.target.value),yearMax); setYearMin(v); if(searched) doSearch(query,filter,topK,v,yearMax); }}
                style={{background:`linear-gradient(to right,#b07820 0%,#b07820 ${(yearMin-1970)/56*100}%,#e5e7eb ${(yearMin-1970)/56*100}%,#e5e7eb 100%)`}}/>
              <span style={{fontWeight:600,color:'var(--text)',minWidth:32}}>{yearMin}</span>
            </label>
            <label style={{fontSize:12,color:'var(--text3)',display:'flex',alignItems:'center',gap:6,whiteSpace:'nowrap'}}>
              To
              <input type="range" min="1970" max="2026" step="1" value={yearMax}
                className="range-slider"
                onChange={e => { const v=Math.max(Number(e.target.value),yearMin); setYearMax(v); if(searched) doSearch(query,filter,topK,yearMin,v); }}
                style={{background:`linear-gradient(to right,#b07820 0%,#b07820 ${(yearMax-1970)/56*100}%,#e5e7eb ${(yearMax-1970)/56*100}%,#e5e7eb 100%)`}}/>
              <span style={{fontWeight:600,color:'var(--text)',minWidth:32}}>{yearMax}</span>
            </label>
          </div>
        </div>
      </div>
      <div className="search-body">
        {!searched && (
          <div>
            <p style={{fontSize:14,color:'var(--text2)',marginBottom:16,lineHeight:1.65,textAlign:'center',maxWidth:800,width:'100%'}}>BoneScholar - a bone science dataset of 54,634 papers and 16 textbooks. Results are ranked by semantic relevance.</p>
            <div className="ex-chips">
              <span className="chips-label">Try:</span>
              {EXAMPLES.map((ex,i) => <button key={i} className="chip" onClick={() => doSearch(ex)}>{ex}</button>)}
            </div>
          </div>
        )}
        {loading && <div className="loading-row"><Dots/><span>Searching BoneScholar…</span></div>}
        {!loading && searched && results.length > 0 && (() => {
          return (
            <>
              <div className="results-meta"><strong>{results.length} results</strong> for "{current}" · {elapsed}ms</div>
              <div className="results-list">
                {results.map((r,i) => {
                  const tb = r.source_type === 'textbook';
                  const chunkPos = r.total_chunks ? `embedding ${r.chunk_index + 1} of ${r.total_chunks}` : null;
                  return (
                    <div key={i} className="result-card">
                      <div className="result-top">
                        <div className="result-title">
                          [{r.rank}] {r.title}
                          {r.doi && (
                            <a href={`https://doi.org/${r.doi}`} target="_blank" rel="noopener"
                              style={{marginLeft:'8px',fontSize:'11px',fontWeight:500,color:'#b07820',
                                textDecoration:'none',borderBottom:'1px solid #b07820',whiteSpace:'nowrap'}}>
                              Open ↗
                            </a>
                          )}
                        </div>
                        <div className="score-wrap">
                          <span className="score-num">{r.score.toFixed(3)}</span>
                          <div className="score-track"><div className="score-fill" style={{width:`${r.score*100}%`}}/></div>
                        </div>
                      </div>
                      <div className="result-byline">
                        <span className="src-badge" style={{background:tb?'#eaf5ee':'#e8ecf4',color:tb?'#1a7a4e':'#1a2540'}}>
                          {tb ? '📚 Textbook' : '📄 Paper'}
                        </span>
                        {[r.authors, r.year, r.venue].filter(Boolean).join(' · ')}
                        {r.page_number ? ` · p.${r.page_number}` : ''}
                        {chunkPos && <span style={{marginLeft:6,color:'var(--text3)'}}>· {chunkPos}</span>}
                      </div>
                      {r.excerpt && (
                        <div className="result-excerpt"
                          dangerouslySetInnerHTML={{__html: '"' + highlightTerms(r.excerpt, current) + '"'}}/>
                      )}
                    </div>
                  );
                })}
              </div>
            </>
          );
        })()}
        {!loading && searched && results.length === 0 && <div className="loading-row">No results. Try a different query.</div>}
      </div>
    </div>
  );
}

// Format a number for v2 result display.  Uses scientific notation
// for very small or very large magnitudes; plain decimals otherwise.
function v2Fmt(x, sig=3) {
  if (x === null || x === undefined || Number.isNaN(x)) return '—';
  const ax = Math.abs(x);
  if (ax !== 0 && (ax < 1e-3 || ax >= 1e4)) return x.toExponential(2);
  return Number(x.toPrecision(sig)).toString();
}

// Render a Variable's Unicode form (display_symbol) with a graceful
// fallback to the ASCII symbol if the payload predates Phase-5b.
function dsym(v) {
  return (v && (v.display_symbol || v.symbol)) || '';
}

// KaTeX-rendered math.  Renders `tex` into a span using window.katex
// once it has loaded.  If katex is not (yet) available, we fall back
// to the raw LaTeX so the user still sees something — but we re-try
// briefly so first-paint of the v2 tab does not lose the equation.
function TeX({tex, displayMode=false}) {
  const ref = useRef(null);
  useEffect(() => {
    let cancelled = false;
    const render = () => {
      if (cancelled) return false;
      const node = ref.current;
      if (!node) return false;
      if (typeof window.katex === 'undefined') return false;
      try {
        window.katex.render(tex || '', node, {
          throwOnError: false,
          displayMode,
          output: 'html',
        });
      } catch (e) {
        node.textContent = tex || '';
      }
      return true;
    };
    if (!render()) {
      // KaTeX still loading — poll every 80 ms for up to 2 s.
      const start = Date.now();
      const id = setInterval(() => {
        if (render() || Date.now() - start > 2000) clearInterval(id);
      }, 80);
      return () => { cancelled = true; clearInterval(id); };
    }
  }, [tex, displayMode]);
  // Initial render: show plain text until katex paints.
  return <span ref={ref} className="v2-tex">{tex}</span>;
}

        <div className="v2-cov-lbl">Age</div>
        <div className="v2-cov-age">
          <input type="range" min="18" max="95" step="1" value={c.age}
            className="range-slider v2-cov-age-slider"
            style={(() => {
              const pct = ((c.age - 18) / (95 - 18)) * 100;
              return {background: `linear-gradient(to right, var(--amber) 0%, var(--amber) ${pct}%, var(--border2) ${pct}%, var(--border2) 100%)`};
            })()}
            onChange={e => update({age: Number(e.target.value)})}/>
          <span className="v2-cov-age-val">{c.age} yr</span>
        </div>
      </div>
      <div className="v2-cov-row">
        <div className="v2-cov-lbl">Sex</div>
        <div className="v2-cov-sex">
          <button className={c.sex === 'M' ? 'active' : ''} onClick={() => update({sex: 'M'})}>Male</button>
          <button className={c.sex === 'F' ? 'active' : ''} onClick={() => update({sex: 'F'})}>Female</button>
        </div>
      </div>
      <div className="v2-cov-row">
        <div className="v2-cov-lbl">Site</div>
        <select className="v2-cov-site" value={c.site} onChange={e => update({site: e.target.value})}>
          {V2_SITES.map(s => <option key={s.value} value={s.value}>{s.label}</option>)}
        </select>
      </div>
      <div className="v2-cov-row">
        <div className="v2-cov-lbl">Disease</div>
        <div className="v2-cov-diseases">
          {V2_DISEASES.map(d => {
            const on = (c.disease || []).includes(d.value);
            return (
              <label key={d.value} className={`v2-cov-disease ${on ? 'active' : ''}`}>
                <input type="checkbox" checked={on} onChange={() => toggleDisease(d.value)}/>
                {d.label}
              </label>
