// Shown when the trained region classifier grounded the VLM (the hybrid — a
// MURA-trained head over BiomedCLIP features; see docs/vision/training.md).
function ClassifierBadge({ pred }) {
  if (!pred) return null;
  // Out-of-scope: the image doesn't resemble the head's training data, so its
  // label is unreliable and was NOT used to ground the VLM. Show a caution.
  if (pred.in_scope === false) {
    return (
      <div style={{marginBottom:10,padding:'8px 11px',border:'1px solid #d4d4d8',background:'#f4f4f5',borderRadius:8,fontSize:12.5,color:'#555'}}>
        <div style={{fontWeight:500}}>Trained classifier: prediction withheld</div>
        <div style={{opacity:0.85,marginTop:2}}>This image doesn't resemble the model's training data (upper-limb X-rays), so its region guess isn't reliable here and wasn't used.</div>
      </div>
    );
  }
  const pct = Math.round((pred.confidence || 0) * 100);
  const rest = (pred.topk || []).slice(1, 3);
  return (
    <div style={{marginBottom:10,padding:'8px 11px',border:'1px solid #a9c7e8',background:'#eef4fb',borderRadius:8,fontSize:12.5,color:'#24557f'}}>
      <div style={{fontWeight:500}}>Trained classifier: {pred.label} <span style={{opacity:0.7}}>· {pct}%</span></div>
      {rest.length > 0 && (
        <div style={{opacity:0.75,marginTop:2}}>also considered {rest.map(t=>`${t[0]} (${Math.round(t[1]*100)}%)`).join(', ')}</div>
      )}
      <div style={{opacity:0.6,marginTop:3,fontSize:11.5}}>MURA-trained · upper-limb X-ray regions only</div>
    </div>
  );
}

// Feedback for a vision turn. 👍 logs an event; 👎 + text stores an
// image-keyed correction (the image is re-sent so the backend can embed it).
function VisionFeedbackBar({ turn, imageFile }) {
  const [polarity, setPolarity] = useState(null);
  const [showInput, setShowInput] = useState(false);
  const [text, setText] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState('');

  const sendUp = async () => {
    if (polarity) return;
    setPolarity(1);
    try {
      const fd = new FormData();
      fd.append('turn_id', turn.id); fd.append('polarity', '1');
      await apiFetch('/api/vision/feedback', { method:'POST', body: fd });
    } catch(e) { setError(e.message); setPolarity(null); }
  };

  const submitDown = async () => {
    if (!text.trim()) { setError('Please describe the correction.'); return; }
    setSubmitting(true); setError('');
    try {
      const fd = new FormData();
      fd.append('turn_id', turn.id);
      fd.append('polarity', '-1');
      fd.append('prompt', turn.query || '');
      fd.append('identification', turn.ident?.identification || '');
      fd.append('feedback_text', text.trim());
      if (imageFile) fd.append('image', imageFile);
      const resp = await apiFetch('/api/vision/feedback', { method:'POST', body: fd });
      const data = await resp.json();
      if (!data.ok) throw new Error(data.error || 'Could not save correction');
      setPolarity(-1); setShowInput(false);
    } catch(e) { setError(e.message); }
    finally { setSubmitting(false); }
  };

  const btn = (selected, color) => ({
    background: selected ? color : 'transparent',
    color: selected ? '#fff' : 'var(--text2)',
    border: '1px solid var(--border)', borderRadius: 6, padding: '3px 9px',
    fontSize: 13, cursor: polarity ? 'default' : 'pointer',
    opacity: polarity && !selected ? 0.4 : 1,
  });

  return (
    <div style={{marginTop:10}}>
      <div style={{display:'flex',gap:6,alignItems:'center'}}>
        <button style={btn(polarity===1,'#2e7d32')} onClick={sendUp} disabled={!!polarity}>👍</button>
        <button style={btn(polarity===-1,'#b02020')} onClick={()=>!polarity && setShowInput(true)} disabled={!!polarity}>👎</button>
        {polarity === -1 && !showInput && <span style={{fontSize:12,color:'var(--text3)'}}>correction saved — I'll remember this next time</span>}
        {polarity === 1 && <span style={{fontSize:12,color:'var(--text3)'}}>thanks</span>}
        {error && <span style={{fontSize:12,color:'#b02020'}}>{error}</span>}
      </div>
      {showInput && (
        <div style={{marginTop:8,display:'flex',flexDirection:'column',gap:6}}>
          <textarea value={text} onChange={e=>setText(e.target.value)}
            placeholder="What was wrong? Be specific — e.g. 'this is trabecular bone, not cortical'."
            style={{minHeight:60,padding:8,border:'1px solid var(--border)',borderRadius:6,fontFamily:'var(--sans)',fontSize:13,resize:'vertical',background:'var(--surface2)',color:'var(--text)'}}/>
          <div style={{display:'flex',gap:6}}>
            <button onClick={submitDown} disabled={submitting}
              style={{background:'var(--navy)',color:'#fff',border:'none',padding:'6px 14px',borderRadius:6,fontSize:13,cursor:'pointer'}}>
              {submitting ? 'Saving…' : 'Save correction'}
            </button>
            <button onClick={()=>{setShowInput(false);setText('');setError('');}} disabled={submitting}
              style={{background:'transparent',color:'var(--text2)',border:'1px solid var(--border)',padding:'6px 14px',borderRadius:6,fontSize:13,cursor:'pointer'}}>
              Cancel
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── ANALYSE TAB ───────────────────────────────────────────────────────────────
function VisionTab() {
  // Multi-turn chat about ONE uploaded image. The image is re-sent on every
  // turn (the backend re-encodes it); prior turns are replayed as text history
  // so follow-ups have context. Mirrors ReasonTab's chat loop.
  const [messages, setMessages] = useState([]);   // {role, text?, imgURL?, ident?, error?}
  const [imageFile, setImageFile] = useState(null);
  const [imageURL, setImageURL]   = useState(null);
  const [input, setInput]   = useState('');
  const [busy, setBusy]     = useState(false);
  const [drag, setDrag]     = useState(false);
  const [usage, setUsage]   = useState(null); // {prompt, completion, ctx}
  const [corrOpen, setCorrOpen] = useState(false); // "Past corrections" panel
  const fileRef = useRef(null);
  const addRef  = useRef(null);
  const endRef  = useRef(null);

  useEffect(() => { if (endRef.current) endRef.current.scrollIntoView({ behavior:'smooth' }); }, [messages, busy]);

  // One image per chat. Picking an image starts a fresh conversation.
  const startChat = (f) => {
    if (!f || !f.type.startsWith('image/')) return;
    setMessages([]); setInput(''); setUsage(null);
    setImageFile(f); setImageURL(URL.createObjectURL(f));
  };

  const ConfBadge = ({ level }) => {
    const m = { HIGH:{bg:'#eaf5ee',color:'#1a7a4e',border:'#a8d8b8'}, MODERATE:{bg:'#fef5e4',color:'#a07010',border:'#f0d48a'}, LOW:{bg:'#fdeaea',color:'#b01c1c',border:'#f0a8a8'} };
    const s = m[level] || m.MODERATE;
    return <span className="badge" style={{display:'inline-block',padding:'2px 9px',borderRadius:7,border:`1px solid ${s.border}`,background:s.bg,color:s.color,fontSize:11.5,fontWeight:500,whiteSpace:'nowrap'}}>Confidence: {level}</span>;
  };

  const IdentCard = ({ ident }) => (
    <div className="id-card">
      <div className="id-head">
        <span className="id-name">{ident.identification}</span>
        {ident.confidence && <ConfBadge level={ident.confidence}/>}
      </div>
      <div className="id-rows">
        {[['Tissue type',ident.tissue_type],['Modality',ident.modality],['Morphology',ident.morphology],['Estimated scale',ident.estimated_scale],['Also considered',ident.runner_up]].map(([k,v]) => v && (
          <div key={k} className="id-row"><div className="id-k">{k}</div><div>{v}</div></div>
        ))}
        {ident.features?.length > 0 && (
          <div className="id-row"><div className="id-k">Features</div>
            <ul className="id-feats">{ident.features.map((f,i)=><li key={i}>{f}</li>)}</ul></div>
        )}
      </div>
    </div>
  );

  const patchLastAsst = (patch) => setMessages(prev => {
    const copy = [...prev];
    for (let i = copy.length-1; i>=0; i--) { if (copy[i].role==='assistant') { copy[i] = {...copy[i], ...patch}; break; } }
    return copy;
  });
  const appendLastAnswer = (chunk) => setMessages(prev => {
    const copy = [...prev];
    for (let i = copy.length-1; i>=0; i--) { if (copy[i].role==='assistant') { copy[i] = {...copy[i], answer:(copy[i].answer||'')+chunk}; break; } }
    return copy;
  });

  // First turn = no assistant reply yet (identify); afterwards we chat (prose).
  const firstTurn = !messages.some(m => m.role === 'assistant');

  const send = async () => {
    if (busy || !imageFile) return;
    const text = input.trim();
    if (!firstTurn && !text) return;   // follow-ups need a question

    // History from completed turns — text only (the image is re-sent each call).
    const history = [];
    for (const m of messages) {
      if (m.role === 'user' && m.text) history.push({ role:'user', content:m.text });
      else if (m.role === 'assistant' && m.ident) {
        const i = m.ident;
        history.push({ role:'assistant', content:`Identification: ${i.identification} (modality: ${i.modality}; confidence: ${i.confidence}). ${i.morphology||''}`.trim() });
      }
      else if (m.role === 'assistant' && m.answer) history.push({ role:'assistant', content:m.answer });
    }

    const wasFollowup = !firstTurn;   // first turn identifies; follow-ups chat
    const turnId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random();
    setMessages(prev => [...prev,
      { role:'user', text, imgURL: firstTurn ? imageURL : null },
      { role:'assistant', id:turnId, query:text, ident:null, answer:wasFollowup?'':null, error:null, recalled:null, classifier:null },
    ]);
    setInput(''); setBusy(true);

    try {
      const fd = new FormData();
      fd.append('image', imageFile);
      fd.append('prompt', text);
      fd.append('history', JSON.stringify(history));
      fd.append('mode', 'deep');
      const resp = await apiFetch('/api/vision/chat', { method:'POST', body:fd });
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream:true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const ev = JSON.parse(line.slice(6));
          if (ev.type === 'token') { if (wasFollowup) appendLastAnswer(ev.content); }
          else if (ev.type === 'recalled') patchLastAsst({ recalled: ev.corrections || [] });
          else if (ev.type === 'classifier') patchLastAsst({ classifier: ev.prediction || null });
          else if (ev.type === 'identification') patchLastAsst({ ident: ev.schema });
          else if (ev.type === 'done') {
            if (ev.kind === 'chat') patchLastAsst({ answer: (ev.answer || '') });
            else patchLastAsst({ ident: ev.identification || null });
            if (typeof ev.prompt_tokens === 'number') {
              setUsage({ prompt: ev.prompt_tokens, completion: ev.completion_tokens, ctx: ev.context_window || 4096, estimated: true });
            }
          }
          else if (ev.type === 'error') patchLastAsst({ error: ev.message });
        }
      }
    } catch {
      patchLastAsst({ error: 'Could not reach the vision service. Ensure Ollama is running with llava:13b.' });
    }
    setBusy(false);
  };

  // Floating top-right button → opens the "Past corrections" panel.
  const CorrButton = () => (
    <div style={{position:'absolute',top:12,right:16,zIndex:40}}>
      <button onClick={() => setCorrOpen(true)} title="See the corrections you've taught BoneGraph"
        style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:'6px 12px',fontSize:13,color:'var(--text2)',cursor:'pointer',fontFamily:'var(--sans)',display:'flex',alignItems:'center',gap:6}}>
        <span style={{fontSize:18}}>⚙</span> Past corrections
      </button>
    </div>
  );

  // Empty state — centered dropzone (no image attached yet).
  if (!imageFile && messages.length === 0) return (
    <div className="ask" style={{position:'relative'}}>
      <CorrButton/>
      {corrOpen && <CorrectionsPanel onClose={() => setCorrOpen(false)}/>}
      <div className="chat-area">
      <div className="chat-inner" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',flex:1,minHeight:'72vh'}}>
        <div className={`dropzone${drag?' drag':''}`}
          onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)}
          onDrop={e=>{e.preventDefault();setDrag(false);startChat(e.dataTransfer.files[0])}}
          onClick={()=>fileRef.current.click()}>
          <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={e=>startChat(e.target.files[0])}/>
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" className="dz-icon">
            <rect x="6" y="8" width="36" height="32" rx="4" stroke="currentColor" strokeWidth="1.8"/>
            <path d="M24 18v12M18 24l6-6 6 6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          <div className="dz-title">Drop a bone image here</div>
          <div className="dz-sub">X-ray · MRI · micro-CT · or click to select · PNG, JPG</div>
        </div>
        <div className="vision-note" style={{marginTop:16,textAlign:'center'}}>BoneGraph identifies the image with a vision-language model (LLaVA 13b), you can chat about it and provide your feedback. For research and educational use only — not a clinical diagnosis.</div>
      </div>
      </div>
    </div>
  );

  return (
    <div className="ask" style={{position:'relative'}}>
      <CorrButton/>
      {corrOpen && <CorrectionsPanel onClose={() => setCorrOpen(false)}/>}
      <div className="chat-area">
        <div className="chat-inner">
          <div className="messages">
            {messages.map((m,i) => (
              <div key={i} className={`msg ${m.role==='user'?'msg-user':'msg-asst'}`}>
                {m.role==='assistant' && <div className="msg-avatar"><BoneSVG size={34}/></div>}
                <div className="msg-bubble">
                  {m.role==='user' ? (
                    <>
                      {m.imgURL && <img src={m.imgURL} alt="upload" className="vision-msg-img" style={{marginBottom: m.text?8:0}}/>}
                      {m.text && <div className="msg-text">{m.text}</div>}
                    </>
                  ) : m.error ? (
                    <div className="msg-text">⚠️ {m.error}</div>
                  ) : m.ident ? (
                    <>
                      {m.recalled?.length > 0 && <RecalledNote hits={m.recalled}/>}
                      {m.classifier && !(m.recalled?.length > 0) && <ClassifierBadge pred={m.classifier}/>}
                      <IdentCard ident={m.ident}/>
                      <VisionFeedbackBar turn={m} imageFile={imageFile}/>
                    </>
                  ) : m.answer != null ? (
                    <>
                      {m.recalled?.length > 0 && <RecalledNote hits={m.recalled}/>}
                      <div className="msg-text">
                        {m.answer
                          ? <>{m.answer}{busy && i===messages.length-1 && <span className="blink">▍</span>}</>
                          : <Dots/>}
                      </div>
                      {m.answer && !(busy && i===messages.length-1) && <VisionFeedbackBar turn={m} imageFile={imageFile}/>}
                    </>
                  ) : (
                    <div className="msg-text"><Dots/></div>
                  )}
                </div>
              </div>
            ))}
            <div ref={endRef}/>
          </div>
        </div>
      </div>
      <div className="chat-bar">
        <div style={{width:'100%',maxWidth:760,display:'flex',flexDirection:'column',gap:8}}>
          <div className="vision-strip">
            {imageURL && <img src={imageURL} alt="active"/>}
            <span>{firstTurn ? 'Image ready — ask a question or just send to identify' : 'Chatting about the uploaded image'}</span>
            <input ref={addRef} type="file" accept="image/*" style={{display:'none'}} onChange={e=>{ startChat(e.target.files[0]); e.target.value=''; }}/>
            <button className="reupload" style={{marginLeft:'auto',padding:'4px 10px',fontSize:12}} onClick={()=>addRef.current.click()} title="Start a new chat with a different image">New chat with image</button>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
          {usage && <CtxRing usage={usage}/>}
          <div className="chat-wrap" style={{maxWidth:'none',flex:1}}>
            <input className="chat-input"
              placeholder={firstTurn ? 'Ask about this image (optional) — e.g. cortical or trabecular?' : 'Ask a follow-up…'}
              value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } }}
              disabled={busy}/>
            <button className="send-btn" onClick={send} disabled={busy || !imageFile || (!firstTurn && !input.trim())}>
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 9h12M9 4l5 5-5 5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </button>
          </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── MECHANICS TAB ─────────────────────────────────────────────────────────────
// Quantitative counterpart to Vision: upload one undeformed micro-CT slice, run
// the D2IM CNN, and show predicted axial displacement (µm) + axial strain (µε).
// One forward pass → one JSON response (no streaming). Degrades gracefully when
// TensorFlow / the weights are absent (status endpoint drives the UI).
function MechanicsTab() {
  const [avail, setAvail]       = useState(null);   // status object, or null while loading
  const [imageFile, setImageFile] = useState(null);
  const [imageURL, setImageURL]   = useState(null);
  const [maskFile, setMaskFile]   = useState(null);
  const [busy, setBusy]   = useState(false);
  const [drag, setDrag]   = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError]   = useState(null);
  const fileRef = useRef(null);
  const maskRef = useRef(null);

  useEffect(() => {
    apiFetch('/api/mechanics/status').then(r => r.json()).then(setAvail)
      .catch(() => setAvail({ available:false, reason:'Could not reach the mechanics service.' }));
  }, []);

  const pick = (f) => {
    if (!f || !f.type.startsWith('image/') && !/\.(tif|tiff)$/i.test(f.name)) return;
    setResult(null); setError(null);
    setImageFile(f); setImageURL(URL.createObjectURL(f));
  };

  // Built-in vertebrae slices (scan + matching bone mask) from our own dataset,
  // so a user can try the tab without hunting for a micro-CT slice. Loading one
  // fetches the real TIFFs (sent to D2IM) and shows the PNG preview.
  const SAMPLES = [
    { id:'s3', label:'Vertebra · AP · intact',
      scan:'/static/samples/S3_INT_UL_AP_50_0003.tif',
      mask:'/static/samples/S3_INT_UL_AP_50_0003_mask.tif',
      preview:'/static/samples/S3_INT_UL_AP_50_0003.png' },
    { id:'s8', label:'Vertebra · ML · lesion',
      scan:'/static/samples/S8_LES_UL_ML_50_0012.tif',
      mask:'/static/samples/S8_LES_UL_ML_50_0012_mask.tif',
      preview:'/static/samples/S8_LES_UL_ML_50_0012.png' },
  ];

  const [loadingSample, setLoadingSample] = useState(null);  // sample id being fetched
  const loadSample = async (s) => {
    if (busy || loadingSample) return;
    setResult(null); setError(null); setLoadingSample(s.id);
    try {
      const [scanBlob, maskBlob] = await Promise.all([
        fetch(s.scan).then(r => r.blob()),
        fetch(s.mask).then(r => r.blob()),
      ]);
      setImageFile(new File([scanBlob], s.scan.split('/').pop(), { type:'image/tiff' }));
      setMaskFile(new File([maskBlob], s.mask.split('/').pop(), { type:'image/tiff' }));
      setImageURL(s.preview);
    } catch { setError('Could not load the sample image.'); }
    setLoadingSample(null);
  };

  const predict = async () => {
    if (!imageFile || busy) return;
    setBusy(true); setError(null); setResult(null);
    try {
      const fd = new FormData();
      fd.append('image', imageFile);
      if (maskFile) fd.append('mask', maskFile);
      const resp = await apiFetch('/api/mechanics/predict', { method:'POST', body:fd });
      const data = await resp.json();
      if (data.ok) setResult(data);
      else setError(data.error || 'Prediction failed.');
    } catch { setError('Could not reach the mechanics service.'); }
    setBusy(false);
  };

  const fmt = (x, d=1) => (x == null || isNaN(x)) ? '—'
    : Number(x).toLocaleString(undefined, { maximumFractionDigits:d });

  const StatRow = ({ k, v }) => (
    <div className="id-row"><div className="id-k">{k}</div><div>{v}</div></div>
  );

  // Setup gate — TF or weights missing.
  if (avail && !avail.available) return (
    <div style={{maxWidth:720, margin:'0 auto', padding:'48px 20px'}}>
      <div style={{fontFamily:'var(--sans)', fontSize:24, marginBottom:16, color:'var(--text)', textAlign:'center'}}>Mechanics</div>
      <div className="id-card">
        <div className="id-head"><span className="id-name">Setup needed</span></div>
        <div className="id-rows">
          <StatRow k="Status" v={avail.reason}/>
          {!avail.tensorflow && <StatRow k="Install" v={<code>pip install tensorflow</code>}/>}
          {avail.tensorflow && !avail.weights && <StatRow k="Get weights" v={<code>python -m scripts.download_d2im</code>}/>}
        </div>
      </div>
      <div className="vision-note" style={{margin:'16px auto 0', textAlign:'center'}}>
        The Mechanics tab runs D2IM (Soar, Palanca, Dall'Ara &amp; Tozzi, 2024) to predict displacement and strain fields from a bone image. Research and educational use only — not a clinical tool.
      </div>
    </div>
  );

  return (
    <div style={{maxWidth:920, margin:'0 auto', padding:'32px 20px 64px'}}>
      <div style={{fontFamily:'var(--sans)', fontSize:24, marginBottom:6, color:'var(--text)', textAlign:'center'}}>Mechanics</div>
      <div className="vision-note" style={{textAlign:'center', margin:'0 auto 8px'}}>
        Predict displacement &amp; axial strain fields from one undeformed micro-CT slice with D2IM. Research and educational use only — not a clinical tool.
      </div>
      <div className="vision-note" style={{textAlign:'center', margin:'0 auto 22px', fontSize:12}}>
        The bundled D2IM model was trained on our own vertebrae dataset, so it works best on similar micro-CT slices. A CLI to train D2IM on your own dataset is coming in a future release.
      </div>

      {!imageFile ? (
        <div className={`dropzone${drag?' drag':''}`} style={{maxWidth:560, margin:'0 auto'}}
          onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)}
          onDrop={e=>{e.preventDefault();setDrag(false);pick(e.dataTransfer.files[0])}}
          onClick={()=>fileRef.current.click()}>
          <input ref={fileRef} type="file" accept="image/*,.tif,.tiff" style={{display:'none'}} onChange={e=>pick(e.target.files[0])}/>
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" className="dz-icon">
            <rect x="6" y="8" width="36" height="32" rx="4" stroke="currentColor" strokeWidth="1.8"/>
            <path d="M24 18v12M18 24l6-6 6 6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
          <div className="dz-title">Drop an undeformed micro-CT slice</div>
          <div className="dz-sub">TIFF · PNG · JPG · or click to select</div>
        </div>
      ) : null}

      {!imageFile && (
        <div style={{maxWidth:560, margin:'18px auto 0'}}>
          <div className="vision-note" style={{textAlign:'center', marginBottom:10}}>
            Or try a sample vertebra slice from our dataset:
          </div>
          <div style={{display:'flex', gap:12, justifyContent:'center', flexWrap:'wrap'}}>
            {SAMPLES.map(s => (
              <button key={s.id} onClick={()=>loadSample(s)} disabled={!!loadingSample}
                style={{display:'flex', flexDirection:'column', alignItems:'center', gap:6,
                  padding:8, borderRadius:10, border:'1px solid var(--border)',
                  background:'var(--surface2)', opacity:loadingSample && loadingSample!==s.id ? .5 : 1,
                  cursor:loadingSample?'default':'pointer', width:150}}>
                <img src={s.preview} alt={s.label}
                  style={{width:'100%', height:110, objectFit:'cover', borderRadius:6, background:'#111'}}/>
                <span style={{fontSize:12, color:'var(--text2)', fontFamily:'var(--sans)'}}>
                  {loadingSample===s.id ? 'Loading…' : s.label}
                </span>
              </button>
            ))}
          </div>
        </div>
      )}

      {imageFile && (
        <div style={{display:'flex', flexDirection:'column', alignItems:'center', gap:14}}>
          <div className="vision-strip" style={{maxWidth:560}}>
            {imageURL && <img src={imageURL} alt="scan"/>}
            <span>{imageFile.name}</span>
            <input ref={fileRef} type="file" accept="image/*,.tif,.tiff" style={{display:'none'}} onChange={e=>{pick(e.target.files[0]); e.target.value='';}}/>
            <button className="reupload" style={{marginLeft:'auto', padding:'4px 10px', fontSize:12}} onClick={()=>fileRef.current.click()}>Change image</button>
          </div>

          <div style={{display:'flex', alignItems:'center', gap:10, flexWrap:'wrap', justifyContent:'center'}}>
            <input ref={maskRef} type="file" accept="image/*,.tif,.tiff" style={{display:'none'}} onChange={e=>{ setMaskFile(e.target.files[0]||null); }}/>
            <button className="reupload" style={{padding:'5px 12px', fontSize:12.5}} onClick={()=>maskRef.current.click()}>
              {maskFile ? `Mask: ${maskFile.name}` : 'Add bone mask (optional)'}
            </button>
            {maskFile && <button className="reupload" style={{padding:'5px 10px', fontSize:12}} onClick={()=>{setMaskFile(null); if(maskRef.current) maskRef.current.value='';}}>Clear mask</button>}
          </div>
          <button className="send-btn" style={{position:'static', right:'auto', width:'auto', height:'auto', padding:'8px 20px', borderRadius:9, fontFamily:'var(--sans)', fontSize:14}}
            onClick={predict} disabled={busy || (avail && !avail.available)}>
            {busy ? <Spinner/> : 'Predict fields'}
          </button>
          {!maskFile && <div className="vision-note" style={{textAlign:'center', fontSize:12}}>No mask supplied — an approximate bone region will be derived from the scan.</div>}
        </div>
      )}

      {busy && <div className="loading-row" style={{justifyContent:'center', marginTop:24}}><Dots/><span>Running D2IM…</span></div>}
      {error && <div className="id-card" style={{marginTop:24}}><div className="msg-text">⚠️ {error}</div></div>}

      {result && (
        <div style={{marginTop:28, display:'flex', flexDirection:'column', gap:18}}>
          <img src={`data:image/png;base64,${result.figure}`} alt="D2IM prediction"
            style={{width:'100%', borderRadius:10, border:'1px solid var(--border)'}}/>
          <div className="id-card">
            <div className="id-head">
              <span className="id-name">Predicted mechanics</span>
              <span className="badge" style={{display:'inline-block', padding:'2px 9px', borderRadius:7, border:'1px solid var(--border)', background:'var(--surface2)', color:'var(--text2)', fontSize:11.5}}>
                Mask: {result.mask_source === 'uploaded' ? 'supplied' : 'auto (approx.)'}
              </span>
            </div>
            <div className="id-rows">
              <StatRow k="Peak compressive strain" v={`${fmt(result.stats.peak_compressive_strain_ue)} µε`}/>
              <StatRow k="Peak tensile strain" v={`${fmt(result.stats.peak_tensile_strain_ue)} µε`}/>
              <StatRow k="Mean |strain|" v={`${fmt(result.stats.mean_abs_strain_ue)} µε`}/>
              <StatRow k="Axial displacement w" v={`${fmt(result.stats.w_min_um)} … ${fmt(result.stats.w_max_um)} µm`}/>
              <StatRow k="Mean w" v={`${fmt(result.stats.w_mean_um)} µm`}/>
              <StatRow k="Calibration" v={`voxel ${fmt(result.params.voxel_size_um)} µm · node spacing ${result.params.node_spacing}`}/>
              <StatRow k="Model" v={<code>{result.model}</code>}/>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── APP SHELL ─────────────────────────────────────────────────────────────────
const TABS = [
  { id:'ask',     label:'Chat', icon:<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 2h11v8H8.5L5 13v-3H2V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/></svg> },
  { id:'search',  label:'Search', icon:<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="6.5" cy="6.5" r="4" stroke="currentColor" strokeWidth="1.5"/><path d="M10 10l3.5 3.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg> },
  { id:'reason',  label:'Reasoning',        icon:<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="2.5" cy="7.5" r="1.5" stroke="currentColor" strokeWidth="1.4"/><circle cx="7.5" cy="7.5" r="1.5" stroke="currentColor" strokeWidth="1.4"/><circle cx="12.5" cy="7.5" r="1.5" stroke="currentColor" strokeWidth="1.4"/><path d="M4 7.5h2M9 7.5h2" stroke="currentColor" strokeWidth="1.4"/></svg> },
  { id:'vision', label:'Vision', icon:<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="1.5" y="2.5" width="12" height="10" rx="1.5" stroke="currentColor" strokeWidth="1.5"/><circle cx="5.5" cy="6.5" r="1.5" stroke="currentColor" strokeWidth="1.3"/><path d="M1.5 10.5l4-3.5 3 2.5 2-2 3 3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg> },
  { id:'mechanics', label:'Mechanics', icon:<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 12.5h11M4 12.5V6M7.5 12.5V3.5M11 12.5V8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/><path d="M2.5 6l5-2.5L12.5 8" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg> },
];

function FeedbackModal({ tab, onClose, userFullName, userEmail }) {
  const [category, setCategory] = useState('idea');
  const [name, setName]         = useState(userFullName || '');
  const [message, setMessage]   = useState('');
  const [email, setEmail]       = useState(userEmail || '');
  const [status, setStatus]     = useState('idle'); // idle | sending | done | error
  const canSend = name.trim() && message.trim();
  const cats = [
    ['bug','🐞 Bug'], ['idea','💡 Idea'], ['question','❓ Question'], ['praise','🎉 Praise'],
  ];

  const submit = async () => {
    if (!canSend || status === 'sending') return;
    setStatus('sending');
    try {
      const fd = new FormData();
      fd.append('message', message.trim());
      fd.append('name', name.trim());
      fd.append('category', category);
      fd.append('email', email.trim());
      fd.append('tab', tab || '');
      fd.append('page', window.location.pathname);
      const r = await apiFetch('/api/feedback', { method:'POST', body: fd });
      if (!r.ok) throw new Error('bad status');
      setStatus('done');
    } catch (e) { setStatus('error'); }
  };

  return (
    <div onClick={onClose}
      style={{position:'absolute',inset:0,zIndex:80,background:'rgba(0,0,0,.22)',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div onClick={e => e.stopPropagation()}
        style={{width:'min(460px,92%)',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,boxShadow:'0 12px 40px rgba(0,0,0,.18)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{padding:'16px 20px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontFamily:'var(--sans)',fontSize:17,fontWeight:600,color:'var(--text)'}}>Send feedback</div>
            <div style={{fontSize:12,color:'var(--text3)',marginTop:2}}>BoneGraph is in public beta — tell us what works and what doesn't.</div>
          </div>
          <button onClick={onClose} style={{background:'transparent',border:'none',fontSize:20,color:'var(--text3)',cursor:'pointer'}}>×</button>
        </div>

        {status === 'done' ? (
          <div style={{padding:'32px 20px',textAlign:'center'}}>
            <div style={{fontSize:32,marginBottom:8}}>🙏</div>
            <div style={{fontFamily:'var(--sans)',fontSize:15,fontWeight:600,color:'var(--text)'}}>Thanks for the feedback!</div>
            <div style={{fontSize:13,color:'var(--text3)',marginTop:6}}>It's been recorded. We read every note.</div>
            <button onClick={onClose}
              style={{marginTop:18,background:'var(--navy)',color:'#fff',border:'none',borderRadius:8,padding:'8px 18px',fontSize:13,cursor:'pointer'}}>Close</button>
          </div>
        ) : (
          <div style={{padding:'16px 20px',display:'flex',flexDirection:'column',gap:14}}>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {cats.map(([id,label]) => (
                <button key={id} onClick={() => setCategory(id)}
                  style={{border:`1px solid ${category===id?'var(--amber)':'var(--border)'}`,background:category===id?'var(--amber-light)':'transparent',color:category===id?'var(--amber)':'var(--text2)',borderRadius:8,padding:'6px 12px',fontSize:13,cursor:'pointer',fontFamily:'var(--sans)'}}>
                  {label}
                </button>
              ))}
            </div>
            <input value={name} onChange={e => setName(e.target.value)}
              placeholder="Full name *"
              style={{width:'100%',boxSizing:'border-box',border:'1px solid var(--border)',borderRadius:8,padding:'9px 12px',fontSize:13,fontFamily:'var(--sans)',background:'var(--surface)',color:'var(--text)'}}/>
            <textarea value={message} onChange={e => setMessage(e.target.value)} autoFocus
              placeholder="What's on your mind? Bugs, ideas, anything…" rows={5}
              style={{width:'100%',boxSizing:'border-box',border:'1px solid var(--border)',borderRadius:8,padding:'10px 12px',fontSize:14,fontFamily:'var(--sans)',resize:'vertical',background:'var(--surface)',color:'var(--text)'}}/>
            <input value={email} onChange={e => setEmail(e.target.value)} type="email"
              placeholder="Email (optional — only if you'd like a reply)"
              style={{width:'100%',boxSizing:'border-box',border:'1px solid var(--border)',borderRadius:8,padding:'9px 12px',fontSize:13,fontFamily:'var(--sans)',background:'var(--surface)',color:'var(--text)'}}/>
            {status === 'error' && (
              <div style={{color:'#b02020',fontSize:13}}>Couldn't send — please try again.</div>
            )}
            <div style={{display:'flex',justifyContent:'flex-end',gap:10,alignItems:'center'}}>
              <button onClick={onClose} style={{background:'transparent',border:'none',color:'var(--text3)',fontSize:13,cursor:'pointer'}}>Cancel</button>
              <button onClick={submit} disabled={!canSend || status==='sending'}
                style={{background:'var(--navy)',color:'#fff',border:'none',borderRadius:8,padding:'8px 18px',fontSize:13,cursor:canSend?'pointer':'not-allowed',opacity:canSend?1:.5}}>
                {status==='sending' ? 'Sending…' : 'Send feedback'}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function AuthScreen({ onAuth }) {
  const [mode, setMode]         = useState('login'); // 'login' | 'register'
  const [fullName, setFullName] = useState('');
  const [email, setEmail]       = useState('');
  const [password, setPassword] = useState('');
  const [showPassword, setShowPassword] = useState(false);
  const [error, setError]       = useState('');
  const [busy, setBusy]         = useState(false);
  const canSubmit = email.trim() && password && !busy && (mode === 'login' || fullName.trim());

  const submit = async e => {
    e.preventDefault();
    if (!canSubmit) return;
    setBusy(true); setError('');
    try {
      const fd = new FormData();
      if (mode === 'register') fd.append('full_name', fullName.trim());
      fd.append('email', email.trim());
      fd.append('password', password);
      const r = await apiFetch(`/api/auth/${mode}`, { method: 'POST', body: fd });
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || 'Something went wrong');
      onAuth(data.token, data.full_name, data.email);
    } catch (err) {
      setError(err.message || 'Something went wrong');
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',width:'100%',background:'var(--bg)'}}>
      <form onSubmit={submit}
        style={{width:'min(380px,90%)',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,boxShadow:'0 12px 40px rgba(0,0,0,.1)',padding:'28px 26px',display:'flex',flexDirection:'column',gap:14}}>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
          <BoneSVG size={30}/>
          <span style={{fontFamily:'var(--sans)',fontSize:19,fontWeight:600,color:'var(--text)'}}>BoneGraph</span>
        </div>
        <div style={{fontSize:13,color:'var(--text3)',marginBottom:4}}>
          {mode === 'login' ? 'Log in to continue.' : 'Create an account to get started.'}
        </div>
        {mode === 'register' && (
          <input value={fullName} onChange={e => setFullName(e.target.value)} autoFocus
            placeholder="Full Name"
            style={{width:'100%',boxSizing:'border-box',border:'1px solid var(--border)',borderRadius:8,padding:'9px 12px',fontSize:13,fontFamily:'var(--sans)',background:'var(--surface)',color:'var(--text)'}}/>
        )}
        <input value={email} onChange={e => setEmail(e.target.value)} autoFocus={mode === 'login'}
          type="email" placeholder="Email"
          style={{width:'100%',boxSizing:'border-box',border:'1px solid var(--border)',borderRadius:8,padding:'9px 12px',fontSize:13,fontFamily:'var(--sans)',background:'var(--surface)',color:'var(--text)'}}/>
        <div style={{position:'relative',display:'flex'}}>
          <input value={password} onChange={e => setPassword(e.target.value)} type={showPassword ? 'text' : 'password'}
            placeholder="Password"
            style={{width:'100%',boxSizing:'border-box',border:'1px solid var(--border)',borderRadius:8,padding:'9px 38px 9px 12px',fontSize:13,fontFamily:'var(--sans)',background:'var(--surface)',color:'var(--text)'}}/>
          <button type="button" onClick={() => setShowPassword(s => !s)}
            title={showPassword ? 'Hide password' : 'Show password'}
            aria-label={showPassword ? 'Hide password' : 'Show password'}
            style={{position:'absolute',right:1,top:1,bottom:1,width:34,display:'flex',alignItems:'center',justifyContent:'center',background:'none',border:'none',cursor:'pointer',color:'var(--text3)',padding:0}}>
            {showPassword ? (
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6.5 6.5a2 2 0 0 0 2.8 2.8M3.2 3.2C1.9 4.1 1 5.4 1 6.5c0 1.5 2.7 4 6.5 4 1 0 2-.2 2.8-.5M5.5 2.7c.6-.1 1.1-.2 1.5-.2 3.8 0 6.5 2.5 6.5 4 0 .7-.6 1.6-1.6 2.4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/><path d="M1.5 1.5l11 11" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>
            ) : (
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1 7.5C1 6 3.7 3.5 7.5 3.5S14 6 14 7.5 11.3 11.5 7.5 11.5 1 9 1 7.5z" stroke="currentColor" strokeWidth="1.3"/><circle cx="7.5" cy="7.5" r="1.8" stroke="currentColor" strokeWidth="1.3"/></svg>
            )}
          </button>
        </div>
        {error && <div style={{color:'#b02020',fontSize:13}}>{error}</div>}
        <button type="submit" disabled={!canSubmit}
          style={{background:'var(--navy)',color:'#fff',border:'none',borderRadius:8,padding:'9px 18px',fontSize:13,cursor:canSubmit?'pointer':'not-allowed',opacity:canSubmit?1:.5}}>
          {busy ? 'Please wait…' : (mode === 'login' ? 'Log in' : 'Register')}
        </button>
        <button type="button" onClick={() => { setMode(mode === 'login' ? 'register' : 'login'); setError(''); }}
          style={{background:'transparent',border:'none',color:'var(--text3)',fontSize:12.5,cursor:'pointer',textAlign:'center'}}>
          {mode === 'login' ? "Don't have an account? Register" : 'Already have an account? Log in'}
        </button>
      </form>
    </div>
  );
}

function App() {
  const [tab, setTab]     = useState(() => localStorage.getItem('bl-tab') || 'ask');
  const [stats, setStats] = useState(null);
  const [feedbackOpen, setFeedbackOpen] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [authToken, setAuthToken] = useState(() => localStorage.getItem('bg_token'));
  const [fullName, setFullName]   = useState(() => localStorage.getItem('bg_fullname'));
  const [email, setEmail]         = useState(() => localStorage.getItem('bg_email'));
  const [theme, setTheme]         = useState(() => localStorage.getItem('bg_theme') || 'light');

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('bg_theme', theme);
  }, [theme]);
  const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark');

  useEffect(() => {
    if (!authToken) return;
    apiFetch('/api/stats').then(r => r.json()).then(setStats).catch(() => {});
  }, [authToken]);

  const switchTab = id => { setTab(id); localStorage.setItem('bl-tab', id); setSidebarOpen(false); };
  const activeLabel = (TABS.find(t => t.id === tab) || {}).label || 'BoneGraph';

  const handleAuth = (token, name, userEmail) => {
    localStorage.setItem('bg_token', token);
    localStorage.setItem('bg_fullname', name);
    localStorage.setItem('bg_email', userEmail);
    setAuthToken(token);
    setFullName(name);
    setEmail(userEmail);
  };
  const logout = async () => {
    try { await apiFetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
    localStorage.removeItem('bg_token');
    localStorage.removeItem('bg_fullname');
    localStorage.removeItem('bg_email');
    setAuthToken(null);
    setFullName(null);
    setEmail(null);
  };

  if (!authToken) return <AuthScreen onAuth={handleAuth}/>;

  return (
    <div className="app-shell" style={{display:'flex',height:'100dvh',width:'100%',overflow:'hidden'}}>
      <div className="mobile-bar">
        <button className="hamb" onClick={() => setSidebarOpen(true)} aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/></svg>
        </button>
        <span className="mobile-title"><BoneSVG size={20}/>{activeLabel}</span>
      </div>
      {sidebarOpen && <div className="sb-backdrop" onClick={() => setSidebarOpen(false)}/>}
      <aside className={`sidebar${sidebarOpen?' open':''}`}>
        <div className="sb-logo">
          <div className="sb-logo-icon"><BoneSVG size={34}/></div>
          <div className="sb-logo-meta">
            <div className="sb-logo-title">
              <span className="sb-logo-text">BoneGraph</span>
              <span className="sb-beta">beta</span>
            </div>
          </div>
        </div>
        <nav className="sb-nav">
          {TABS.map(t => (
            <button key={t.id} className={`sb-item${tab===t.id?' active':''}`} onClick={() => switchTab(t.id)}>
              <span className="sb-item-icon">{t.icon}</span>{t.label}
            </button>
          ))}
        </nav>
        <div style={{padding:'0 8px 8px'}}>
          <div className="sb-profile-row">
            <span className="sb-profile-name" title={fullName}>
              <svg width="13" height="13" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="4.5" r="2.5" stroke="currentColor" strokeWidth="1.4"/><path d="M2.5 13c0-2.76 2.24-4.5 5-4.5s5 1.74 5 4.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>
              {fullName}
            </span>
            <button onClick={logout} className="sb-logout-btn" title="Log out">Log out</button>
          </div>
        </div>
        <div style={{padding:'0 8px 8px'}}>
          <button onClick={() => setFeedbackOpen(true)} className="sb-feedback-btn"
            title="Send feedback about the beta">
            <svg width="14" height="14" viewBox="0 0 15 15" fill="none"><path d="M2 2h11v8H8.5L5 13v-3H2V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/></svg>
            Send feedback
          </button>
        </div>
        <div style={{padding:'0 8px 14px'}}>
          <button onClick={toggleTheme} className="sb-feedback-btn"
            title={theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'}>
            {theme === 'dark' ? (
              <svg width="14" height="14" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="3" stroke="currentColor" strokeWidth="1.4"/><path d="M7.5 1v1.6M7.5 12.4V14M14 7.5h-1.6M2.6 7.5H1M12.1 12.1l-1.1-1.1M4 4L2.9 2.9M12.1 2.9L11 4M4 11l-1.1 1.1" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>
            ) : (
              <svg width="14" height="14" viewBox="0 0 15 15" fill="none"><path d="M13 9.3A5.5 5.5 0 1 1 5.7 2 4.5 4.5 0 0 0 13 9.3z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/></svg>
            )}
            {theme === 'dark' ? 'Light mode' : 'Dark mode'}
          </button>
        </div>
      </aside>

      <main className="main">
        <div className={`panel${tab==='ask'?' active':''}`}>
          <AskTab totalChunks={stats?.chunks}/>
        </div>
        <div className={`panel-scroll${tab==='search'?' active':''}`}>
          <div className="panel-inner"><SearchTab totalChunks={stats?.chunks}/></div>
        </div>
        <div className={`panel${tab==='reason'?' active':''}`}>
          <ReasonTab/>
        </div>
        <div className={`panel${tab==='vision'?' active':''}`}>
          <VisionTab/>
        </div>
        <div className={`panel-scroll${tab==='mechanics'?' active':''}`}>
          <div className="panel-inner"><MechanicsTab/></div>
        </div>
      </main>
      {feedbackOpen && <FeedbackModal tab={tab} onClose={() => setFeedbackOpen(false)} userFullName={fullName} userEmail={email}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
