          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <label style={{fontSize:12,color:'var(--text2)',display:'flex',alignItems:'center',gap:6}}>
            Tissue:
            <select value={boneType}
                    onChange={e => onBoneTypeChange(e.target.value)}
                    disabled={loading}
                    style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:6,padding:'5px 8px',fontSize:12,color:'var(--text)',fontFamily:'var(--sans)'}}>
              <option value="cortical">Cortical</option>
              <option value="transitional">Transitional</option>
              <option value="trabecular">Trabecular</option>
            </select>
          </label>
          <button className="eqn-agents-btn" onClick={onRun} disabled={loading}>
            {loading ? <Spinner/> : (agents ? 'Re-run' : 'Run agents')}
          </button>
        </div>
      </div>

      {loading && (
        <div className="loading-row" style={{marginTop:8}}>
          <Dots/><span>Proposer is thinking… Critic is reading the corpus…</span>
        </div>
      )}
      {error && <div className="eqn-agent-error">{error}</div>}

      {agents && agents.length > 0 && (
        <div className="eqn-agent-list">
          {agents.map((item, i) => {
            if (item.error) return (
              <div key={i} className="eqn-agent-card">
                <div className="eqn-agent-error">{item.error}</div>
              </div>
            );

            const h = item.hypothesis || {};
            const p = item.physics    || {};
            const c = item.critique   || {};

            const verdict   = c.verdict || 'needs-more-data';
            const dirClass  = p.direction === 'increases' ? 'dir-up'
                            : p.direction === 'decreases' ? 'dir-down'
                            : 'dir-mixed';
            const arrow     = p.direction === 'increases' ? '↑'
                            : p.direction === 'decreases' ? '↓' : '↺';
            const relChange = p.relative_change != null
              ? `${(p.relative_change * 100).toFixed(0)}%` : '—';

            return (
              <div key={i} className={`eqn-agent-card verdict-${verdict}`}>
                <div className="eqn-agent-row1">
                  <div className="eqn-agent-title">
                    #{i + 1} · {h.sweep_var} → {h.target}
                  </div>
                  <span className={`eqn-agent-verdict ${verdict}`}>
                    {VERDICT_LABELS[verdict] || verdict}
                  </span>
                </div>

                <div className="eqn-agent-pills">
                  <span className={`eqn-agent-pill ${dirClass}`}>{arrow} {p.direction} ({relChange})</span>
                  {p.physics_confidence != null && (
                    <span className="eqn-agent-pill">phys conf {p.physics_confidence.toFixed(2)}</span>
                  )}
                  {p.magnitude != null && (
                    <span className="eqn-agent-pill">mag {p.magnitude.toFixed(2)}</span>
                  )}
                  {c.confidence != null && (
                    <span className="eqn-agent-pill">critic conf {c.confidence.toFixed(2)}</span>
                  )}
                  {p.proposer_mismatch && (
                    <span className="eqn-agent-pill dir-down" title={`Proposer predicted ${p.predicted_direction}; engine got ${p.direction}`}>
                      ⚠ proposer wrong
                    </span>
                  )}
                </div>

                {p.summary && (
                  <div className="eqn-agent-sweep">{p.summary}</div>
                )}

                {h.rationale && (
                  <div className="eqn-agent-rationale">Proposer: {h.rationale}</div>
                )}

                {c.reason && (
                  <div className="eqn-agent-reason">Critic: {c.reason}</div>
                )}

                {c.corpus_passages && c.corpus_passages.length > 0 && (
                  <div className="eqn-agent-corpus">
                    {c.corpus_passages.map((s, j) => (
                      <div key={j} style={{marginBottom:4}}>"{s}"</div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ReasonSection({view, presets, onRun, loading, result, error, elapsed,
                    covariates, onCovariatesChange,
                    query, onQueryChange, onAsk,
                    surprises, surprisesLoading, surprisesError, onSurprisesRefresh,
                    agents, agentsLoading, agentsError, onAgentsRun,
                    boneType, onBoneTypeChange}) {
  const groups = [
    {mode: 'forward',        items: presets.filter(p => p.mode === 'forward')},
    {mode: 'abductive',      items: presets.filter(p => p.mode === 'abductive')},
    {mode: 'counterfactual', items: presets.filter(p => p.mode === 'counterfactual')},
  ];

  const loadingMsg = {
    forward:        'Solving equation graph and propagating uncertainty…',
    abductive:      'Sampling prior, propagating, and weighting by likelihood…',
    counterfactual: 'Running paired baseline / intervened passes…',
  };

  if (view === 'agents') {
    return (
      <div style={{display:'flex',flexDirection:'column',gap:20,alignItems:'center',paddingTop:8,width:'100%'}}>
        {AGENTS_ENABLED && (
          <AgentsPanel
            agents={agents}
            loading={agentsLoading}
            error={agentsError}
            onRun={onAgentsRun}
            boneType={boneType}
            onBoneTypeChange={onBoneTypeChange}
          />
        )}
      </div>
    );
  }

  return (
    <div style={{display:'flex',flexDirection:'column',gap:20,alignItems:'center',paddingTop:8,width:'100%'}}>
      <CovariatePanel covariates={covariates} onChange={onCovariatesChange}/>

      {!result && !loading && (
        <div className="ex-chips">
          <span className="chips-label">Try:</span>
          {ASK_EXAMPLES.map((ex, i) => (
            <button key={i} className="chip"
              onClick={() => { onQueryChange(ex); onAsk(ex); }}>{ex}</button>
          ))}
        </div>
      )}

      {PRESETS_ENABLED && (
      <div className="eqn-preset-groups">
        {groups.map(g => {
          const meta = MODE_META[g.mode];
          return (
            <div key={g.mode} className="eqn-preset-group">
              <div className="eqn-preset-group-hdr">{meta.hdr} — {meta.blurb}</div>
              <div className="eqn-presets" style={{justifyContent:'flex-start'}}>
                {g.items.map(p => (
                  <button key={p.id} className="eqn-preset" onClick={() => onRun(p)} disabled={loading}>
                    <span className="eqn-preset-label">
                      <span className={`eqn-mode-tag ${meta.cls}`}>{meta.tag}</span>
                      {p.label}
                      {p.syncCovariates && <span className="eqn-mode-tag eqn-mode-counterfactual" style={{marginLeft:8}}>covariates</span>}
                    </span>
                    <span className="eqn-preset-desc">{p.desc}</span>
                  </button>
                ))}
              </div>
            </div>
          );
        })}
      </div>
      )}

      {loading && (
        <div className="loading-row" style={{marginTop:24}}>
          <Dots/><span>{loadingMsg[result?.mode] || loadingMsg.forward}</span>
        </div>
      )}
      {error && <div className="eqn-error">{error}</div>}

      {result && !loading && (
        <Fragment>
          {result.mode === 'forward'        && <ForwardCard        result={result} elapsed={elapsed}/>}
          {result.mode === 'abductive'      && <AbductiveCard      result={result} elapsed={elapsed}/>}
          {result.mode === 'counterfactual' && <CounterfactualCard result={result} elapsed={elapsed}/>}
          {SURPRISES_ENABLED && result.mode === 'explore' && (
            <SurprisesPanel
              candidates={result.candidates || []}
              loading={false}
              error=""
              onRefresh={onSurprisesRefresh}
              fromAsk={true}
            />
          )}

          {result.citations && result.citations.length > 0 && (
            <div className="eqn-card" style={{paddingTop:14}}>
              <div className="eqn-card-title" style={{fontSize:11,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--text3)'}}>Citations</div>
              <div className="eqn-citations" style={{borderTop:'none',paddingTop:0}}>
                {result.citations.map((c, i) => (
                  <div key={i} className="eqn-citation-row">{c}</div>
                ))}
              </div>
            </div>
          )}
        </Fragment>
      )}

      {/* Always-on Surprises panel — independent of any user query. */}
      {SURPRISES_ENABLED && result?.mode !== 'explore' && (
        <SurprisesPanel
          candidates={surprises}
          loading={surprisesLoading}
          error={surprisesError}
          onRefresh={onSurprisesRefresh}
          fromAsk={false}
        />
      )}

    </div>
  );
}

// ── REASON TAB ────────────────────────────────────────────────────────────────
// Phase 2 — pure-LLM reasoning agent (no RAG). Turn shape:
//   { id, query, answer, physical_check, critic_notes, user_feedback, timestamp }
// physical_check / critic_notes / user_feedback are reserved for later phases.
function ReasonTab() {
  const [turns, setTurns]   = useState([]);
  const [pendingQuery, setPendingQuery] = useState('');
  const [input, setInput]   = useState('');
  const [loading, setLoading] = useState(false);
  const [streaming, setStreaming] = useState('');
  const [usage, setUsage]   = useState(null); // {prompt, completion, ctx}
  const [proposedFor, setProposedFor] = useState({}); // turn_id -> {proposal, correction_id}
  const [status, setStatus] = useState('');             // pipeline status pill while loading
  const endRef     = useRef(null);
  const inputRef   = useRef(null);
  const chatAreaRef = useRef(null);
  const autoScroll = useRef(true);

  const handleWheel = () => { autoScroll.current = false; };
  const handleTouchStart = () => { autoScroll.current = false; };
  const handleChatScroll = () => {
    const el = chatAreaRef.current;
    if (!el) return;
    if (el.scrollHeight - el.scrollTop - el.clientHeight < 60) {
      autoScroll.current = true;
    }
  };

  useEffect(() => {
    if (autoScroll.current && endRef.current) {
      endRef.current.scrollIntoView({ behavior: 'smooth' });
    }
  }, [turns, loading, streaming, pendingQuery]);

  const send = async (text) => {
    const t = text.trim();
    if (!t || loading) return;
    autoScroll.current = true;
    setInput('');
    setPendingQuery(t);   // show user bubble immediately
    setLoading(true);
    setStreaming('');

    // Sliding window of the last 10 messages (5 pairs). Strip thinking from
    // assistant turns so we resend only the visible reasoning.
    const recent = turns.slice(-5);
    const history = [];
    recent.forEach(turn => {
      history.push({ role: 'user', content: turn.query });
      history.push({ role: 'assistant', content: stripThinking(turn.answer) });
    });
    const allQuestions = turns.map(turn => turn.query);

    let answer = '';
    let physicalCheck = null;
    let outOfScope = false;
    let rounds = [];
    let literature = [];
    let kg = null;
    let phase = 'agent';           // 'agent' | 'critic' | 'agent_revise'
    let critic_resolved = true;
    setStatus('Reasoning…');
    try {
      const fd = new FormData();
      fd.append('question', t);
      fd.append('history', JSON.stringify(history));
      fd.append('all_questions', JSON.stringify(allQuestions));
      const resp = await fetch('/api/reason/chat', { method:'POST', body:fd });
      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream:true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const ev = JSON.parse(line.slice(6));
          if (ev.type === 'round_start') {
            phase = ev.phase;
            if (ev.phase === 'agent') setStatus('Reasoning…');
            else if (ev.phase === 'critic') setStatus(ev.round === 2 ? 'Critic reviewing…' : 'Critic re-checking…');
            else if (ev.phase === 'agent_revise') { answer = ''; setStreaming(''); setStatus('Revising…'); }
          }
          else if (ev.type === 'token') {
            if (ev.phase === 'agent_revise') {
              // Replace the displayed streaming text with the revision-in-progress.
              answer += ev.content; setStreaming(answer);
            } else {
              answer += ev.content; setStreaming(answer);
            }
          }
          else if (ev.type === 'literature') { literature = ev.passages || []; }
          else if (ev.type === 'kg_context') { kg = {facts: ev.facts || [], anchors: ev.anchors || []}; }
          else if (ev.type === 'physical_check') { physicalCheck = ev; rounds.push({role:'physical_check', round: ev.round, ...ev}); }
          else if (ev.type === 'critic_review') { rounds.push({role:'critic', round: ev.round, verdict: ev.verdict, notes: ev.notes, suggested_revision: ev.suggested_revision, majority: ev.majority, minority: ev.minority, user_override: ev.user_override}); }
          else if (ev.type === 'done')  {
            answer = ev.answer;
            outOfScope = !!ev.out_of_scope;
            critic_resolved = !!ev.critic_resolved;
            if (ev.final_physical_check) physicalCheck = ev.final_physical_check;
            if (Array.isArray(ev.rounds) && ev.rounds.length) rounds = ev.rounds;
            if (Array.isArray(ev.literature)) literature = ev.literature;
            if (ev.kg) kg = ev.kg;
            if (typeof ev.prompt_tokens === 'number') {
              setUsage({ prompt: ev.prompt_tokens, completion: ev.completion_tokens, ctx: ev.context_window || 8192, estimated: true });
            }
          }
          else if (ev.type === 'error') { answer = '⚠️ ' + ev.message; }
        }
      }
    } catch(e) { answer = '⚠️ Error: ' + e.message; }
    const turn = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      query: t,
      answer,
      out_of_scope: outOfScope,
      physical_check: physicalCheck,
      rounds,
      literature,
      kg,
      critic_resolved,
      critic_notes: null,
      user_feedback: null,
      timestamp: new Date().toISOString(),
    };
    setTurns(prev => [...prev, turn]);
    setStreaming('');
    setStatus('');
    setPendingQuery('');
    setLoading(false);
    inputRef.current?.focus();
  };

  const CHIPS = [
    'What raises fracture risk in postmenopausal cortical bone?',
    'How does a lytic lesion change vertebral failure load?',
    'Why does trabecular bone fail before cortical in osteoporosis?',
  ];

  const [rulesOpen, setRulesOpen] = useState(false);

  const empty = turns.length === 0 && !loading;
  return (
    <div className="ask" style={{position:'relative'}}>
      <button onClick={() => setRulesOpen(true)} title="Manage the rules you've taught BoneMind"
        style={{position:'absolute',top:12,right:16,zIndex:40,background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:'6px 12px',fontSize:13,color:'var(--text2)',cursor:'pointer',fontFamily:'var(--sans)',display:'flex',alignItems:'center',gap:6}}>
        <span style={{fontSize:18}}>⚙</span> Your rules
      </button>
      {rulesOpen && <RulesPanel onClose={() => setRulesOpen(false)}/>}
      <div className="chat-area" ref={chatAreaRef} onScroll={handleChatScroll} onWheel={handleWheel} onTouchStart={handleTouchStart}>
        <div className="chat-inner">
          {empty ? (
            <div className="empty-state">
              <div className="empty-avatar"><BoneSVG size={100}/></div>
              <div className="empty-title">Reasoning</div>
              <div className="empty-sub">Step-by-step reasoning grounded in bone mechanics, physical rules, and your feedback</div>
              <div className="chips">
                {CHIPS.map((s,i) => <button key={i} className="chip" onClick={() => send(s)}>{s}</button>)}
              </div>
            </div>
          ) : (
            <div className="messages">
              {turns.map(turn => (
                <ReasonTurn key={turn.id} turn={turn}
                  proposed={proposedFor[turn.id]}
                  onFeedback={ev => {
                    if (ev.polarity === -1 && ev.proposed_rule) {
                      setProposedFor(prev => ({...prev, [turn.id]: {proposal: ev.proposed_rule, correction_id: ev.correction_id}}));
                    }
                  }}
                  onProposalDone={() => {
                    setProposedFor(prev => { const cp = {...prev}; delete cp[turn.id]; return cp; });
                  }}
                />
              ))}
              {pendingQuery && (
                <div className="msg msg-user">
                  <div className="msg-bubble"><div className="msg-text">{pendingQuery}</div></div>
                </div>
              )}
              {(loading || streaming) && (
                <div className="msg msg-asst">
                  <div className="msg-avatar"><BoneSVG size={34}/></div>
                  <div className="msg-bubble">
                    {status && (
                      <div style={{fontSize:11,color:'var(--text3)',marginBottom:6,letterSpacing:.3,textTransform:'uppercase'}}>
                        {status}
                      </div>
                    )}
                    <div className="msg-text">
                      {streaming
                        ? /final response/i.test(streaming)
                          ? <>{parseCit(stripThinking(streaming))}<span className="blink">▍</span></>
                          : <Dots/>
                        : <Dots/>}
                    </div>
                  </div>
                </div>
              )}
              <div ref={endRef}/>
            </div>
          )}
        </div>
      </div>
      <div className="chat-bar">
        <div style={{width:'100%',maxWidth:760,display:'flex',alignItems:'center',gap:6}}>
          {usage && <CtxRing usage={usage}/>}
          <div className="chat-wrap" style={{maxWidth:'none',flex:1}}>
            <input ref={inputRef} className="chat-input"
              placeholder="Ask a reasoning question about bone fracture, fragility, remodelling…"
              value={input} onChange={e => setInput(e.target.value)}
              onKeyDown={e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(input); } }}
              disabled={loading}/>
            <button className="send-btn" onClick={() => send(input)} disabled={loading || !input.trim()}>
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path d="M3 9h12M10 4l5 5-5 5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ruleSummary(r) {
  const p = r.params || {};
  if (r.kind === 'range') {
    const ctx = (p.context_terms || []).join(', ');
    return `${p.lo}–${p.hi} ${p.unit || ''}${ctx ? ` · context: ${ctx}` : ''}`;
  }
  if (r.kind === 'forbid_pattern') {
    const ctx = (p.context_terms || []).join(', ');
    const forb = (p.forbidden_terms || []).join(', ');
    return `avoid “${forb}”${ctx ? ` near ${ctx}` : ''}`;
  }
  return JSON.stringify(p);
}

function RulesPanel({ onClose }) {
  const [rules, setRules] = useState(null);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState({});   // id -> true while a request is in flight
  const [importMsg, setImportMsg] = useState(null);
  const [importing, setImporting] = useState(false);
  const fileRef = useRef(null);

  const load = async () => {
    try {
      const r = await fetch('/api/reason/rules');
      const d = await r.json();
      setRules(d.rules || []);
    } catch (e) { setError(e.message); }
  };
  useEffect(() => { load(); }, []);

  const onImportFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    setImporting(true); setImportMsg(null); setError('');
    try {
      const fd = new FormData(); fd.append('file', f);
      const r = await fetch('/api/reason/rules/import', { method:'POST', body: fd });
      const d = await r.json();
      if (d.error) { setError(d.error); }
      else { setImportMsg(d); await load(); }
    } catch (err) { setError(err.message); }
    finally { setImporting(false); if (fileRef.current) fileRef.current.value = ''; }
  };

  const setEnabled = async (rule, enabled) => {
    setBusy(b => ({...b, [rule.id]: true}));
    try {
      const fd = new FormData(); fd.append('enabled', enabled ? 'true' : 'false');
      await fetch(`/api/reason/rules/${rule.id}/enabled`, { method:'POST', body: fd });
      setRules(rs => rs.map(x => x.id === rule.id ? {...x, enabled} : x));
    } catch (e) { setError(e.message); }
    finally { setBusy(b => ({...b, [rule.id]: false})); }
  };

  const del = async (rule) => {
    setBusy(b => ({...b, [rule.id]: true}));
    try {
      await fetch(`/api/reason/rules/${rule.id}`, { method:'DELETE' });
      setRules(rs => rs.filter(x => x.id !== rule.id));
    } catch (e) { setError(e.message); }
    finally { setBusy(b => ({...b, [rule.id]: false})); }
  };

  const activeCount = (rules || []).filter(r => r.enabled).length;

  return (
    <div onClick={onClose}
      style={{position:'absolute',inset:0,zIndex:60,background:'rgba(0,0,0,.18)',display:'flex',justifyContent:'flex-end'}}>
      <div onClick={e => e.stopPropagation()}
        style={{width:'min(460px,92%)',height:'100%',background:'var(--surface)',borderLeft:'1px solid var(--border)',display:'flex',flexDirection:'column',boxShadow:'-4px 0 24px rgba(0,0,0,.08)'}}>
        <div style={{padding:'16px 20px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontFamily:'var(--sans)',fontSize:17,fontWeight:600,color:'var(--text)'}}>Your rules</div>
            <div style={{fontSize:12,color:'var(--text3)',marginTop:2}}>
              Corrections you've taught BoneMind {rules ? `· ${activeCount} active of ${rules.length}` : ''}
            </div>
          </div>
          <button onClick={onClose} style={{background:'transparent',border:'none',fontSize:20,color:'var(--text3)',cursor:'pointer'}}>×</button>
        </div>
        <div style={{padding:'10px 20px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <input ref={fileRef} type="file" accept=".csv,.xlsx" onChange={onImportFile} style={{display:'none'}}/>
          <button disabled={importing} onClick={() => fileRef.current && fileRef.current.click()}
            style={{background:'var(--navy)',color:'#fff',border:'none',borderRadius:6,padding:'6px 12px',fontSize:13,cursor:'pointer'}}>
            {importing ? 'Importing…' : '⬆ Import CSV / Excel'}
          </button>
          <a href="/api/reason/rules/template" download
            style={{fontSize:12,color:'var(--text2)',textDecoration:'underline'}}>download template</a>
        </div>
        {importMsg && (
          <div style={{padding:'8px 20px',fontSize:12,background:'rgba(46,125,50,.06)',borderBottom:'1px solid var(--border)'}}>
            <div style={{color:'#2e7d32',fontWeight:600}}>Imported {importMsg.imported} rule{importMsg.imported===1?'':'s'}.</div>
            {(importMsg.skipped || []).length > 0 && (
              <div style={{marginTop:4,color:'var(--text2)'}}>
                Skipped {importMsg.skipped.length}:
                <ul style={{margin:'2px 0 0 16px',padding:0}}>
                  {importMsg.skipped.slice(0,8).map((s,i) => (
                    <li key={i}>row {s.row}{s.name?` (${s.name})`:''}: {s.reason}</li>
                  ))}
                  {importMsg.skipped.length > 8 && <li>…and {importMsg.skipped.length - 8} more</li>}
                </ul>
              </div>
            )}
          </div>
        )}
        <div style={{flex:1,overflowY:'auto',padding:'12px 20px'}}>
          {error && <div style={{color:'#b02020',fontSize:13,marginBottom:8}}>{error}</div>}
          {rules === null && <div style={{color:'var(--text3)',fontSize:13}}>Loading…</div>}
          {rules && rules.length === 0 && (
            <div style={{color:'var(--text3)',fontSize:13,lineHeight:1.6,marginTop:8}}>
              No rules yet. When you 👎 an answer and describe what's wrong, BoneMind proposes a rule;
              once you confirm it, it appears here and applies to every future answer.
            </div>
          )}
          {rules && rules.map(r => (
            <div key={r.id} style={{border:'1px solid var(--border)',borderRadius:8,padding:'10px 12px',marginBottom:10,opacity:r.enabled?1:.55,background:'var(--surface2)'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
                <div style={{flex:1}}>
                  <div style={{fontSize:13.5,fontWeight:600,color:'var(--text)'}}>{r.name}</div>
                  <div style={{fontSize:12,color:'var(--text2)',marginTop:3}}>{ruleSummary(r)}</div>
                  <div style={{fontSize:10,color:'var(--text3)',marginTop:4,textTransform:'uppercase',letterSpacing:.3,display:'flex',gap:6,alignItems:'center'}}>
                    <span>{r.kind === 'range' ? 'numeric range' : 'forbidden pattern'}</span>
                    {r.origin === 'imported' && <span style={{padding:'1px 5px',borderRadius:3,background:'rgba(46,90,130,.12)',color:'#2b5a82',letterSpacing:0}}>imported</span>}
                  </div>
                </div>
              </div>
              <div style={{display:'flex',gap:8,marginTop:8}}>
                <button disabled={busy[r.id]} onClick={() => setEnabled(r, !r.enabled)}
                  style={{background:r.enabled?'transparent':'var(--navy)',color:r.enabled?'var(--text2)':'#fff',border:'1px solid var(--border)',borderRadius:6,padding:'4px 10px',fontSize:12,cursor:'pointer'}}>
                  {r.enabled ? 'Disable' : 'Enable'}
                </button>
                <button disabled={busy[r.id]} onClick={() => del(r)}
                  style={{background:'transparent',color:'#b02020',border:'1px solid var(--border)',borderRadius:6,padding:'4px 10px',fontSize:12,cursor:'pointer'}}>
                  Delete
                </button>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function ReviewDialogue({ turn }) {
  const [open, setOpen] = useState(false);
  const rounds = (turn.rounds || []).filter(r => r.role === 'critic' || r.role === 'agent');
  const criticRounds = rounds.filter(r => r.role === 'critic');
  const literature = turn.literature || [];
  const kgFacts = (turn.kg && turn.kg.facts) || [];
  if (!criticRounds.length) return null;
  const finalVerdict = criticRounds[criticRounds.length - 1].verdict;
  const color = finalVerdict === 'accept' ? '#2e7d32'
              : finalVerdict === 'conflicting_evidence' ? '#8a5010'
              : '#b02020';
  const label = finalVerdict === 'accept'
    ? (criticRounds.length === 1 ? 'Critic: accepted on first review' : 'Critic: accepted after revision')
    : finalVerdict === 'conflicting_evidence'
    ? 'Critic: literature conflicts — both positions shown'
    : 'Critic: unresolved after revision';
  return (
    <div style={{marginTop:10,fontSize:12}}>
      <button onClick={() => setOpen(o => !o)}
        style={{background:'transparent',border:'1px solid var(--border)',borderRadius:6,padding:'4px 10px',fontSize:12,cursor:'pointer',color:'var(--text2)',display:'flex',alignItems:'center',gap:6}}>
        <span style={{color}}>●</span>
        <span>{label}</span>
        <span style={{color:'var(--text3)'}}>· {open ? 'hide' : 'show'} dialogue</span>
      </button>
      {open && (
        <div style={{marginTop:8,border:'1px solid var(--border)',borderRadius:6,padding:10,background:'var(--surface2)',display:'flex',flexDirection:'column',gap:10}}>
          {criticRounds.map((r, i) => (
            <div key={i}>
              <div style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:.3,marginBottom:4}}>
                Round {r.round} · Critic ({r.verdict === 'conflicting_evidence' ? 'conflicting evidence' : r.verdict})
                {r.user_override && <span style={{marginLeft:6,fontSize:10,padding:'1px 5px',borderRadius:3,background:'rgba(176,120,32,.15)',color:'#8a5010'}}>forced by your rule</span>}
              </div>
              {(r.notes || []).length > 0 && (
                <ul style={{margin:'2px 0 4px 18px',padding:0,color:'var(--text2)',lineHeight:1.5}}>
                  {r.notes.map((n,j) => <li key={j}>{n}</li>)}
                </ul>
              )}
              {r.majority && (
                <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>
                  <strong style={{color:'#2e7d32'}}>Majority:</strong> {r.majority}
                </div>
              )}
              {r.minority && (
                <div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>
                  <strong style={{color:'#8a5010'}}>Minority:</strong> {r.minority}
                </div>
              )}
              {r.suggested_revision && (
                <div style={{fontSize:12,color:'var(--text3)',fontStyle:'italic',marginTop:2}}>
                  Suggestion: {r.suggested_revision}
                </div>
              )}
            </div>
          ))}
          {literature.length > 0 && (
            <div style={{borderTop:'1px solid var(--border)',paddingTop:8}}>
              <div style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:.3,marginBottom:4}}>
                Evidence the critic reviewed
              </div>
              <ul style={{margin:'2px 0 0 18px',padding:0,color:'var(--text2)',lineHeight:1.5}}>
                {literature.map((p,j) => (
                  <li key={j}>
                    <strong>[L{p.rank}]</strong> {p.title}{p.year ? ` (${p.year})` : ''}
                    {typeof p.score === 'number' && <span style={{color:'var(--text3)'}}> · {p.score.toFixed(3)}</span>}
                  </li>
                ))}
              </ul>
            </div>
          )}
          {kgFacts.length > 0 && (
            <div style={{borderTop:'1px solid var(--border)',paddingTop:8}}>
              <div style={{fontSize:11,color:'var(--text3)',textTransform:'uppercase',letterSpacing:.3,marginBottom:4}}>
                Knowledge-graph facts the critic saw
              </div>
              <ul style={{margin:'2px 0 0 18px',padding:0,color:'var(--text2)',lineHeight:1.5}}>
                {kgFacts.map((f,j) => (
                  <li key={j}>{f.subject} <span style={{color:'var(--amber)'}}>[{f.relation}]</span> {f.object}</li>
                ))}
              </ul>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function FeedbackBar({ turn, onFeedback }) {
  const [polarity, setPolarity] = useState(turn._feedback_polarity || null);
  const [showInput, setShowInput] = useState(false);
  const [text, setText] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState('');

  const sendUp = async () => {
    if (polarity) return;
    setPolarity(1);
    try {
      await fetch('/api/reason/feedback', {
        method:'POST',
        body: (() => { const fd = new FormData(); fd.append('turn_id', turn.id); fd.append('polarity','1'); return fd; })(),
      });
      onFeedback && onFeedback({turn_id: turn.id, polarity: 1});
    } catch(e) { setError(e.message); setPolarity(null); }
  };

  const startDown = () => {
    if (polarity) return;
    setShowInput(true);
  };

  const submitDown = async () => {
    setSubmitting(true); setError('');
    try {
      const fd = new FormData();
      fd.append('turn_id', turn.id);
      fd.append('polarity', '-1');
      fd.append('question', turn.query);
      fd.append('answer', stripThinking(turn.answer || ''));
      fd.append('feedback_text', text);
      const resp = await fetch('/api/reason/feedback', { method:'POST', body: fd });
      const data = await resp.json();
      setPolarity(-1);
      setShowInput(false);
      onFeedback && onFeedback({turn_id: turn.id, polarity: -1, proposed_rule: data.proposed_rule, correction_id: data.correction_id});
    } catch(e) {
      setError(e.message);
    } finally {
      setSubmitting(false);
    }
  };

  const cancelDown = () => { setShowInput(false); setText(''); };

  const btn = (selected, color) => ({
    background: selected ? color : 'transparent',
    color: selected ? '#fff' : 'var(--text2)',
    border: '1px solid var(--border)',
    borderRadius: 6,
    padding: '3px 9px',
    fontSize: 13,
    cursor: polarity ? 'default' : 'pointer',
    opacity: polarity && !selected ? 0.4 : 1,
  });

  return (
    <div style={{marginTop:10}}>
      <div style={{display:'flex',gap:6,alignItems:'center'}}>
        <button style={btn(polarity===1, '#2e7d32')} onClick={sendUp} disabled={!!polarity}>👍</button>
        <button style={btn(polarity===-1, '#b02020')} onClick={startDown} disabled={!!polarity}>👎</button>
        {polarity === -1 && !showInput && <span style={{fontSize:12,color:'var(--text3)'}}>feedback saved</span>}
        {polarity === 1 && <span style={{fontSize:12,color:'var(--text3)'}}>thanks</span>}
        {error && <span style={{fontSize:12,color:'#b02020'}}>{error}</span>}
      </div>
      {showInput && (
        <div style={{marginTop:8,display:'flex',flexDirection:'column',gap:6}}>
          <textarea
            value={text}
            onChange={e => setText(e.target.value)}
            placeholder="What was wrong? Be specific — e.g. 'cortical modulus is 10–25 GPa, not 80'."
            style={{minHeight:60,padding:8,border:'1px solid var(--border)',borderRadius:6,fontFamily:'var(--sans)',fontSize:13,resize:'vertical',background:'var(--surface2)',color:'var(--text)'}}/>
          <div style={{display:'flex',gap:6}}>
            <button onClick={submitDown} disabled={submitting}
              style={{background:'var(--navy)',color:'#fff',border:'none',padding:'6px 14px',borderRadius:6,fontSize:13,cursor:'pointer'}}>
              {submitting ? 'Submitting…' : 'Submit feedback'}
            </button>
            <button onClick={cancelDown} disabled={submitting}
              style={{background:'transparent',color:'var(--text2)',border:'1px solid var(--border)',padding:'6px 14px',borderRadius:6,fontSize:13,cursor:'pointer'}}>
              Cancel
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function ProposedRuleCard({ proposal, onConfirm, onDismiss, correctionId }) {
  const [editable, setEditable] = useState(() => JSON.parse(JSON.stringify(proposal)));
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState('');

  if (!proposal) return null;
  if (proposal.kind === 'none') {
    return (
      <div style={{marginTop:10,padding:'8px 10px',border:'1px dashed var(--border)',borderRadius:6,fontSize:12,color:'var(--text3)'}}>
        Saved your correction. Couldn't extract a structured rule — {proposal.reason || 'too open-ended'}.
        <div style={{marginTop:4}}>
          <button onClick={onDismiss} style={{background:'transparent',color:'var(--text2)',border:'none',padding:0,fontSize:12,cursor:'pointer',textDecoration:'underline'}}>dismiss</button>
        </div>
      </div>
    );
  }

  const kind = editable.kind;
  const p = editable.params || {};

  const setParam = (k, v) => setEditable({...editable, params:{...p, [k]: v}});
  const setList  = (k, v) => setParam(k, v.split(',').map(s => s.trim()).filter(Boolean));

  const confirm = async () => {
    setSubmitting(true); setError('');
    try {
      const fd = new FormData();
      fd.append('name', editable.name || 'User rule');
      fd.append('kind', kind);
      fd.append('params', JSON.stringify(editable.params));
      if (correctionId) fd.append('source_correction_id', String(correctionId));
      const resp = await fetch('/api/reason/rules/confirm', { method:'POST', body: fd });
      const data = await resp.json();
      if (!data.ok) throw new Error(data.error || 'Failed to save');
      onConfirm && onConfirm(data.rule);
    } catch(e) {
      setError(e.message);
    } finally {
      setSubmitting(false);
    }
  };

  return (
    <div style={{marginTop:10,border:'1px solid var(--amber-border)',borderRadius:8,padding:10,background:'rgba(176,120,32,.05)'}}>
      <div style={{fontSize:12,fontWeight:500,color:'var(--text)',marginBottom:6}}>
        Proposed rule from your feedback
        <span style={{marginLeft:6,fontWeight:400,color:'var(--text3)'}}>· {kind === 'range' ? 'numeric range' : 'forbidden pattern'}</span>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:4,fontSize:12}}>
        <RuleField label="Name" value={editable.name} onChange={v => setEditable({...editable, name:v})}/>
        {kind === 'range' && <>
          <RuleField label="Unit" value={p.unit} onChange={v => setParam('unit', v)}/>
          <div style={{display:'flex',gap:6}}>
            <RuleField label="Min" value={p.lo} onChange={v => setParam('lo', parseFloat(v) || 0)}/>
            <RuleField label="Max" value={p.hi} onChange={v => setParam('hi', parseFloat(v) || 0)}/>
          </div>
          <RuleField label="Context terms" value={(p.context_terms||[]).join(', ')} onChange={v => setList('context_terms', v)}/>
          <RuleField label="Value terms"   value={(p.value_terms||[]).join(', ')}   onChange={v => setList('value_terms', v)}/>
        </>}
        {kind === 'forbid_pattern' && <>
          <RuleField label="Context terms"   value={(p.context_terms||[]).join(', ')}   onChange={v => setList('context_terms', v)}/>
          <RuleField label="Forbidden terms" value={(p.forbidden_terms||[]).join(', ')} onChange={v => setList('forbidden_terms', v)}/>
          <RuleField label="Exception terms" value={(p.exception_terms||[]).join(', ')} onChange={v => setList('exception_terms', v)}/>
          <RuleField label="Explanation" value={p.explanation} onChange={v => setParam('explanation', v)}/>
        </>}
      </div>
      <div style={{display:'flex',gap:6,marginTop:8}}>
        <button onClick={confirm} disabled={submitting}
          style={{background:'var(--navy)',color:'#fff',border:'none',padding:'6px 14px',borderRadius:6,fontSize:13,cursor:'pointer'}}>
          {submitting ? 'Saving…' : 'Confirm rule'}
        </button>
        <button onClick={onDismiss} disabled={submitting}
          style={{background:'transparent',color:'var(--text2)',border:'1px solid var(--border)',padding:'6px 14px',borderRadius:6,fontSize:13,cursor:'pointer'}}>
          Discard
        </button>
        {error && <span style={{fontSize:12,color:'#b02020',alignSelf:'center'}}>{error}</span>}
      </div>
    </div>
  );
}

function RuleField({ label, value, onChange }) {
  return (
    <label style={{display:'flex',gap:6,alignItems:'center',fontSize:12}}>
      <span style={{minWidth:110,color:'var(--text3)'}}>{label}</span>
      <input value={value ?? ''} onChange={e => onChange(e.target.value)}
        style={{flex:1,padding:'3px 6px',border:'1px solid var(--border)',borderRadius:4,fontFamily:'var(--sans)',fontSize:12,background:'var(--surface)',color:'var(--text)'}}/>
    </label>
  );
}

function PhysicalCheckBadge({ check }) {
  const passed = check.passed;
  const n = check.rule_count || 0;
  const userN = check.user_rule_count || 0;
  const vCount = (check.violations || []).length;
  const headerBg = passed ? 'rgba(46,125,50,.08)' : 'rgba(176,32,32,.08)';
  const headerColor = passed ? '#2e7d32' : '#b02020';
  return (
    <div style={{marginTop:12,border:'1px solid var(--border)',borderRadius:8,overflow:'hidden',fontSize:12}}>
      <div style={{padding:'6px 10px',background:headerBg,color:headerColor,fontWeight:500,display:'flex',justifyContent:'space-between'}}>
        <span>{passed ? '✓ Passed physical grounding' : `✗ ${vCount} violation${vCount===1?'':'s'} of physical grounding`}</span>
        <span style={{color:'var(--text3)',fontWeight:400}}>{n} rules checked{userN ? ` (${userN} your rule${userN===1?'':'s'})` : ''}</span>
      </div>
      {!passed && (
        <ul style={{margin:0,padding:'8px 10px 8px 26px',color:'var(--text2)',lineHeight:1.5}}>
          {check.violations.map((v,i) => (
            <li key={i}>
              <strong>{v.name}</strong>
              {v.source === 'user' && <span style={{marginLeft:4,fontSize:10,padding:'1px 5px',borderRadius:3,background:'rgba(176,120,32,.15)',color:'#8a5010'}}>your rule</span>}
              : {v.detail}
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

function ReasonTurn({ turn, proposed, onFeedback, onProposalDone }) {
  return (
    <>
      <div className="msg msg-user">
        <div className="msg-bubble"><div className="msg-text">{turn.query}</div></div>
      </div>
      <div className="msg msg-asst">
        <div className="msg-avatar"><BoneSVG size={34}/></div>
        <div className="msg-bubble">
          <div className="msg-text">{parseCit(stripThinking(turn.answer))}</div>

  );
}

function _ReasonTabArchived() {
  const [result, setResult]       = useState(null);
  const [loading, setLoading]     = useState(false);
  const [error, setError]         = useState('');
  const [elapsed, setElapsed]     = useState(null);
  const [covariates, setCovariates] = useState({...DEFAULT_COVARIATES});
  const [query, setQuery]           = useState('');

  // Phase 5 — active exploration / Surprises panel state.
  const [surprises,        setSurprisesPanel]        = useState(null);
  const [surprisesLoading, setSurprisesPanelLoading] = useState(false);
  const [surprisesError,   setSurprisesPanelError]   = useState('');

  // Phase 7/8 — agents panel state.
  const [agents,        setAgents]        = useState(null);
  const [agentsLoading, setAgentsLoading] = useState(false);
  const [agentsError,   setAgentsError]   = useState('');
  const [boneType,      setBoneType]      = useState('cortical');

  // Header toggle: 'reason' shows search/presets/result/surprises; 'agents'
  // shows only the Proposer/Critic panel.
  const [view, setView] = useState('reason');

  const loadSurprisesPanel = async (refresh = false) => {
    if (surprisesLoading) return;
    setSurprisesPanelLoading(true); setSurprisesPanelError('');
    try {
      const r = await fetch('/api/reason/explore' + (refresh ? '?refresh=true' : ''));
      const data = await r.json();
      if (data.error) setSurprisesPanelError(data.error);
      else setSurprisesPanel(data.candidates || []);
    } catch { setSurprisesPanelError('Could not run active exploration. Please try again.'); }
    setSurprisesPanelLoading(false);
  };

  const runAgents = async () => {
    if (agentsLoading) return;
    setAgentsLoading(true); setAgentsError('');
    try {
      const r = await fetch('/api/reason/agents', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({n_proposals: 2, bone_type: boneType}),
      });
      const data = await r.json();
      if (data.error) setAgentsError(data.error);
      else setAgents(data.proposals || []);
    } catch { setAgentsError('Could not run agents. Please try again.'); }
    setAgentsLoading(false);
  };

  // Lazy fetch on mount, gated by the Surprises feature flag so we don't
  // trigger the (cold) 25s SPECTER2 exploration run when the panel is hidden.
  useEffect(() => {
    if (SURPRISES_ENABLED && surprises === null && !surprisesLoading) {
      loadSurprisesPanel(false);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const runAsk = async (queryOverride) => {
    const q = (queryOverride ?? query).trim();
    if (!q || loading) return;
    setQuery(q);
    setLoading(true); setResult(null); setError(''); setElapsed(null);
    const t0 = performance.now();
    try {
      const r = await fetch('/api/reason/ask', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({query: q, covariates: covariates}),
      });
      const data = await r.json();
      setElapsed(((performance.now() - t0) / 1000).toFixed(2));
      if (data.error) setError(data.error);
      else setResult(data);
    } catch { setError('Could not run inference. Please try again.'); }
    setLoading(false);
  };

  const runPreset = async (preset) => {
    if (loading) return;
    // If the preset pins specific covariates (Phase 3 demos), sync the
    // panel to them so the user can see what the run is actually using.
    // The payload always reflects the (post-sync) panel state.
    let covariatesForRequest = covariates;
    if (preset.syncCovariates) {
      covariatesForRequest = {...DEFAULT_COVARIATES, ...preset.syncCovariates};
      setCovariates(covariatesForRequest);
    }
    setLoading(true); setResult(null); setError(''); setElapsed(null);
    const t0 = performance.now();
    try {
      const r = await fetch('/api/reason', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({preset: preset.id, covariates: covariatesForRequest}),
      });
      const data = await r.json();
      setElapsed(((performance.now() - t0) / 1000).toFixed(2));
      if (data.error) setError(data.error);
      else setResult(data);
    } catch { setError('Could not run inference. Please try again.'); }
    setLoading(false);
  };

  return (
    <div className="reason-tab">
      <div className="reason-hdr">
        <div style={{fontFamily:'var(--sans)',fontSize:24,marginBottom:12,color:'var(--text)',textAlign:'center'}}>
          Hypothesis Generator
        </div>
        <div className="reason-desc">
          {view === 'reason'
            ? 'Forward, abductive and counterfactual inference over a typed equation graph. Patient covariates reshape each law’s priors before propagation.'
            : 'A Proposer agent walks the equation graph and suggests novel (sweep_var → target) pairs. The deterministic engine evaluates each. A Critic agent searches the corpus and decides what is interesting.'}
        </div>
        <div className="reason-view-toggle">
          <button className={view === 'reason' ? 'active' : ''}
                  onClick={() => setView('reason')}>Reasoning</button>
          <button className={view === 'agents' ? 'active' : ''}
                  onClick={() => setView('agents')}>Agents</button>
        </div>
        {view === 'reason' && (
          <div className="reason-bar">
            <svg className="search-icon" width="17" height="17" viewBox="0 0 17 17" fill="none">
              <circle cx="7.5" cy="7.5" r="5" stroke="currentColor" strokeWidth="1.7"/>
              <path d="M11.5 11.5l3.5 3.5" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/>
            </svg>
            <input className="reason-input"
              placeholder="Ask in plain English — e.g. bone stiffness under cyclic load"
              value={query} onChange={e => setQuery(e.target.value)}
              onKeyDown={e => e.key==='Enter' && runAsk()} disabled={loading}/>
            <button className="reason-btn" onClick={() => runAsk()}
                    disabled={loading || !(query || '').trim()}>
              {loading ? <Spinner/> : 'Reason'}
            </button>
          </div>
        )}
      </div>

      <div className="reason-body">
        <ReasonSection
          view={view}
          presets={REASON_PRESETS}
          onRun={runPreset}
          loading={loading}
          result={result}
          error={error}
          elapsed={elapsed}
          covariates={covariates}
          onCovariatesChange={setCovariates}
          query={query}
          onQueryChange={setQuery}
          onAsk={runAsk}
          surprises={surprises}
          surprisesLoading={surprisesLoading}
          surprisesError={surprisesError}
          onSurprisesRefresh={() => loadSurprisesPanel(true)}
          agents={agents}
          agentsLoading={agentsLoading}
          agentsError={agentsError}
          onAgentsRun={runAgents}
          boneType={boneType}
          onBoneTypeChange={setBoneType}
        />
      </div>
    </div>
  );
}

// ── ANALYSE TAB ───────────────────────────────────────────────────────────────
function AnalyseTab() {
  const [imgURL, setImgURL]     = useState(null);
  const [report, setReport]     = useState(null);
  const [loading, setLoading]   = useState(false);
  const [drag, setDrag]         = useState(false);
  const fileRef = useRef(null);

  const processFile = async (file) => {
    if (!file || !file.type.startsWith('image/')) return;
    setImgURL(URL.createObjectURL(file));
    setReport(null); setLoading(true);
    try {
      const fd = new FormData(); fd.append('image', file);
      const r = await fetch('/api/analyse', { method:'POST', body:fd });
      setReport(await r.json());
    } catch { setReport({ error:true }); }
    setLoading(false);
  };

  const ConfBadge = ({ level }) => {
    const m = { HIGH:{bg:'#eaf5ee',color:'#1a7a4e',border:'#a8d8b8'}, MODERATE:{bg:'#fef5e4',color:'#a07010',border:'#f0d48a'}, LOW:{bg:'#fdeaea',color:'#b01c1c',border:'#f0a8a8'} };
    const s = m[level] || m.MODERATE;
    return <span className="badge" style={{background:s.bg,color:s.color,borderColor:s.border}}>Confidence: {level}</span>;
  };

  if (!imgURL) return (
    <div className="analyse-tab">
      <div className={`dropzone${drag?' drag':''}`}
        onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)}
        onDrop={e=>{e.preventDefault();setDrag(false);processFile(e.dataTransfer.files[0])}}
        onClick={()=>fileRef.current.click()}>
        <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={e=>processFile(e.target.files[0])}/>
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" className="dz-icon">
          <rect x="6" y="8" width="36" height="32" rx="4" stroke="currentColor" strokeWidth="1.8"/>
          <path d="M24 18v12M18 24l6-6 6 6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
        <div className="dz-title">Drop an X-ray or MRI here</div>
        <div className="dz-sub">or click to select · PNG, JPG</div>
      </div>
      <div className="analyse-note">BoneMind will generate a structured radiology report using LLaVA 13b. For research and educational use only.</div>
    </div>
  );

  return (
    <div className="analyse-tab">
      <div className="analysis-view">
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <img src={imgURL} alt="scan" className="scan-img"/>
          <button className="reupload" onClick={()=>{setImgURL(null);setReport(null);}}>Upload different image</button>
        </div>
        <div className="report-pane">
          {loading ? (
            <div className="report-loading"><Dots/><span>Generating radiology report…</span></div>
          ) : report && !report.error ? (
            <div>
              <div className="report-heading">
                <span>AI Radiology Report</span>
                {report.confidence && <ConfBadge level={report.confidence}/>}
              </div>
              <div className="report-disc">For research and educational use only. Not a clinical diagnosis.</div>
              {[['Modality',report.modality],['Image Quality',report.quality],['Bone Density',report.density],['Assessment',report.assessment],['Recommendation',report.recommendation]].map(([k,v]) => v && (
                <div key={k} className="report-row"><div className="report-key">{k}</div><div className="report-val">{v}</div></div>
              ))}
              {report.findings?.length > 0 && (
                <div className="report-row">
                  <div className="report-key">Findings</div>
                  <ul className="report-findings">{report.findings.map((f,i)=><li key={i}>{f}</li>)}</ul>
                </div>
              )}
            </div>
          ) : (
            <div className="report-loading">
              {report?.error ? 'Could not generate report. Ensure Ollama is running with llava:13b.' : 'Upload an image to start.'}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── APP SHELL ─────────────────────────────────────────────────────────────────
const TABS = [
  { id:'ask',     label:'BoneMind', icon:<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 2h11v8H8.5L5 13v-3H2V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/></svg> },
  { id:'search',  label:'BoneScholar', icon:<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="6.5" cy="6.5" r="4" stroke="currentColor" strokeWidth="1.5"/><path d="M10 10l3.5 3.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg> },
  { id:'reason',  label:'Reasoning',        icon:<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="2.5" cy="7.5" r="1.5" stroke="currentColor" strokeWidth="1.4"/><circle cx="7.5" cy="7.5" r="1.5" stroke="currentColor" strokeWidth="1.4"/><circle cx="12.5" cy="7.5" r="1.5" stroke="currentColor" strokeWidth="1.4"/><path d="M4 7.5h2M9 7.5h2" stroke="currentColor" strokeWidth="1.4"/></svg> },
  { id:'analyse', label:'Vision', icon:<svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="1.5" y="2.5" width="12" height="10" rx="1.5" stroke="currentColor" strokeWidth="1.5"/><circle cx="5.5" cy="6.5" r="1.5" stroke="currentColor" strokeWidth="1.3"/><path d="M1.5 10.5l4-3.5 3 2.5 2-2 3 3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg> },
];

function App() {
  const [tab, setTab]     = useState(() => localStorage.getItem('bl-tab') || 'ask');
  const [stats, setStats] = useState(null);

  useEffect(() => {
    fetch('/api/stats').then(r => r.json()).then(setStats).catch(() => {});
  }, []);

  const switchTab = id => { setTab(id); localStorage.setItem('bl-tab', id); };

  return (
    <div style={{display:'flex',height:'100vh',width:'100%',overflow:'hidden'}}>
      <aside className="sidebar">
        <div className="sb-logo">
          <div className="sb-logo-icon"><BoneSVG size={34}/></div>
          <span className="sb-logo-text">BoneMind</span>
        </div>
        <nav className="sb-nav">
          {TABS.map(t => (
            <button key={t.id} className={`sb-item${tab===t.id?' active':''}`} onClick={() => switchTab(t.id)}>
              <span className="sb-item-icon">{t.icon}</span>{t.label}
            </button>
          ))}
        </nav>
        <div className="sb-foot">
          <div className="corpus-badge">
            <div className="corpus-dot"/>
            {stats ? `${stats.chunks.toLocaleString()} embeddings indexed` : 'Loading…'}
          </div>
          {stats && (
            <div style={{fontSize:11,color:'var(--text3)',marginTop:4}}>
              {stats.graph_nodes?.toLocaleString()} nodes · {stats.graph_edges?.toLocaleString()} edges
            </div>
          )}
        </div>
      </aside>

      <main className="main">
        <div className={`panel${tab==='ask'?' active':''}`}>
          <AskTab totalChunks={stats?.chunks}/>
        </div>
        <div className={`panel-scroll${tab==='search'?' active':''}`}>
          <div className="panel-inner"><SearchTab totalChunks={stats?.chunks}/></div>
        </div>
        <div className={`panel${tab==='reason'?' active':''}`}>
          <ReasonTab/>
        </div>
        <div className={`panel-scroll${tab==='analyse'?' active':''}`}>
          <div className="panel-inner"><AnalyseTab/></div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
