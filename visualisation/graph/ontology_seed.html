            <script>function neighbourhoodHighlight(params) {
  // console.log("in nieghbourhoodhighlight");
  allNodes = nodes.get({ returnType: "Object" });
  // originalNodes = JSON.parse(JSON.stringify(allNodes));
  // if something is selected:
  if (params.nodes.length > 0) {
    highlightActive = true;
    var i, j;
    var selectedNode = params.nodes[0];
    var degrees = 2;

    // mark all nodes as hard to read.
    for (let nodeId in allNodes) {
      // nodeColors[nodeId] = allNodes[nodeId].color;
      allNodes[nodeId].color = "rgba(200,200,200,0.5)";
      if (allNodes[nodeId].hiddenLabel === undefined) {
        allNodes[nodeId].hiddenLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }
    var connectedNodes = network.getConnectedNodes(selectedNode);
    var allConnectedNodes = [];

    // get the second degree nodes
    for (i = 1; i < degrees; i++) {
      for (j = 0; j < connectedNodes.length; j++) {
        allConnectedNodes = allConnectedNodes.concat(
          network.getConnectedNodes(connectedNodes[j])
        );
      }
    }

    // all second degree nodes get a different color and their label back
    for (i = 0; i < allConnectedNodes.length; i++) {
      // allNodes[allConnectedNodes[i]].color = "pink";
      allNodes[allConnectedNodes[i]].color = "rgba(150,150,150,0.75)";
      if (allNodes[allConnectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[allConnectedNodes[i]].label =
          allNodes[allConnectedNodes[i]].hiddenLabel;
        allNodes[allConnectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // all first degree nodes get their own color and their label back
    for (i = 0; i < connectedNodes.length; i++) {
      // allNodes[connectedNodes[i]].color = undefined;
      allNodes[connectedNodes[i]].color = nodeColors[connectedNodes[i]];
      if (allNodes[connectedNodes[i]].hiddenLabel !== undefined) {
        allNodes[connectedNodes[i]].label =
          allNodes[connectedNodes[i]].hiddenLabel;
        allNodes[connectedNodes[i]].hiddenLabel = undefined;
      }
    }

    // the main node gets its own color and its label back.
    // allNodes[selectedNode].color = undefined;
    allNodes[selectedNode].color = nodeColors[selectedNode];
    if (allNodes[selectedNode].hiddenLabel !== undefined) {
      allNodes[selectedNode].label = allNodes[selectedNode].hiddenLabel;
      allNodes[selectedNode].hiddenLabel = undefined;
    }
  } else if (highlightActive === true) {
    // console.log("highlightActive was true");
    // reset all nodes
    for (let nodeId in allNodes) {
      // allNodes[nodeId].color = "purple";
      allNodes[nodeId].color = nodeColors[nodeId];
      // delete allNodes[nodeId].color;
      if (allNodes[nodeId].hiddenLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].hiddenLabel;
        allNodes[nodeId].hiddenLabel = undefined;
      }
    }
    highlightActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    // console.log("Nothing was selected");
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        // console.log(allNodes[nodeId]);
        // allNodes[nodeId].color = {};
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function filterHighlight(params) {
  allNodes = nodes.get({ returnType: "Object" });
  // if something is selected:
  if (params.nodes.length > 0) {
    filterActive = true;
    let selectedNodes = params.nodes;

    // hiding all nodes and saving the label
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = true;
      if (allNodes[nodeId].savedLabel === undefined) {
        allNodes[nodeId].savedLabel = allNodes[nodeId].label;
        allNodes[nodeId].label = undefined;
      }
    }

    for (let i=0; i < selectedNodes.length; i++) {
      allNodes[selectedNodes[i]].hidden = false;
      if (allNodes[selectedNodes[i]].savedLabel !== undefined) {
        allNodes[selectedNodes[i]].label = allNodes[selectedNodes[i]].savedLabel;
        allNodes[selectedNodes[i]].savedLabel = undefined;
      }
    }

  } else if (filterActive === true) {
    // reset all nodes
    for (let nodeId in allNodes) {
      allNodes[nodeId].hidden = false;
      if (allNodes[nodeId].savedLabel !== undefined) {
        allNodes[nodeId].label = allNodes[nodeId].savedLabel;
        allNodes[nodeId].savedLabel = undefined;
      }
    }
    filterActive = false;
  }

  // transform the object into an array
  var updateArray = [];
  if (params.nodes.length > 0) {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  } else {
    for (let nodeId in allNodes) {
      if (allNodes.hasOwnProperty(nodeId)) {
        updateArray.push(allNodes[nodeId]);
      }
    }
    nodes.update(updateArray);
  }
}

function selectNode(nodes) {
  network.selectNodes(nodes);
  neighbourhoodHighlight({ nodes: nodes });
  return nodes;
}

function selectNodes(nodes) {
  network.selectNodes(nodes);
  filterHighlight({nodes: nodes});
  return nodes;
}

function highlightFilter(filter) {
  let selectedNodes = []
  let selectedProp = filter['property']
  if (filter['item'] === 'node') {
    let allNodes = nodes.get({ returnType: "Object" });
    for (let nodeId in allNodes) {
      if (allNodes[nodeId][selectedProp] && filter['value'].includes((allNodes[nodeId][selectedProp]).toString())) {
        selectedNodes.push(nodeId)
      }
    }
  }
  else if (filter['item'] === 'edge'){
    let allEdges = edges.get({returnType: 'object'});
    // check if the selected property exists for selected edge and select the nodes connected to the edge
    for (let edge in allEdges) {
      if (allEdges[edge][selectedProp] && filter['value'].includes((allEdges[edge][selectedProp]).toString())) {
        selectedNodes.push(allEdges[edge]['from'])
        selectedNodes.push(allEdges[edge]['to'])
      }
    }
  }
  selectNodes(selectedNodes)
}</script>

 "label": "fatigue life", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003efatigue life\u003c/b\u003e\u003cbr\u003e\u003ci\u003eproperty\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eNumber of loading cycles to failure at a given stress amplitude; decreases with porosity and damage accumulation.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#F58518", "font": {"color": "#e6e6e6"}, "id": "vascular_porosity", "label": "vascular porosity", "shape": "dot", "size": 13.743491774985173, "title": "\u003cb\u003evascular porosity\u003c/b\u003e\u003cbr\u003e\u003ci\u003eproperty\u003c/i\u003e \u0026middot; degree 4\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003ePorosity fraction attributable to Haversian and Volkmann canals; increases with intracortical remodelling rate.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#FF9DA6", "font": {"color": "#e6e6e6"}, "id": "fracture_risk", "label": "fracture risk", "shape": "dot", "size": 22.628243106023042, "title": "\u003cb\u003efracture risk\u003c/b\u003e\u003cbr\u003e\u003ci\u003eclinical\u003c/i\u003e \u0026middot; degree 19\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eProbability of a fracture over a defined time period; the primary clinical endpoint for bone disease assessment.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#E45756", "font": {"color": "#e6e6e6"}, "id": "hyperparathyroidism", "label": "hyperparathyroidism", "shape": "dot", "size": 13.743491774985173, "title": "\u003cb\u003ehyperparathyroidism\u003c/b\u003e\u003cbr\u003e\u003ci\u003epathology\u003c/i\u003e \u0026middot; degree 4\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eExcess PTH leading to elevated bone resorption, hypercalcaemia, and reduced bone mineral density.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#F58518", "font": {"color": "#e6e6e6"}, "id": "fatigue_crack_growth_rate", "label": "fatigue crack growth rate", "shape": "dot", "size": 10.5, one matrix\u003c/b\u003e\u003cbr\u003e\u003ci\u003ematerial\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eAcid-extracted bone retaining collagen and BMPs; osteoinductive and used as bone graft extender.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#4C78A8", "font": {"color": "#e6e6e6"}, "id": "osteocyte_lacuna", "label": "osteocyte lacuna", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003eosteocyte lacuna\u003c/b\u003e\u003cbr\u003e\u003ci\u003estructure\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eEllipsoidal cavity within mineralised bone matrix housing a single osteocyte.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#4C78A8", "font": {"color": "#e6e6e6"}, "id": "collagen_matrix", "label": "collagen matrix", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003ecollagen matrix\u003c/b\u003e\u003cbr\u003e\u003ci\u003estructure\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eThree-dimensional network of type I collagen providing the organic scaffold of bone.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#E45756", "font": {"color": "#e6e6e6"}, "id": "osteoarthritis", "label": "osteoarthritis", "shape": "dot", "size": 10.5, "title": "\u003cb\u003eosteoarthritis\u003c/b\u003e\u003cbr\u003e\u003ci\u003epathology\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eDegenerative joint disease with cartilage loss, subchondral bone sclerosis, and osteophyte formation.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#4C78A8", "font": {"color": "#e6e6e6"}, "id": "cortical_shell", "label": "cortical shell", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003ecortical shell\u003c/b\u003e\u003cbr\u003e\u003ci\u003estructure\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eThin cortical envelope surrounding the cancellous core of vertebral bodies; critical for vertebral load transmission.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#F58518", "font": {"color": "#e6e6e6"}, "id": "elastic_modulus", "label": "elastic modulus", "shape": "dot", "size": 18.53842283272975, "title": "\u003cb\u003eelastic modulus\u003c/b\u003e\u003cbr\u003e\u003ci\u003eproperty\u003c/i\u003e \u0026middot; degree 11\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eStiffness of bone tissue; ratio of stress to strain in the elastic region (GPa). Anisotropic: higher in longitudinal direction.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#FF9DA6", "font": {"color": "#e6e6e6"}, "id": "DXA_measurement", "label": "DXA measurement", "shape": "dot", "size": 10.5, "title": "\u003cb\u003eDXA measurement\u003c/b\u003e\u003cbr\u003e\u003ci\u003eclinical\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eDual-energy X-ray absorptiometry; the clinical standard for measuring areal bone mineral density (g/cm\u00b2).\u003c/span\u003e"}, {"borderWidth": 1, "color": "#4C78A8", "font": {"color": "#e6e6e6"}, "id": "collagen_fibril", "label": "collagen fibril", "shape": "dot", "size": 12.832955112329406, "title": "\u003cb\u003ecollagen fibril\u003c/b\u003e\u003cbr\u003e\u003ci\u003estructure\u003c/i\u003e \u0026middot; degree 3\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eNanoscale rope-like type I collagen fibre providing tensile toughness to bone.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#54A24B", "font": {"color": "#e6e6e6"}, "id": "crack_bridging", "label": "crack bridging", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003ecrack bridging\u003c/b\u003e\u003cbr\u003e\u003ci\u003eprocess\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eIntact collagen fibrils or osteon fibres spanning a crack wake, exerting closure forces on the crack faces.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#FF9DA6", "font": {"color": "#e6e6e6"}, "id": "safety_factor", "label": "safety factor", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003esafety factor\u003c/b\u003e\u003cbr\u003e\u003ci\u003eclinical\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eRatio of fracture load to peak habitual load; values \u003c 1 indicate imminent fracture risk.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#54A24B", "font": {"color": "#e6e6e6"}, "id": "mineralisation", "label": "mineralisation", "shape": "dot", "size": 16.035239624290096, "title": "\u003cb\u003emineralisation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eprocess\u003c/i\u003e \u0026middot; degree 7\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eDeposition of hydroxyapatite into osteoid collagen matrix; primary mineralisation is rapid, secondary mineralisation continues over months.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#4C78A8", "font": {"color": "#e6e6e6"}, "id": "cortical_bone", "label": "cortical bone", "shape": "dot", "size": 18.53842283272975, "title": "\u003cb\u003ecortical bone\u003c/b\u003e\u003cbr\u003e\u003ci\u003estructure\u003c/i\u003e \u0026middot; degree 11\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eDense outer layer of bone forming the diaphysis and cortex of long bones; provides primary mechanical strength.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#72B7B2", "font": {"color": "#e6e6e6"}, "id": "Frost_mechanostat", "label": "Frost mechanostat", "shape": "dot", "size": 10.5, "title": "\u003cb\u003eFrost mechanostat\u003c/b\u003e\u003cbr\u003e\u003ci\u003emechanism\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eStrain-threshold model: bone remodels to maintain peak strain within a physiological \u0027mechanostat\u0027 window (~1000\u20133000 \u00b5\u03b5).\u003c/span\u003e"}, {"borderWidth": 1, "color": "#EECA3B", "font": {"color": "#e6e6e6"}, "id": "PTH", "label": "PTH", "shape": "dot", "size": 13.743491774985173, "title": "\u003cb\u003ePTH\u003c/b\u003e\u003cbr\u003e\u003ci\u003efactor\u003c/i\u003e \u0026middot; degree 4\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eParathyroid hormone; regulates calcium homeostasis; intermittent PTH is anabolic, continuous PTH is catabolic to bone.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#4C78A8", "font": {"color": "#e6e6e6"}, "id": "bone_marrow", "label": "bone marrow", "shape": "dot", "size": 8.0, "title": "\u003cb\u003ebone marrow\u003c/b\u003e\u003cbr\u003e\u003ci\u003estructure\u003c/i\u003e \u0026middot; degree 0\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eSoft tissue filling the medullary cavity; contains haematopoietic stem cells and adipocytes.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#E45756", "font": {"color": "#e6e6e6"}, "id": "osteomalacia", "label": "osteomalacia", "shape": "dot", "size": 12.832955112329406, "title": "\u003cb\u003eosteomalacia\u003c/b\u003e\u003cbr\u003e\u003ci\u003epathology\u003c/i\u003e \u0026middot; degree 3\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eDefective mineralisation of osteoid in adult bone, typically due to vitamin D deficiency or phosphate wasting.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#F58518", "font": {"color": "#e6e6e6"}, "id": "cortical_thickness", "label": "cortical thickness", "shape": "dot", "size": 16.70550563296124, "title": "\u003cb\u003ecortical thickness\u003c/b\u003e\u003cbr\u003e\u003ci\u003eproperty\u003c/i\u003e \u0026middot; degree 8\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eThickness of the cortical shell (mm); major determinant of whole-bone bending and torsional strength.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#EECA3B", "font": {"color": "#e6e6e6"}, "id": "advanced_glycation_endproduct", "label": "advanced glycation end-product", "shape": "dot", "size": 16.70550563296124, "title": "\u003cb 26middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eBone tissue formation; endochondral (via cartilage template) or intramembranous (direct from mesenchyme).\u003c/span\u003e"}, {"borderWidth": 1, "color": "#54A24B", "font": {"color": "#e6e6e6"}, "id": "non_enzymatic_glycation", "label": "non-enzymatic glycation", "shape": "dot", "size": 15.325390128958803, "title": "\u003cb\u003enon-enzymatic glycation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eprocess\u003c/i\u003e \u0026middot; degree 6\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eNon-enzymatic attachment of reducing sugars (glucose) to collagen, forming advanced glycation end-products (AGEs); accumulates with age.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#B279A2", "font": {"color": "#e6e6e6"}, "id": "bone_morphogenetic_protein", "label": "bone morphogenetic protein", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003ebone morphogenetic protein\u003c/b\u003e\u003cbr\u003e\u003ci\u003ematerial\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eOsteoinductive growth factor (BMP-2, BMP-7) that drives mesenchymal stem cell differentiation to osteoblasts.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#B279A2", "font": {"color": "#e6e6e6"}, "id": "composite_scaffold", "label": "composite scaffold", "shape": "dot", "size": 10.5, "title": "\u003cb\u003ecomposite scaffold\u003c/b\u003e\u003cbr\u003e\u003ci\u003ematerial\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eHybrid scaffold combining a polymer matrix (e.g. collagen, PLA) with a ceramic filler (e.g. HA, \u03b2-TCP).\u003c/span\u003e"}, {"borderWidth": 1, "color": "#BAB0AC", "font": {"color": "#e6e6e6"}, "id": "osteoblast", "label": "osteoblast", "shape": "dot", "size": 13.743491774985173, "title": "\u003cb\u003eosteoblast\u003c/b\u003e\u003cbr\u003e\u003ci\u003ecell\u003c/i\u003e \u0026middot; degree 4\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eBone-forming cell that synthesises type I collagen matrix and promotes mineralisation; differentiated from mesenchymal stem cells.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#F58518", "font": {"color": "#e6e6e6"}, "id": "apparent_density", "label": "apparent density", "shape": "dot", "size": 12.832955112329406, "title": "\u003cb\u003eapparent density\u003c/b\u003e\u003cbr\u003e\u003ci\u003eproperty\u003c/i\u003e \u0026middot; degree 3\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eMass of bone tissue per bulk volume including pores (g/cm\u00b3); relates to compressive strength by a power law.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#B279A2", "font": {"color": "#e6e6e6"}, "id": "bioglass", "label": "bioglass", "shape": "dot", "size": 10.5, "title": "\u003cb\u003ebioglass\u003c/b\u003e\u003cbr\u003e\u003ci\u003ematerial\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eBioactive silicate glass that forms a hydroxyapatite layer in vivo and bonds directly to bone.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#FF9DA6", "font": {"color": "#e6e6e6"}, "id": "FRAX_score", "label": "FRAX score", "shape": "dot", "size": 10.5, "title": "\u003cb\u003eFRAX score\u003c/b\u003e\u003cbr\u003e\u003ci\u003eclinical\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eWHO algorithm estimating 10-year probability of major osteoporotic fracture based on clinical risk factors and BMD.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#BAB0AC", "font": {"color": "#e6e6e6"}, "id": "osteocyte", "label": "osteocyte", "shape": "dot", "size": 12.832955112329406, "title": "\u003cb\u003eosteocyte\u003c/b\u003e\u003cbr\u003e\u003ci\u003ecell\u003c/i\u003e \u0026middot; degree 3\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eMature osteoblast embedded within osteocyte lacunae; primary mechanosensor of bone, orchestrates adaptive remodelling.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#EECA3B", "font": {"color": "#e6e6e6"}, "id": "bisphosphonate", "label": "bisphosphonate", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003ebisphosphonate\u003c/b\u003e\u003cbr\u003e\u003ci\u003efactor\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eAnti-resorptive drug class that inhibits osteoclast activity; first-line treatment for osteoporosis.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#9D755D", "font": {"color": "#e6e6e6"}, "id": "mesoscale", "label": "mesoscale", "shape": "dot", "size": 12.832955112329406, "title": "\u003cb\u003emesoscale\u003c/b\u003e\u003cbr\u003e\u003ci\u003escale\u003c/i\u003e \u0026middot; degree 3\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eLength scale of 0.5\u201310 mm; cortical and trabecular architecture, cortical shell thickness.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#4C78A8", "font": {"color": "#e6e6e6"}, "id": "woven_bone", "label": "woven bone", "shape": "dot", "size": 10.5, "title": "\u003cb\u003ewoven bone\u003c/b\u003e\u003cbr\u003e\u003ci\u003estructure\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eRapidly deposited immature bone with randomly oriented collagen fibrils; forms in fracture callus and foetal skeleton.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#4C78A8", "font": {"color": "#e6e6e6"}, "id": "circumferential_lamella", "label": "circumferential lamella", "shape": "dot", "size": 10.5, "title": "\u003cb\u003ecircumferential lamella\u003c/b\u003e\u003cbr\u003e\u003ci\u003estructure\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eLamellar layers encircling the entire outer (periosteal) or inner (endosteal) bone surface.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#EECA3B", "font": {"color": "#e6e6e6"}, "id": "mechanical_loading", "label": "mechanical loading", "shape": "dot", "size": 12.832955112329406, "title": "\u003cb\u003emechanical loading\u003c/b\u003e\u003cbr\u003e\u003ci\u003efactor\u003c/i\u003e \u0026middot; degree 3\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eExternal or muscular forces applied to the skeleton; the primary driver of adaptive bone remodelling.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#72B7B2", "font": {"color": "#e6e6e6"}, "id": "intracortical_remodelling", "label": "intracortical remodelling", "shape": "dot", "size": 12.832955112329406, "title": "\u003cb\u003eintracortical remodelling\u003c/b\u003e\u003cbr\u003e\u003ci\u003emechanism\u003c/i\u003e \u0026middot; degree 3\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eHaversian remodelling process creating secondary osteons by tunnelling through cortical bone.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#EECA3B", "font": {"color": "#e6e6e6"}, "id": "IGF1", "label": "IGF-1", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003eIGF-1\u003c/b\u003e\u003cbr\u003e\u003ci\u003efactor\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eInsulin-like growth factor 1; stimulates osteoblast proliferation and collagen synthesis; mediates growth hormone effects on bone.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#B279A2", "font": {"color": "#e6e6e6"}, "id": "bioactive_coating", "label": "bioactive coating", "shape": "dot", "size": 10.5, "title": "\u003cb\u003ebioactive coating\u003c/b\u003e\u003cbr\u003e\u003ci\u003ematerial\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eSurface treatment (e.g. HA coating, plasma spray) promoting osseointegration of metallic implants.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#54A24B", "font": {"color": "#e6e6e6"}, "id": "bone_resorption", "label": "bone resorption", "shape": "dot", "size": 21.195079107728944, "title": "\u003cb\u003ebone resorption\u003c/b\u003e\u003cbr\u003e\u003ci\u003eprocess\u003c/i\u003e \u0026middot; degree 16\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eNet loss of bone tissue mass through osteoclastic activity; increases porosity and reduces mineral density.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#54A24B", "font": {"color": "#e6e6e6"}, "id": "bone_formation", "label": "bone formation", "shape": "dot", "size": 21.683883292296223, "title": "\u003cb\u003ebone formation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eprocess\u003c/i\u003e \u0026middot; degree 17\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eNet increase in bone tissue mass through osteoblastic activity; includes osteoid synthesis and mineralisation.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#E45756", "font": {"color": "#e6e6e6"}, "id": "rickets", "label": "rickets", "shape": "dot", "size": 10.5, "title": "\u003cb\u003erickets\u003c/b\u003e\u003cbr\u003e\u003ci\u003epathology\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eDefective mineralisation of growth plate cartilage in children, causing bowing of long bones.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#B279A2", "font": {"color": "#e6e6e6"}, "id": "beta_tricalcium_phosphate", "label": "beta-tricalcium phosphate", "shape": "dot", "size": 8.0, "title": "\u003cb\u003ebeta-tricalcium phosphate\u003c/b\u003e\u003cbr\u003e\u003ci\u003ematerial\u003c/i\u003e \u0026middot; degree 0\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eResorbable calcium phosphate ceramic (\u03b2-TCP) that is resorbed and replaced by new bone over months.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#54A24B", "font": {"color": "#e6e6e6"}, "id": "osteoclast_resorption", "label": "osteoclast resorption", "shape": "dot", "size": 19.649466050090165, "title": "\u003cb\u003eosteoclast resorption\u003c/b\u003e\u003cbr\u003e\u003ci\u003eprocess\u003c/i\u003e \u0026middot; degree 13\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eEnzymatic dissolution of mineralised bone matrix by osteoclasts; creates resorption lacunae (Howship\u0027s lacunae).\u003c/span\u003e"}, {"borderWidth": 1, "color": "#F58518", "font": {"color": "#e6e6e6"}, "id": "bone_mineral_density", "label": "bone mineral density", "shape": "dot", "size": 23.973262072459917, "title": "\u003cb\u003ebone mineral density\u003c/b\u003e\u003cbr\u003e\u003ci\u003eproperty\u003c/i\u003e \u0026middot; degree 22\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eAreal (DXA) or volumetric (QCT) mineral content (g/cm\u00b2); primary clinical surrogate for bone strength.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#E45756", "font": {"color": "#e6e6e6"}, "id": "hip_fracture", "label": "hip fracture", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003ehip fracture\u003c/b\u003e\u003cbr\u003e\u003ci\u003epathology\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eFracture of the proximal femur; major osteoporotic fracture type with high morbidity and mortality in the elderly.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#F58518", "font": {"color": "#e6e6e6"}, "id": "trabecular_spacing", "label": "trabecular spacing", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003etrabecular spacing\u003c/b\u003e\u003cbr\u003e\u003ci\u003eproperty\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eMean centre-to-centre distance between trabeculae (\u00b5m); increases with bone loss.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#72B7B2", "font": {"color": "#e6e6e6"}, "id": "minimum_effective_strain", "label": "minimum effective strain", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003eminimum effective strain\u003c/b\u003e\u003cbr\u003e\u003ci\u003emechanism\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eStrain threshold (~1000 \u00b5\u03b5) below which bone resorption is preferentially triggered in the Frost mechanostat model.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#4C78A8", "font": {"color": "#e6e6e6"}, "id": "osteon", "label": "osteon", "shape": "dot", "size": 16.70550563296124, "title": "\u003cb\u003eosteon\u003c/b\u003e\u003cbr\u003e\u003ci\u003estructure\u003c/i\u003e \u0026middot; degree 8\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eBasic structural unit of cortical bone (Haversian system); cylindrical lamellar structure surrounding a central canal.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#B279A2", "font": {"color": "#e6e6e6"}, "id": "porous_scaffold", "label": "porous scaffold", "shape": "dot", "size": 10.5, "title": "\u003cb\u003eporous scaffold\u003c/b\u003e\u003cbr\u003e\u003ci\u003ematerial\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eThree-dimensional porous structure supporting bone ingrowth; pore size 100\u2013500 \u00b5m optimal for vascularisation.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#FF9DA6", "font": {"color": "#e6e6e6"}, "id": "energy_absorption", "label": "energy absorption", "shape": "dot", "size": 10.5, "title": "\u003cb\u003eenergy absorption\u003c/b\u003e\u003cbr\u003e\u003ci\u003eclinical\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eTotal energy absorbed before fracture (area under load-displacement curve); governs impact resistance.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#F58518", "font": {"color": "#e6e6e6"}, "id": "collagen_crosslink_density", "label": "collagen crosslink density", "shape": "dot", "size": 17.95267926383743, "title": "\u003cb\u003ecollagen crosslink density\u003c/b\u003e\u003cbr\u003e\u003ci\u003eproperty\u003c/i\u003e \u0026middot; degree 10\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eNumber of inter-molecular collagen bonds per unit volume; enzymatic crosslinks increase toughness; AGE crosslinks reduce it.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#E45756", "font": {"color": "#e6e6e6"}, "id": "fragility_fracture", "label": "fragility fracture", "shape": "dot", "size": 12.832955112329406, "title": "\u003cb\u003efragility fracture\u003c/b\u003e\u003cbr\u003e\u003ci\u003epathology\u003c/i\u003e \u0026middot; degree 3\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eFracture from low-energy trauma (e.g. fall from standing height) due to compromised bone strength.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#54A24B", "font": {"color": "#e6e6e6"}, "id": "fracture_healing", "label": "fracture healing", "shape": "dot", "size": 10.5, "title": "\u003cb\u003efracture healing\u003c/b\u003e\u003cbr\u003e\u003ci\u003eprocess\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eSequential repair of bone through haematoma formation, soft callus, hard callus mineralisation, and remodelling.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#F58518", "font": {"color": "#e6e6e6"}, "id": "tensile_strength", "label": "tensile strength", "shape": "dot", "size": 12.832955112329406, "title": "\u003cb\u003etensile strength\u003c/b\u003e\u003cbr\u003e\u003ci\u003eproperty\u003c/i\u003e \u0026middot; degree 3\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eMaximum tensile stress before failure; lower than compressive strength due to crack sensitivity.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#72B7B2", "font": {"color": "#e6e6e6"}, "id": "crack_bridging_toughening", "label": "crack bridging toughening", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003ecrack bridging toughening\u003c/b\u003e\u003cbr\u003e\u003ci\u003emechanism\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eExtrinsic toughening mechanism: intact collagen fibrils bridge crack faces in the crack wake, applying closing forces.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#4C78A8", "font": {"color": "#e6e6e6"}, "id": "Volkmann_canal", "label": "Volkmann canal", "shape": "dot", "size": 10.5, "title": "\u003cb\u003eVolkmann canal\u003c/b\u003e\u003cbr\u003e\u003ci\u003estructure\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eTransverse perforating canal connecting Haversian canals and the periosteum/endosteum, carrying blood vessels.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#F58518", "font": {"color": "#e6e6e6"}, "id": "trabecular_thickness", "label": "trabecular thickness", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003etrabecular thickness\u003c/b\u003e\u003cbr\u003e\u003ci\u003eproperty\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eAverage thickness of individual trabeculae (\u00b5m); thinner trabeculae buckle at lower loads.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#54A24B", "font": {"color": "#e6e6e6"}, "id": "fatigue_crack_initiation", "label": "fatigue crack initiation", "shape": "dot", "size": 10.5, "title": "\u003cb\u003efatigue crack initiation\u003c/b\u003e\u003cbr\u003e\u003ci\u003eprocess\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eNucleation of a crack under cyclic loading below the yield stress; occurs preferentially at lacunae and cement lines.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#E45756", "font": {"color": "#e6e6e6"}, "id": "stress_fracture", "label": "stress fracture", "shape": "dot", "size": 10.5, "title": "\u003cb\u003estress fracture\u003c/b\u003e\u003cbr\u003e\u003ci\u003epathology\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eFatigue fracture arising from repetitive subthreshold loading without adequate recovery time for remodelling.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#E45756", "font": {"color": "#e6e6e6"}, "id": "vertebral_fracture", "label": "vertebral fracture", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003evertebral fracture\u003c/b\u003e\u003cbr\u003e\u003ci\u003epathology\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eCompression fracture of a vertebral body; most common osteoporotic fracture, often clinically silent.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#54A24B", "font": {"color": "#e6e6e6"}, "id": "targeted_remodelling", "label": "targeted remodelling", "shape": "dot", "size": 13.743491774985173, "title": "\u003cb\u003etargeted remodelling\u003c/b\u003e\u003cbr\u003e\u003ci\u003eprocess\u003c/i\u003e \u0026middot; degree 4\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eRemodelling specifically directed at microdamage sites, triggered by osteocyte apoptosis and canalicular signalling.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#54A24B", "font": {"color": "#e6e6e6"}, "id": "bone_remodelling", "label": "bone remodelling", "shape": "dot", "size": 16.035239624290096, "title": "\u003cb\u003ebone remodelling\u003c/b\u003e\u003cbr\u003e\u003ci\u003eprocess\u003c/i\u003e \u0026middot; degree 7\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eCoordinated coupled cycle of osteoclastic resorption followed by osteoblastic formation; renews ~10% of skeleton per year.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#4C78A8", "font": {"color": "#e6e6e6"}, "id": "secondary_osteon", "label": "secondary osteon", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003esecondary osteon\u003c/b\u003e\u003cbr\u003e\u003ci\u003estructure\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eOsteon formed by intracortical remodelling, replacing pre-existing bone with a new lamellar cylinder.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#4C78A8", "font": {"color": "#e6e6e6"}, "id": "osteoid", "label": "osteoid", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003eosteoid\u003c/b\u003e\u003cbr\u003e\u003ci\u003estructure\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eUnmineralised collagen matrix secreted by osteoblasts prior to mineralisation; a transient pre-bone tissue.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#F58518", "font": {"color": "#e6e6e6"}, "id": "stiffness", "label": "stiffness", "shape": "dot", "size": 13.743491774985173, "title": "\u003cb\u003estiffness\u003c/b\u003e\u003cbr\u003e\u003ci\u003eproperty\u003c/i\u003e \u0026middot; degree 4\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eStructural resistance to deformation (force/displacement); depends on both material modulus and geometry.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#F58518", "font": {"color": "#e6e6e6"}, "id": "toughness", "label": "toughness", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003etoughness\u003c/b\u003e\u003cbr\u003e\u003ci\u003eproperty\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eTotal energy absorbed per unit volume before fracture (J/m\u00b2); requires both strength and ductility.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#B279A2", "font": {"color": "#e6e6e6"}, "id": "hydroxyapatite_scaffold", "label": "hydroxyapatite scaffold", "shape": "dot", "size": 10.5, "title": "\u003cb\u003ehydroxyapatite scaffold\u003c/b\u003e\u003cbr\u003e\u003ci\u003ematerial\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eSynthetic hydroxyapatite ceramic scaffold for bone substitution; osteoconductive but brittle.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#4C78A8", "font": {"color": "#e6e6e6"}, "id": "collagen_crosslink", "label": "collagen crosslink", "shape": "dot", "size": 10.5, "title": "\u003cb\u003ecollagen crosslink\u003c/b\u003e\u003cbr\u003e\u003ci\u003estructure\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eBiochemical bond between adjacent collagen molecules stabilising fibril structure; enzymatic and non-enzymatic forms exist.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#F58518", "font": {"color": "#e6e6e6"}, "id": "mineral_crystallinity", "label": "mineral crystallinity", "shape": "dot", "size": 13.743491774985173, "title": "\u003cb\u003emineral crystallinity\u003c/b\u003e\u003cbr\u003e\u003ci\u003eproperty\u003c/i\u003e \u0026middot; degree 4\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eDegree of crystalline order in hydroxyapatite assessed by FTIR or XRD; increases with secondary mineralisation and age.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#B279A2", "font": {"color": "#e6e6e6"}, "id": "PEEK_implant", "label": "PEEK implant", "shape": "dot", "size": 10.5, "title": "\u003cb\u003ePEEK implant\u003c/b\u003e\u003cbr\u003e\u003ci\u003ematerial\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003ePolyetheretherketone implant; radiolucent and modulus-matched to cortical bone, reducing stress shielding.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#EECA3B", "font": {"color": "#e6e6e6"}, "id": "TGF_beta", "label": "TGF-\u03b2", "shape": "dot", "size": 12.832955112329406, "title": "\u003cb\u003eTGF-\u03b2\u003c/b\u003e\u003cbr\u003e\u003ci\u003efactor\u003c/i\u003e \u0026middot; degree 3\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eTransforming growth factor beta; released from matrix during resorption; couples resorption to formation by recruiting osteoblasts.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#FF9DA6", "font": {"color": "#e6e6e6"}, "id": "impact_resistance", "label": "impact resistance", "shape": "dot", "size": 10.5, "title": "\u003cb\u003eimpact resistance\u003c/b\u003e\u003cbr\u003e\u003ci\u003eclinical\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eAbility to absorb energy from impact or dynamic loading; governed by toughness and energy absorption.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#54A24B", "font": {"color": "#e6e6e6"}, "id": "collagen_crosslinking", "label": "collagen crosslinking", "shape": "dot", "size": 14.566319511009418, "title": "\u003cb\u003ecollagen crosslinking\u003c/b\u003e\u003cbr\u003e\u003ci\u003eprocess\u003c/i\u003e \u0026middot; degree 5\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eFormation of enzymatic inter-molecular pyridinoline and deoxypyridinoline bonds stabilising collagen fibrils.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#EECA3B", "font": {"color": "#e6e6e6"}, "id": "glucocorticoid", "label": "glucocorticoid", "shape": "dot", "size": 13.743491774985173, "title": "\u003cb\u003eglucocorticoid\u003c/b\u003e\u003cbr\u003e\u003ci\u003efactor\u003c/i\u003e \u0026middot; degree 4\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eCorticosteroid drug (e.g. prednisolone) causing secondary osteoporosis at high or prolonged doses.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#E45756", "font": {"color": "#e6e6e6"}, "id": "osteogenesis_imperfecta", "label": "osteogenesis imperfecta", "shape": "dot", "size": 12.832955112329406, "title": "\u003cb\u003eosteogenesis imperfecta\u003c/b\u003e\u003cbr\u003e\u003ci\u003epathology\u003c/i\u003e \u0026middot; degree 3\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eGenetic disorder of type I collagen causing brittle bone disease; ranges from mild to perinatally lethal.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#72B7B2", "font": {"color": "#e6e6e6"}, "id": "stress_shielding", "label": "stress shielding", "shape": "dot", "size": 13.743491774985173, "title": "\u003cb\u003estress shielding\u003c/b\u003e\u003cbr\u003e\u003ci\u003emechanism\u003c/i\u003e \u0026middot; degree 4\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eReduction of bone strain adjacent to a stiff implant; chronically reduced strain triggers resorption per the mechanostat.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#B279A2", "font": {"color": "#e6e6e6"}, "id": "fibrin_scaffold", "label": "fibrin scaffold", "shape": "dot", "size": 10.5, "title": "\u003cb\u003efibrin scaffold\u003c/b\u003e\u003cbr\u003e\u003ci\u003ematerial\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eProtein scaffold derived from fibrinogen and thrombin; promotes cell adhesion and angiogenesis.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#E45756", "font": {"color": "#e6e6e6"}, "id": "osteopenia", "label": "osteopenia", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003eosteopenia\u003c/b\u003e\u003cbr\u003e\u003ci\u003epathology\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eLow bone mass (T-score between \u22121 and \u22122.5); an intermediate state with elevated but not osteoporotic fracture risk.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#EECA3B", "font": {"color": "#e6e6e6"}, "id": "OPG", "label": "OPG", "shape": "dot", "size": 12.832955112329406, "title": "\u003cb\u003eOPG\u003c/b\u003e\u003cbr\u003e\u003ci\u003efactor\u003c/i\u003e \u0026middot; degree 3\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eOsteoprotegerin; decoy receptor for RANKL produced by osteoblasts; inhibits osteoclastogenesis and bone resorption.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#4C78A8", "font": {"color": "#e6e6e6"}, "id": "mineralized_collagen_fibril", "label": "mineralised collagen fibril", "shape": "dot", "size": 14.566319511009418, "title": "\u003cb\u003emineralised collagen fibril\u003c/b\u003e\u003cbr\u003e\u003ci\u003estructure\u003c/i\u003e \u0026middot; degree 5\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eCollagen fibril with hydroxyapatite platelets deposited within and around it; the basic nanoscale building block of bone.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#54A24B", "font": {"color": "#e6e6e6"}, "id": ": "\u003cb\u003eestrogen\u003c/b\u003e\u003cbr\u003e\u003ci\u003efactor\u003c/i\u003e \u0026middot; degree 6\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eSex steroid hormone that inhibits osteoclast activity and promotes bone formation; deficiency drives postmenopausal bone loss.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#FF9DA6", "font": {"color": "#e6e6e6"}, "id": "load_bearing_capacity", "label": "load-bearing capacity", "shape": "dot", "size": 10.5, "title": "\u003cb\u003eload-bearing capacity\u003c/b\u003e\u003cbr\u003e\u003ci\u003eclinical\u003c/i\u003e \u0026middot; degree 1\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eMaximum load a bone structure can sustain before failure.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#EECA3B", "font": {"color": "#e6e6e6"}, "id": "aging", "label": "aging", "shape": "dot", "size": 19.649466050090165, "title": "\u003cb\u003eaging\u003c/b\u003e\u003cbr\u003e\u003ci\u003efactor\u003c/i\u003e \u0026middot; degree 13\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eProgressive biological and microstructural deterioration of bone with age; increases AGEs, porosity, and fracture risk.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#72B7B2", "font": {"color": "#e6e6e6"}, "id": "coupling_remodelling", "label": "coupling of remodelling", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003ecoupling of remodelling\u003c/b\u003e\u003cbr\u003e\u003ci\u003emechanism\u003c/i\u003e \u0026middot; degree 2\u003cbr\u003e\u003cspan style=\u0027color:#aaa\u0027\u003eBiochemical linkage ensuring osteoclast resorption is followed by osteoblast formation at the same site.\u003c/span\u003e"}, {"borderWidth": 1, "color": "#4C78A8", "font": {"color": "#e6e6e6"}, "id": "mineral_platelet", "label": "mineral platelet", "shape": "dot", "size": 11.789291416275995, "title": "\u003cb\u003emineral platelet\u003c/b\u003e\u003cbr\u003e\u003ci\u003estructure\u003c/i\u003e \u0026middot; degree 2\u003c
